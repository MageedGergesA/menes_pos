<!doctype html>
<!-- Mezze Self-Service Kiosk — V2.
     Implements the APPROVED Claude Design "Mezze Kiosk v2": vertical category rail,
     image-first 3-up grid (5-up landscape), product detail, meal summary with a focused
     choice screen per component, cart, review, payment, success and privacy reset.

     Every VALUE on this screen comes from Odoo: the menu, prices, tax, currency,
     service choices, payment capability and order number. The design decides how it
     looks; the branch's own configuration decides what it says. The product
     configuration RULES are the certified shared engine (design/product-config.js) —
     this page never re-implements qty_max, qty_free, base_price or extra_price. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mezze Kiosk</title>
<link rel="stylesheet" href="design/foundation.css?v=f5">
<link rel="stylesheet" href="design/components.css?v=f5">
<!-- the canonical Mezze theme registry (Light / Dark / Mezze High Contrast). The kiosk
     CONSUMES --mz-* tokens; it never defines them from local names, which is what used
     to shadow the registry and block High Contrast on this surface. -->
<link rel="stylesheet" href="mezze-design.css?v=d3">
<link rel="stylesheet" href="design/kiosk-v2.css?v=v2x">
<style>
/* Local aliases only: every value below READS a canonical token, so Light, Dark and
   Mezze High Contrast all reach this surface unchanged. The fallbacks are the approved
   design's own values for a branch running without the registry. */
:root{
  /* the canonical alias names this product already uses on every customer surface */
  --bg:var(--mz-canvas);
  --card:var(--mz-surface);
  --card2:var(--mz-surface-2);
  --line:var(--mz-border);
  --txt:var(--mz-text);
  --mut:var(--mz-text-mut);
  --acc:var(--mz-brand);
  --acc2:var(--mz-brand-hover);
  --ok:var(--mz-ok);
  --danger:var(--mz-danger);
  /* the kiosk's own layout tokens read those, so the registry reaches every rule */
  --k-bg:var(--bg);
  --k-surface:var(--card);
  --k-surface-2:var(--card2);
  --k-media:var(--mz-surface-3);
  --k-line:var(--line);
  --k-line-2:var(--mz-border-strong);
  --k-ink:var(--txt);
  --k-ink-2:var(--mz-text-2);
  --k-ink-3:var(--mut);
  --k-brand:var(--acc);
  --k-brand-ink:var(--mz-on-brand);
  --k-ok:var(--ok);
  --k-warn:var(--mz-warn);
  --k-danger:var(--danger);
  /* the soft tier. The stylesheet asked for these from the first V2 commit; without the
     aliases every soft fill was an invalid value and simply did not paint. */
  --k-brand-soft:var(--mz-brand-soft);
  --k-ok-soft:var(--mz-ok-soft);
  --k-warn-soft:var(--mz-warn-soft);
  --k-danger-soft:var(--mz-danger-soft);
  --k-info:var(--mz-info);
  --k-info-soft:var(--mz-info-soft);
  --k-ink-4:var(--mz-text-faint);
}
/* F5: the vendored family is 'IBM Plex Sans Arabic'; ask for the canonical token so
   Arabic body text never silently falls back to a Latin face. */
:root[dir="rtl"] body{font-family:var(--mz-font-ar,'IBM Plex Sans Arabic','Hanken Grotesk',system-ui,sans-serif)}
/* the canonical stepper at kiosk scale — layout only; the component owns everything else */
.k-step.mz-stepper .mz-stepper__btn{min-width:calc(72px * var(--k-s));min-height:calc(72px * var(--k-s));
  font-size:calc(36px * var(--k-s))}
.k-step.mz-stepper .mz-stepper__value{min-width:calc(76px * var(--k-s));font-size:calc(48px * var(--k-s));
  font-weight:700;font-variant-numeric:tabular-nums}
</style>
<script>/* canonical appearance bootstrap — stamps data-appearance / data-mz-theme /
   data-mz-mode before first paint so the shared registry applies, High Contrast
   included. Identical to the other production surfaces. */
(function(){try{var p=new URLSearchParams(location.search),o={};try{o=JSON.parse(localStorage.getItem('mzSettings.v1')||'{}')||{}}catch(e){}
var h=document.documentElement,L=['classic','corporate','coastal','forest','coffeehouse','highcontrast'],D=['midnight','lounge','graphite','forestnight','slate','highcontrast'];
var mp=p.get('mzmode')||p.get('mode')||o.app_mode||o.mode||'light',mode=(mp==='system')?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):(mp==='dark'?'dark':'light');
var req=p.get('mztheme')||p.get('theme');
var hc=(req==='highcontrast')||(o.ac_contrast||o.highContrast);
var th=hc?'highcontrast':(mode==='dark'?(D.indexOf(req||(o.app_dark_theme||o.darkTheme))>=0?(req||(o.app_dark_theme||o.darkTheme)):'lounge'):(L.indexOf(req||(o.app_theme||o.lightTheme))>=0?(req||(o.app_theme||o.lightTheme)):'classic'));
h.setAttribute('data-appearance','mezze');h.setAttribute('data-theme',mode);h.setAttribute('data-mz-mode',mode);h.setAttribute('data-mz-theme',th);
h.setAttribute('data-mz-accent',p.get('mzaccent')||(o.app_accent||o.accent)||'terracotta');}catch(e){}})();</script>
<script src="design/product-config.js?v=v2n"></script>
<script src="design/customer-config.js?v=v2t"></script>
</head>
<body>
<div class="k-net k-hide" id="k-net"></div>

<div class="k-shell" id="k-shell">

  <!-- WELCOME -->
  <section class="k-welcome" id="s-welcome">
    <img class="k-hero k-hide" id="k-hero" alt="">
    <div class="k-welcome__v"></div>
    <div class="k-welcome__c">
      <div class="k-welcome__id">
        <h1 class="k-welcome__n" id="k-wname">MEZZE</h1>
        <div class="k-welcome__r"></div>
        <p class="k-welcome__s" id="k-wsub"></p>
      </div>
      <div class="k-welcome__act">
        <button type="button" class="k-hero-cta" id="k-start" disabled></button>
        <div class="k-langs" id="k-langs"></div>
      </div>
    </div>
  </section>

  <!-- SERVICE MODE -->
  <section class="k-center k-hide" id="s-service">
    <div class="k-svchead">
      <h1 class="k-svcq" id="k-svcq"></h1>
      <p class="k-svcs" id="k-svcs"></p>
    </div>
    <div class="k-choices" id="k-svcopts"></div>
  </section>

  <!-- MENU + CART + REVIEW + PAY + DETAIL share the shell chrome -->
  <div class="k-hide" id="s-app" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <header class="k-top" id="k-topbar">
      <span class="k-brand" id="k-brand">MEZZE</span>
      <button type="button" class="k-pill k-pill--svc k-hide" id="k-svcchip"></button>
      <span class="k-top__sp"></span>
      <button type="button" class="k-pill" id="k-lang" lang="ar"></button>
      <button type="button" class="k-pill" id="k-restart"></button>
    </header>

    <div class="k-sub k-hide" id="k-subbar">
      <button type="button" class="k-back" id="k-back">
        <svg viewBox="0 0 24 24" class="k-i"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="k-backl"></span>
      </button>
      <span class="k-sub__t" id="k-subt"></span>
      <span style="width:120px"></span>
    </div>

    <div class="k-main" id="k-main">
      <nav class="k-rail" id="k-rail" aria-label="Categories"></nav>
      <div class="k-body">
        <div class="k-head k-hide" id="k-headrow">
          <h1 class="k-title" id="k-secttl"></h1>
          <span class="k-count num" id="k-sectn"></span>
        </div>
        <div class="k-scroll" id="k-scroll" data-screen="1"></div>
      </div>
    </div>

    <footer class="k-bar" id="k-bar">
      <span class="k-bar__ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="k-i"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      </span>
      <span class="k-bar__txt">
        <span class="k-bar__l" id="k-barl"></span>
        <span class="k-bar__v" id="k-barv"></span>
      </span>
      <button type="button" class="k-cta" id="k-cta"></button>
    </footer>
  </div>

  <!-- SUCCESS -->
  <section class="k-center k-hide" id="s-done">
    <span class="k-okring" id="k-okring" aria-hidden="true">
      <svg viewBox="0 0 24 24" class="k-i"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.9 2.9L16.2 9.8"/></svg>
    </span>
    <h1 class="k-done__t" id="k-donet"></h1>
    <span class="k-numplate">
      <span class="k-numplate__l" id="k-donenuml"></span>
      <span class="k-num num" id="k-donenum">—</span>
    </span>
    <p class="k-done__s" id="k-dones"></p>
    <button type="button" class="k-hero-cta" id="k-newbtn"></button>
    <span class="k-count-down" id="k-count"></span>
  </section>
</div>

  /* the names this kiosk used before the vocabulary was completed, kept as aliases so
     one glyph has one definition */
  IC.meal=IC.restaurant; IC.grill=IC.outdoor_grill; IC.wrap=IC.kebab_dining;
  IC.dip=IC.rice_bowl; IC.bread=IC.bakery_dining; IC.side=IC.lunch_dining;
  IC.drink=IC.local_cafe; IC.dessert=IC.icecream; IC.cart=IC.shopping_cart;
  IC.globe=IC.language; IC.refresh=IC.sync; IC.dine=IC.table_restaurant;
  IC.bag=IC.takeout_dining; IC.store=IC.storefront; IC.trash=IC['delete'];
  IC.pencil=IC.edit; IC.warn=IC.error; IC.plus=IC.add; IC.wifioff=IC.wifi_off;
  function icon(n,cls){return '<svg viewBox="0 0 24 24" class="k-i '+(cls||'')+'">'+(IC[n]||IC.meal)+'</svg>';}
  /* A category shows an icon; the branch names its own categories, so the icon is
     chosen from the name it already has and falls back to a plate. */
  function catIcon(name){
    var n=(name||'').toLowerCase();
    if(/meal|combo|وجب/.test(n))return 'restaurant';
    if(/grill|bbq|مشو/.test(n))return 'outdoor_grill';
    if(/shawarma|wrap|kebab|شاورما|كباب/.test(n))return 'kebab_dining';
    if(/mezze|dip|salad|rice|مقبلات|سلط|أرز/.test(n))return 'rice_bowl';
    if(/bread|bakery|pastr|خبز|معجن|مخبوز/.test(n))return 'bakery_dining';
    if(/side|burger|sandwich|جانب|مقرمش|برجر/.test(n))return 'lunch_dining';
    if(/drink|juice|coffee|tea|مشروب|عصير|قهوة/.test(n))return 'local_cafe';
    if(/dessert|sweet|ice|حلو|آيس/.test(n))return 'icecream';
    if(/feature|popular|الكل|all/.test(n))return 'star';
    return 'restaurant';
  }

  /* ---------- network ------------------------------------------------------ */
  function call(path,body){
    return fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({store:STORE},body||{}))})
      .then(function(r){return r.json();})
      .then(function(d){ setNet(null); return d; })
      .catch(function(e){ setNet('offline'); throw e; });
  }
  function setNet(state){
    var el=$('#k-net');
    if(!state){ el.classList.add('k-hide'); return; }
    el.className='k-net'+(state==='offline'?' k-net--off':'');
    el.innerHTML=icon(state==='offline'?'wifioff':'refresh')+
      '<span>'+esc(t(state==='offline'?'offline':'reconnect'))+'</span>';
  }
  window.addEventListener('offline',function(){setNet('offline');});
  window.addEventListener('online',function(){setNet('reconnect');
    boot().then(function(){setNet(null);});});

  /* ---------- boot --------------------------------------------------------- */
  function boot(){
    return call('/kiosk/config',{}).then(function(c){
      if(c&&c.ok){
        CFG=c;
        $('#k-brand').textContent=c.branch||'MEZZE';
        $('#k-wname').textContent=c.branch||'MEZZE';
        if(!P.get('lang')&&c.default_lang){ setLang(c.default_lang.indexOf('ar')===0?'ar':'en'); }
        else { setLang(lang); }   // keep the language, recompute the market locale
      }
      return call('/shop/menu',{channel:'kiosk'});
    }).then(function(m){
      if(m&&m.ok){ CATS=m.categories||[]; MENU=m.products||[]; }
      ready();
    }).catch(function(){ ready(); });
  }

  /* A customer who presses Start before the branch's own configuration has arrived
     would be shown an empty menu and no service choices. The way in stays closed for
     the half-second that takes. */
  function ready(){ $('#k-start').disabled=false; paint(); }

  function setLang(l){
    lang=(l==='ar')?'ar':'en';
    // The market locale is the branch's own: language + the company's country. It
    // decides digit shape and separators — ar-SA and ar-EG give Arabic-Indic digits,
    // ar-AE gives Latin ones — and nothing else. Currency and tax come from Odoo.
    var country=(CFG&&CFG.country)||'';
    var pref=(CFG&&CFG.default_lang)||'';
    locale = country ? (lang+'-'+country)
           : (lang==='ar' ? (pref.indexOf('ar')===0?pref:'ar')
                          : (pref.indexOf('en')===0?pref:'en-US'));
    document.documentElement.lang=lang;
    document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
    try{ localStorage.setItem('kioskLang',lang); }catch(e){}
  }

  /* ---------- screens ------------------------------------------------------ */
  function show(s){
    var moved=(screen!==s);
    screen=s;
    $('#s-welcome').classList.toggle('k-hide',s!=='welcome');
    $('#s-service').classList.toggle('k-hide',s!=='service');
    $('#s-done').classList.toggle('k-hide',s!=='done');
    $('#s-app').classList.toggle('k-hide',['welcome','service','done'].indexOf(s)>=0);
    var inMenu=(s==='menu');
    $('#k-main').style.display=(s==='menu'||s==='cart'||s==='review'||s==='pay'||s==='payfail'||s==='detail')?'flex':'none';
    $('#k-rail').classList.toggle('k-hide',!inMenu);
    $('#k-headrow').classList.toggle('k-hide',!inMenu);
    $('#k-subbar').classList.toggle('k-hide',['detail','cart','review','pay','payfail'].indexOf(s)<0);
    $('#k-bar').classList.toggle('k-hide',['pay','payfail'].indexOf(s)>=0);
    /* a screen change is a region change: opacity + a 12px rise, once, on the region
       that actually changed. Never a loop, never a slide (handoff 03 §4). */
    if(moved)rise(['welcome','service','done'].indexOf(s)>=0
                  ? $('#s-'+(s==='done'?'done':s)) : $('#k-scroll'));
    resetIdle();
  }
  function rise(el){
    if(!el)return;
    el.classList.remove('k-in');
    void el.offsetWidth;          /* restart the animation on re-entry */
    el.classList.add('k-in');
  }

  function paint(){
    if(screen==='welcome')paintWelcome();
    else if(screen==='service')paintService();
    else if(screen==='menu')paintMenu();
    else if(screen==='detail')paintDetail();
    else if(screen==='cart')paintCart();
    else if(screen==='review')paintReview();
    else if(screen==='pay')paintPay();
    else if(screen==='payfail')paintPayFail();
    else if(screen==='done')paintDone();
    paintChrome();
  }

  function paintChrome(){
    $('#k-lang').innerHTML=icon('globe')+'<span>'+esc(t('lang'))+'</span>';
    $('#k-restart').innerHTML=icon('refresh')+'<span>'+esc(t('restart'))+'</span>';
    var chip=$('#k-svcchip');
    if(svc){ chip.classList.remove('k-hide');
      chip.innerHTML=icon(svc.service_mode==='eat_in'?'dine':'bag')+'<span>'+esc(svc.name)+'</span>'; }
    else chip.classList.add('k-hide');
    paintBar();
  }

  function paintWelcome(){
    $('#k-wsub').textContent=t('sub');
    $('#k-start').textContent=t('start');
    $('#k-langs').innerHTML=['ar','en'].map(function(l){
      return '<button type="button" class="k-lang'+(lang===l?' k-lang--on':'')+'" data-lang="'+l+'">'+
             (l==='ar'?'العربية':'English')+'</button>';}).join('');
  }

  function paintService(){
    $('#k-svcq').textContent=t('svcq');
    $('#k-svcs').textContent=t('svcs');
    var opts=(CFG&&CFG.service_options)||[];
    $('#k-svcopts').innerHTML=opts.map(function(o,i){
      return '<button type="button" class="k-choice'+(svc&&svc.name===o.name?' k-choice--on':'')+
             '" data-svc="'+i+'">'+
               '<span class="k-choice__well" aria-hidden="true">'+
                 icon(o.service_mode==='eat_in'?'table_restaurant':'takeout_dining')+'</span>'+
               '<span class="k-choice__t">'+esc(o.name)+'</span>'+
             '</button>';}).join('');
  }

  /* ---------- menu --------------------------------------------------------- */
  function catName(id){var c=CATS.find(function(x){return x.id===id;});return c?c.name:'';}
  function list(){ return MENU.filter(function(p){
    return !cat||(p.pos_categ_ids||[]).indexOf(cat)>=0; }); }

  function paintMenu(){
    var rail=[{id:0,name:t('featured')}].concat(CATS);
    $('#k-rail').innerHTML=rail.map(function(c){
      return '<button type="button" class="k-cat'+(cat===c.id?' k-cat--on':'')+'" data-cat="'+c.id+'"'+
             ' aria-pressed="'+(cat===c.id?'true':'false')+'">'+
             '<span class="k-cat__ic">'+icon(catIcon(c.name))+'</span>'+
             '<span class="k-cat__n">'+esc(c.name)+'</span></button>';}).join('');
    var items=list();
    $('#k-secttl').textContent=cat?catName(cat):t('featured');
    $('#k-sectn').textContent=intf(items.length);
    $('#k-scroll').innerHTML='<div class="k-grid">'+items.map(cardHtml).join('')+'</div>';
    var on=$('#k-rail .k-cat--on'); if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
  }

  /* Which glyph a photo-less dish shows: its own category's, so a menu with no
     photography still merchandises. Never a broken-image mark, never "image missing". */
  function prodGlyph(p){
    var c=(CATS||[]).filter(function(x){
      return p.pos_categ_ids&&p.pos_categ_ids.indexOf(x.id)>=0;})[0];
    return catIcon((c&&c.name)||p.name||'');
  }
  function shot(p,cls){
    if(p.has_image){
      return '<img class="k-shot '+(cls||'')+'" src="'+API+'/shop/image/'+
             encodeURIComponent(STORE)+'/'+p.id+'" alt="" loading="lazy">';
    }
    return '<span class="k-shot k-shot--none '+(cls||'')+'" aria-hidden="true">'+
           icon(prodGlyph(p))+'</span>';
  }
  function cardHtml(p){
    var inOrder=cart.some(function(l){return l.id===p.id;});
    return '<button type="button" class="k-card'+(inOrder?' k-card--in':'')+
           '" data-prod="'+p.id+'">'+
      '<span class="k-media">'+shot(p)+
        ((p.tags&&p.tags.length)?'<span class="k-tags">'+p.tags.map(function(tg){
          return '<span class="k-tag">'+esc(tg)+'</span>';}).join('')+'</span>':'')+
        (p.configurable?'<span class="k-card__cfg" aria-hidden="true">'+icon('tune')+'</span>':'')+
      '</span>'+
      '<span class="k-card__body">'+
        '<span class="k-card__n">'+esc(p.name)+'</span>'+
        '<span class="k-card__foot">'+priceHtml(p.list_price)+'</span>'+
      '</span></button>';
  }

  /* ---------- detail / meal / choice --------------------------------------- */
  /* `existing` does two different jobs: reopening a CART LINE (an edit, which saves in
     place) and pre-answering a component when a recommendation is accepted (which is an
     ADD). Only the first is an edit target — treating the second as one made accepting
     a recommendation quietly add nothing at all. */
  function openProduct(p,existing,mode){
    cfg=MCC.open({product:p,existing:existing||null,money:fmt,int:intf,t:cfgT,
      imageUrl:p.has_image?(API+'/shop/image/'+encodeURIComponent(STORE)+'/'+p.id):null,
      glyph:icon(prodGlyph(p))});
    editing=(mode==='edit')?existing:null;
    editFrom=(mode==='edit')?(editFrom||'menu'):null;
    show('detail'); paint();
  }
  function cfgT(k,v){
    var map={yourMeal:'yourMeal',back:'back',change:'change',choose:'choose',
      notChosen:'notChosen',required:'required',optional:'optional',chooseOne:'chooseOne',
      includedOne:'included',addToOrder:'addToOrder',saveChanges:'saveChanges',
      continue_:'cont',add:'add',quantity:'quantity',less:'dec',more:'inc'};
    if(k==='chooseUpTo')return (lang==='ar'?'اختر حتى ':'Choose up to ')+intf(v);
    if(k==='included')return (lang==='ar'?(intf(v)+' مشمول'):(intf(v)+' included'));
    if(k==='eachAfter')return lang==='ar'
      ? ('كل '+v.group+' إضافي بـ '+v.price+' '+unit())
      : ('Each extra '+v.group+' adds '+v.price+' '+unit());
    if(k==='firstIncluded')return lang==='ar' ? 'الأول مشمول' : 'The first one is included';
    if(k==='chooseYour')return (lang==='ar'?'اختر ':'Choose your ')+v;
    return map[k]?t(map[k]):k;
  }
  function paintDetail(){
    $('#k-backl').textContent=cfg.backLabel();
    $('#k-subt').textContent=cfg.title();
    $('#k-scroll').innerHTML=cfg.html();
    paintBar();
  }

  /* ---------- cart --------------------------------------------------------- */
  function keyFor(p,c){return PC.lineKey(p.id,(c&&c.attribute_value_ids)||[],'',(c&&c.combo)||[]);}
  function addLine(p,c){
    var key=keyFor(p,c), n=(c&&c.qty)||1;
    var e=cart.find(function(x){return x.key===key;});
    if(e){ e.qty+=n; }
    else{ cart.push({key:key,id:p.id,name:p.name,price:(p.list_price||0)+((c&&c.price_extra)||0),
      qty:n,avids:(c&&c.attribute_value_ids)||[],combo:(c&&c.combo)||[],names:(c&&c.names)||[],
      has_image:p.has_image,configurable:p.configurable}); }
    return e||cart[cart.length-1];
  }
  function replaceLine(line,p,c){
    var i=cart.indexOf(line); if(i<0)return;
    var key=keyFor(p,c), qty=(c&&c.qty)||line.qty;
    cart.splice(i,1);
    var twin=cart.find(function(x){return x.key===key;});
    if(twin){twin.qty+=qty;}
    else{cart.splice(i,0,{key:key,id:p.id,name:p.name,price:(p.list_price||0)+((c&&c.price_extra)||0),
      qty:qty,avids:(c&&c.attribute_value_ids)||[],combo:(c&&c.combo)||[],names:(c&&c.names)||[],
      has_image:p.has_image,configurable:p.configurable});}
  }
  function count(){return cart.reduce(function(s,l){return s+l.qty;},0);}
  function localTotal(){return cart.reduce(function(s,l){return s+l.price*l.qty;},0);}

  /* Prices shown anywhere but a single product come from the SERVER: it owns the
     pricelist, the taxes and the fiscal position. The local sum is only a placeholder
     until that answer arrives. */
  /* Every quote belongs to a generation of the cart. A reset bumps the generation, so a
     reply that was already in flight when the customer walked away cannot repopulate a
     cleared screen with the previous customer's total. */
  var priceGen=0;
  function reprice(){
    var gen=++priceGen;
    if(!cart.length){ money={total:0,subtotal:0,tax:0,rows:[],taxLabel:''}; paintBar(); return Promise.resolve(); }
    return call('/shop/quote',{lines:wire()}).then(function(d){
      if(gen!==priceGen)return;                 // a later cart (or a reset) has overtaken this
      if(d&&d.ok){ money=d.money||money; money.taxLabel=d.tax_label||''; }
      paintBar(); if(screen==='cart'||screen==='review')paint();
    }).catch(function(){});
  }
  function wire(){
    return cart.map(function(l){var o={product_id:l.id,qty:l.qty};
      if(l.avids&&l.avids.length)o.attribute_value_ids=l.avids;
      if(l.combo&&l.combo.length)o.combo=l.combo;
      return o;});
  }

  function paintCart(){
    $('#k-backl').textContent=t('addMore');
    $('#k-subt').textContent=t('order');
    if(!cart.length){
      $('#k-scroll').innerHTML='<div class="k-empty">'+icon('cart')+
        '<span class="k-empty__t">'+esc(t('empty'))+'</span>'+
        '<span class="k-empty__s">'+esc(t('emptyS'))+'</span></div>';
      return;
    }
    var lines=cart.map(function(l,i){
      return '<div class="k-line">'+shot(l,'k-shot--mini')+
        '<div class="k-line__b">'+
          '<div class="k-line__top"><span class="k-line__n">'+esc(l.name)+'</span>'+
            priceHtml(l.price*l.qty)+'</div>'+
          (l.names&&l.names.length?'<p class="k-line__cfg">'+l.names.map(function(n){
            return '· '+esc(n);}).join('<br>')+'</p>':'')+
          '<div class="k-line__acts">'+
            '<span class="mz-stepper mz-stepper--lg k-step">'+
              '<button type="button" class="mz-stepper__btn" data-line="'+i+'" data-d="-1" aria-label="'+esc(t('dec'))+'">'+
                (l.qty>1?'−':icon('trash'))+'</button>'+
              '<span class="mz-stepper__value num">'+esc(intf(l.qty))+'</span>'+
              '<button type="button" class="mz-stepper__btn" data-line="'+i+'" data-d="1" aria-label="'+esc(t('inc'))+'">+</button>'+
            '</span>'+
            (l.configurable?'<button type="button" class="k-mini" data-edit="'+i+'">'+
              icon('pencil')+'<span>'+esc(t('edit'))+'</span></button>':'')+
            '<button type="button" class="k-mini k-mini--danger" data-del="'+i+'">'+
              icon('trash')+'<span>'+esc(t('remove'))+'</span></button>'+
          '</div>'+
        '</div></div>';}).join('');
    $('#k-scroll').innerHTML=lines+offerHtml()+moneyHtml();
  }

  function moneyHtml(){
    var rows='';
    if(money.subtotal!==money.total||money.tax){
      rows+='<div class="k-money__r"><span>'+esc(t('subtotal'))+'</span><span class="num">'+
            esc(fmt(money.subtotal))+' '+esc(unit())+'</span></div>';
      if(money.tax){
        rows+='<div class="k-money__r"><span>'+esc(money.taxLabel||'')+'</span><span class="num">'+
              esc(fmt(money.tax))+' '+esc(unit())+'</span></div>';
      }
    }
    return '<div class="k-money">'+rows+
      '<div class="k-money__t"><span>'+esc(t('total'))+'</span><span>'+
      priceHtml(money.total||localTotal())+'</span></div></div>';
  }

  /* ---------- one honest recommendation ----------------------------------- */
  function mealFor(product){
    if(offerDone||!product||product.is_combo)return null;
    var best=null;
    MENU.forEach(function(m){
      if(!m.is_combo)return;
      var g=(m.combos||[]).find(function(c){
        return (c.items||[]).some(function(i){return i.product_id===product.id;});});
      if(!g)return;
      var delta=(m.list_price||0)-(product.list_price||0);
      if(delta<=0)return;
      if(!best||delta<best.delta)best={meal:m,group:g,delta:delta,
        item:g.items.find(function(i){return i.product_id===product.id;})};
    });
    return best;
  }
  function offerHtml(){
    if(!offerCtx)return '';
    var o=offerCtx.offer;
    return '<div class="k-offer" id="k-offer">'+
      '<span class="k-offer__ic" aria-hidden="true">'+icon('restaurant')+'</span>'+
      '<div class="k-offer__b"><div class="k-offer__t">'+esc(t('makeMeal'))+'</div>'+
      '<div class="k-offer__s">'+esc(o.meal.name)+' · +'+esc(fmt(o.delta))+' '+esc(unit())+'</div></div>'+
      '<div class="k-offer__a">'+
        '<button type="button" class="k-mini" data-offer="no">'+esc(t('noThanks'))+'</button>'+
        '<button type="button" class="k-mini k-mini--add" data-offer="yes">'+
          esc(t('makeIt'))+' · +'+esc(fmt(o.delta))+'</button>'+
      '</div></div>';
  }

  /* ---------- review / payment / success ---------------------------------- */

    $('#k-backl').textContent=t('editOrder');

    var rows=cart.map(function(l){

        (l.names&&l.names.length?'<p class="k-line__cfg">'+l.names.map(function(n){

    var srv=svc?('<div class="k-srv">'+icon(svc.service_mode==='eat_in'?'dine':'bag')+

    $('#k-subt').textContent=t('howPay');

    $('#k-scroll').innerHTML=
      '<div class="k-paying"><div><div class="k-paying__l">'+esc(t('youPay'))+'</div>'+

      '<p class="k-detail__desc" style="margin-bottom:20px">'+esc(t('payHint'))+'</p>'+

        return '<button type="button" class="k-pay" data-pay="'+i+'">'+

          '<span class="k-pay__s">'+esc(o.hint||'')+'</span></span>'+
          '<span class="k-chev" aria-hidden="true">›</span></button>';}).join('');
  }

  function paintPayFail(){
    $('#k-backl').textContent=t('editOrder');
    $('#k-subt').textContent=t('howPay');
    // "Nothing has been charged" is only truthful when the server created no order.
    // When the outcome is unknown, the customer is told the truth instead.
    var sure=(lastOrder&&lastOrder.certain===true);
    $('#k-scroll').innerHTML=
      '<div class="k-fail"><span class="k-fail__ic">'+icon('warn')+'</span>'+
      '<div style="flex:1"><div class="k-fail__t">'+esc(t('failT'))+'</div>'+
      '<div class="k-fail__s">'+esc(sure?t('failS'):t('failUnsure'))+'</div>'+
      '<div class="k-fail__a">'+
        (sure?'<button type="button" class="k-cta" style="min-height:76px;min-width:0;font-size:22px" data-retry="1">'+
          esc(t('tryAgain'))+'</button>':'')+
        '<button type="button" class="k-mini" data-back="pay">'+esc(t('another'))+'</button>'+
      '</div>'+
      ((lastOrder&&lastOrder.ref)?('<div class="k-fail__ref">'+esc(t('staffRef'))+' · '+
        esc(lastOrder.ref)+'</div>'):'')+
      '</div></div>';
  }

  function paintDone(){
    $('#k-donenum').textContent=(lastOrder&&lastOrder.tracking)||'—';
    $('#k-donenuml').textContent=t('ordernum');
    rise($('#k-okring'));
    tick();
    $('#k-donet').textContent=t('placed');
    $('#k-dones').textContent=(CFG&&CFG.service_mode==='table')?t('collectTable'):t('collect');
    $('#k-newbtn').textContent=t('neworder');
  }

  function paintBar(){
    var n=count();
    $('#k-bar').classList.toggle('k-bar--empty',!n);
    $('#k-bar').classList.toggle('k-bar--item',screen==='detail');
    $('#k-barl').textContent=(n===1?('1 '+t('item')):(intf(n)+' '+t('items')));
    $('#k-barv').innerHTML=priceHtml(money.total||localTotal());
    var cta=$('#k-cta');
    if(screen==='detail'&&cfg){
      var a=cfg.action();
      // On the focused choice the price lives on the LEFT of the bar, as the design
      // has it; the button carries the money only when the button is what spends it.
      cta.innerHTML=(a.kind==='continue')
        ? esc(a.label)
        : esc(a.label)+' · '+esc(fmt(cfg.total()))+' '+esc(unit());
      cta.disabled=false; cta.dataset.act=a.kind; cta.dataset.group=(a.group===undefined?'':a.group);
      $('#k-barl').textContent=t('yourMeal');
      $('#k-barv').innerHTML=priceHtml(cfg.total());
    } else if(screen==='cart'){
      cta.innerHTML=esc(t('cont'))+' <span class="k-chev">›</span>';
      cta.disabled=!cart.length; cta.dataset.act='review';
    } else if(screen==='review'){
      cta.innerHTML=esc(t('payNow'))+' <span class="k-chev">›</span>';
      cta.disabled=!cart.length; cta.dataset.act='pay';
    } else {
      cta.innerHTML=esc(t('viewOrder'))+' <span class="k-chev">›</span>';
      cta.disabled=!cart.length; cta.dataset.act='cart';
    }
  }

  /* ---------- submission --------------------------------------------------- */
  function place(){
    if(busy||!cart.length)return;
    busy=true;
    var uuid='kiosk-'+Date.now()+'-'+Math.floor(Math.random()*1e6);
    call('/shop/order',{fulfillment:'kiosk',service_mode:(svc&&svc.service_mode)||'takeaway',
      uuid:uuid,lines:wire()}).then(function(d){
      busy=false;
      if(d&&d.ok){
        lastOrder={tracking:d.tracking,order_id:d.order_id,total:d.total};
        cart=[];offerCtx=null;offerDone=false;
        show('done');paint();
        return;
      }
      // the server refused BEFORE creating anything: that is a certain no-charge state
      lastOrder={certain:true,ref:uuid.slice(-8).toUpperCase(),message:friendly(d)};
      show('payfail');paint();
    }).catch(function(){
      busy=false;
      // the request never completed: we do NOT know whether the order exists
      lastOrder={certain:false,ref:uuid.slice(-8).toUpperCase()};
      show('payfail');paint();
    });
  }
  function friendly(d){
    var e=(d&&d.error)||'',m=(d&&d.message)||'';
    if(e==='selforder_paused'||e==='store_closed')return t('unavailable');
    if(/not available|86|self.?order/i.test(m))return t('gone');
    if(/combo|item|attribute|allows at most|needs/i.test(m))return t('badcfg');
    return t('err');
  }

  /* ---------- privacy reset ------------------------------------------------ */
  var IDLE=90000,idleT=null,idleAt=0,tickT=null;
  function resetIdle(){ clearTimeout(idleT); if(screen==='welcome')return;
    idleAt=Date.now()+IDLE;
    idleT=setTimeout(fullReset,IDLE); }
  /* The kiosk already resets itself; on the success screen the customer is TOLD, so the
     screen going blank is expected rather than startling. Display only — the timer and
     its duration are unchanged. */
  function tick(){
    clearTimeout(tickT);
    var el=$('#k-count'); if(!el||screen!=='done')return;
    var left=Math.max(0,Math.ceil((idleAt-Date.now())/1000));
    el.innerHTML=icon('timer')+'<span>'+esc(t('resetIn').replace('%s',intf(left)))+'</span>';
    tickT=setTimeout(tick,1000);
  }
  function fullReset(){
    cart=[];cfg=null;editing=null;editFrom=null;svc=null;cat=0;offerCtx=null;offerDone=false;
    lastOrder=null;payMethod=null;busy=false;
    money={total:0,subtotal:0,tax:0,rows:[],taxLabel:''};
    priceGen++;                                  // orphan any quote still in flight
    setLang((CFG&&CFG.default_lang&&CFG.default_lang.indexOf('ar')===0)?'ar':'en');
    show('welcome');paint();
  }
  ['click','touchstart','keydown','scroll'].forEach(function(ev){
    document.addEventListener(ev,function(){ if(screen!=='welcome')resetIdle(); },{passive:true});});

  /* Arrow keys belong to the focused choice: a radiogroup answers them, and a kiosk
     with a keyboard or an assistive switch is exactly where that matters. */
  document.addEventListener('keydown',function(ev){
    if(screen!=='detail'||!cfg)return;
    var id=cfg.arrow(ev.target,ev.key);
    if(id===null||id===undefined)return;
    ev.preventDefault(); paintDetail();
    var again=$('#k-scroll').querySelector('[data-pick="'+id+'"]');
    if(again)again.focus();
  });

  /* ---------- one delegated click handler ---------------------------------- */
  document.addEventListener('click',function(ev){
    var el=ev.target.closest?ev.target.closest('[data-lang],[data-svc],[data-cat],[data-prod],[data-line],[data-edit],[data-del],[data-offer],[data-pay],[data-retry],[data-back],#k-start,#k-lang,#k-restart,#k-back,#k-cta,#k-newbtn,#k-svcchip'):null;
    if(!el)  { if(cfg&&screen==='detail'&&cfg.handle(ev.target)){paintDetail();} return; }

    if(el.dataset.lang){ setLang(el.dataset.lang); paint(); return; }
    if(el.id==='k-lang'){ setLang(lang==='ar'?'en':'ar'); paint(); return; }
    if(el.id==='k-start'){ show((CFG&&CFG.service_options&&CFG.service_options.length>1)?'service':'menu');
      if(screen==='menu'&&CFG&&CFG.service_options&&CFG.service_options.length)svc=CFG.service_options[0];
      paint(); return; }
    if(el.dataset.svc!==undefined){ svc=(CFG.service_options||[])[+el.dataset.svc]; show('menu'); paint(); return; }
    if(el.id==='k-svcchip'){ show('service'); paint(); return; }
    if(el.id==='k-restart'||el.id==='k-newbtn'){ fullReset(); return; }
    if(el.dataset.cat!==undefined){ cat=+el.dataset.cat; paintMenu(); return; }
    if(el.dataset.prod!==undefined){
      var p=MENU.find(function(x){return x.id===+el.dataset.prod;});
      if(p)openProduct(p,null); return; }
    if(el.id==='k-back'){
      if(screen==='detail'){ if(cfg&&cfg.back()){paintDetail();} else {cfg=null;editing=null;show('menu');paint();} return; }
      if(screen==='cart'){ show('menu'); paint(); return; }
      if(screen==='review'){ show('cart'); paint(); return; }
      if(screen==='pay'||screen==='payfail'){ show('review'); paint(); return; }
      return; }
    if(el.dataset.line!==undefined){
      var l=cart[+el.dataset.line]; if(!l)return;
      l.qty+=(+el.dataset.d);
      if(l.qty<=0)cart.splice(cart.indexOf(l),1);
      reprice(); paintCart(); paintBar(); return; }
    if(el.dataset.edit!==undefined){
      var le=cart[+el.dataset.edit]; var pe=MENU.find(function(x){return x.id===le.id;});
      if(pe){ editFrom='cart'; openProduct(pe,le,'edit'); } return; }
    if(el.dataset.del!==undefined){
      cart.splice(+el.dataset.del,1); reprice(); paintCart(); paintBar(); return; }
    if(el.dataset.offer){
      if(el.dataset.offer==='no'){ offerCtx=null; paintCart(); return; }
      var ctx=offerCtx; offerCtx=null;
      var i=cart.indexOf(ctx.line); if(i>-1){ ctx.line.qty-=1; if(ctx.line.qty<=0)cart.splice(i,1); }
      openProduct(ctx.offer.meal,{combo:[{item_id:ctx.offer.item.item_id}],
                                  attribute_value_ids:[]},'preselect');
      return; }
    if(el.dataset.pay!==undefined){ payMethod=(CFG.payment_options||[])[+el.dataset.pay]; place(); return; }
    if(el.dataset.retry){ place(); return; }
    if(el.dataset.back==='pay'){ show('pay'); paint(); return; }
    if(el.id==='k-cta'){
      var act=el.dataset.act;
      if(act==='goto'&&cfg){ cfg.goto(+el.dataset.group); paintDetail(); return; }
      if(act==='continue'&&cfg){ cfg.back(); paintDetail(); return; }
      if(act==='add'&&cfg){
        var chosen=cfg.confirm();
        if(!chosen){ paintDetail(); return; }
        var prod=cfg.product;
        var back='menu';
        if(editing){ replaceLine(editing,prod,chosen); back=editFrom||'menu'; }
        else{ var line=addLine(prod,chosen);
              var o=mealFor(prod); if(o){ offerDone=true; offerCtx={line:line,offer:o}; } }
        cfg=null; editing=null; editFrom=null;
        reprice(); show(back); paint(); return;
      }
      if(act==='cart'){ show('cart'); reprice(); paint(); return; }
      if(act==='review'){ show('review'); paint(); return; }
      if(act==='pay'){ show('pay'); paint(); return; }
    }
  });

  /* ---------- start -------------------------------------------------------- */
  try{ var saved=P.get('lang')||localStorage.getItem('kioskLang'); if(saved)setLang(saved); }catch(e){}
  show('welcome');
  boot();
})();
</script>
</body>
</html>
