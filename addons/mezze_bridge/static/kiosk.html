<!doctype html>
<!-- Mezze Self-Service Kiosk (S4). A dedicated KIOSK MODE on the customer-ordering
     application: it reuses the SAME certified catalog + order APIs (/shop/config,
     /shop/menu, /shop/image, /shop/order fulfillment=kiosk) — NO separate transaction
     backend. Payment is PAY-AT-COUNTER (order stays PAYMENT_DUE, never faked paid;
     native Odoo kiosk is Adyen/Stripe-terminal-only). Inactivity + completion reset
     clear all cart/PII for the next customer. Bilingual EN/AR, RTL, dark, large touch. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="design/foundation.css?v=f5">
<link rel="stylesheet" href="design/components.css?v=f5">
<!-- FINAL-C1: the canonical Mezze theme registry (Light / Dark / Mezze High Contrast).
     The kiosk previously did not load it at all, so [data-mz-theme=highcontrast] had
     nothing to match and High Contrast could never apply here. -->
<link rel="stylesheet" href="mezze-design.css?v=d3">
<!-- The product configuration RULES are canonical and shared with the staff
     surfaces (design/product-config.js); the customer PRESENTATION is its own
     touch-first renderer (design/customer-config.*). The kiosk therefore cannot
     disagree with the Register about what a configured item costs, and does not
     inherit a modal built for a cashier with a keyboard. -->
<link rel="stylesheet" href="design/customer-config.css?v=k19">
<script src="design/product-config.js?v=k19"></script>
<script src="design/customer-config.js?v=k19"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mezze Kiosk</title>
<style>
/* FINAL-C1 — THEME OWNERSHIP INVERTED.
   Before: the kiosk declared its OWN palette and then mapped it ONTO the canonical
   names (--mz-brand:var(--acc)). Because this inline <style> comes after the linked
   stylesheets at the same :root specificity, those declarations SHADOWED the registry,
   so no registry theme — least of all High Contrast — could ever take effect.
   After: the registry owns every colour and these local names are ALIASES that CONSUME
   --mz-* tokens. The kiosk's existing rules keep using var(--bg)/var(--card)/... and now
   follow Light, Dark and High Contrast automatically — with NO kiosk-specific theme CSS. */
:root{
  --r:22px;                                  /* geometry, not theme-owned */
  --bg:var(--mz-canvas);--card:var(--mz-surface);--card2:var(--mz-surface-2);
  --line:var(--mz-border);--txt:var(--mz-text);--mut:var(--mz-text-mut);
  --acc:var(--mz-brand);--acc2:var(--mz-brand-hover);
  --ok:var(--mz-ok);--danger:var(--mz-danger);
  /* components.css reads these with a fallback chain; point them at the registry too */
  --mz-text-primary:var(--mz-text);--mz-text-secondary:var(--mz-text-2);
  --mz-disabled-opacity:.45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none;user-select:none}
/* F5: the vendored @font-face family is 'IBM Plex Sans Arabic' (design/foundation.css).
   This rule asked for 'IBM Plex Arabic' — a family that does not exist — so ALL kiosk
   Arabic body text silently fell back to a Latin face. Consume the canonical token. */
:root[dir="rtl"] body{font-family:var(--mz-font-ar,'IBM Plex Sans Arabic','Hanken Grotesk',system-ui,sans-serif)}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ---- ERGONOMIC ZONING (KFC principle 3) ----------------------------------
   A 1080x1920 kiosk is a physical machine, not a tall web page: the top of the screen
   can sit ~1.7m above the floor, which is above the shoulder of a seated customer.
   So the screen is banded by REACH, not by convention:

     top band      identity, language, service mode   — read often, touched rarely
     middle        the menu                            — the reason the customer is here
     lower band    categories, then the order bar      — touched constantly

   That is why the category rail is docked at the BOTTOM in portrait and only rides
   under the header in landscape, where the whole screen is within reach. */
.wrap{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
@media (orientation:portrait){ .wrap{max-width:none} }
@media (min-width:1500px) and (orientation:landscape){ .wrap{max-width:1720px} }
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;position:sticky;top:0;background:var(--bg);z-index:5}
.topacts{display:flex;align-items:center;gap:12px}
/* The service mode belongs to the WHOLE order, so it is stated for the whole order
   rather than only on the screen where it was picked. Infrequent, so it lives high. */
.svcchip{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);
  background:var(--card);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:var(--mz-on-brand);font-weight:800;font-size:24px}
/* DESIGN-P3A.2: canonical buttons (.mz-btn from components.css). The .kiosk-* classes below
   are LAYOUT/TOUCH-SCALE ONLY (width/placement + large-touch min-height/padding/font-size);
   they must NOT set font-family/weight, brand color, radius, border, focus, hover, pressed,
   disabled or elevation — those belong to the canonical component. */
.kiosk-lang{min-height:46px;padding:0 18px;font-size:18px}
.kiosk-hero{min-height:88px;padding:24px 56px;font-size:28px}
.kiosk-cta{min-height:64px;padding:0 36px;font-size:21px}
.kiosk-add{width:100%;min-height:54px;margin-top:12px;font-size:18px}
.kiosk-place{width:100%;min-height:76px;padding:20px;font-size:24px}
.kiosk-secondary{width:100%;min-height:60px;padding:16px;font-size:19px;margin-top:12px}
/* start screen */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:28px}
.start h1{font-size:46px;margin:0}
.start p{font-size:22px;color:var(--mut);margin:0}
.svc{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.svcbtn{padding:22px 40px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);font-weight:800;font-size:22px;min-width:220px}
.svcbtn.on{border-color:var(--acc);background:var(--card2)}
/* menu */
/* The single most-reported failure of the benchmarked kiosk is a scroller with no
   sign that it scrolls. The rail always fades at its trailing edge and lets the next
   chip peek, so there is visible evidence of more. */
.cats{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:10px 26px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 44px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 44px),transparent 100%)}
:root[dir="rtl"] .cats{mask-image:linear-gradient(to left,#000 0,#000 calc(100% - 44px),transparent 100%);
  -webkit-mask-image:linear-gradient(to left,#000 0,#000 calc(100% - 44px),transparent 100%)}
.cats::-webkit-scrollbar{display:none}
.cat{min-height:60px;padding:0 26px;border-radius:999px;border:2px solid var(--line);background:var(--card);
  font-weight:700;font-size:19px;white-space:nowrap;display:flex;align-items:center}
.cat.on{background:var(--acc);border-color:var(--acc);color:var(--mz-on-brand)}
/* Where the customer is in the menu, and how much is in front of them. A kiosk with
   no heading makes the category rail the only answer to "what am I looking at?", and
   in portrait the rail is at the other end of the screen. */
.secttl{margin:0;padding:22px 26px 4px;font-size:26px;font-weight:800}
.secttl span{font-size:19px;font-weight:700;color:var(--mut);margin-inline-start:10px}
/* PORTRAIT: two large image-led columns, and the rail docked above the order bar —
   both frequent controls in the reachable half of a tall machine. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:20px 26px 180px}
@media (orientation:portrait){
  .cats{position:fixed;left:0;right:0;bottom:104px;z-index:6;background:var(--bg);
        border-top:1px solid var(--line);padding:14px 26px}
  .grid{grid-template-columns:repeat(2,1fr);gap:22px;padding:20px 26px 260px}
}
/* LANDSCAPE: the whole screen is in reach, so the rail rides under the header and the
   menu widens to premium columns — not stretched portrait cards. */
@media (min-width:1500px) and (orientation:landscape){
  .grid{grid-template-columns:repeat(5,1fr);gap:20px}
}
@media (min-width:1200px) and (max-width:1499px) and (orientation:landscape){
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
}
/* A card is one target, not a card with a target inside it: the whole thing is the
   button, and the pill inside says what pressing it will do. */
.card{display:flex;flex-direction:column;width:100%;text-align:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pic{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,var(--mz-surface-3),var(--mz-surface-2));display:grid;place-items:center;font-size:64px}
.cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cname{font-weight:800;font-size:21px;line-height:1.25}
.cprice{color:var(--acc);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.card.off{opacity:.45}
@media (orientation:portrait){
  .pic{aspect-ratio:1/1;font-size:84px}
  .cname{font-size:24px}
  .cprice{font-size:24px}
}
/* cart bar — the basket. Persistently visible with its count and its total, which is
   the one thing the benchmarked kiosk deliberately hides at the moment it upsells. */
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:18px 26px calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--card2);border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;z-index:7}
.cartbar .n{min-width:52px;height:52px;padding:0 12px;border-radius:16px;background:var(--acc);color:var(--mz-on-brand);display:grid;place-items:center;font-weight:800;font-size:22px}
.cartbar .lbl{flex:1;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.cartbar .hint{flex:1;font-weight:700;font-size:19px;color:var(--mut)}
/* the recommendation. Both answers are the same size and weight: declining must cost
   exactly as much effort as accepting, and the price is ON the offer. */
.offer{position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:6;
  padding:16px 26px;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.offer__txt{flex:1;min-width:200px;font-size:20px;font-weight:800}
.offer__px{color:var(--acc);font-variant-numeric:tabular-nums}
.offer__acts{display:flex;gap:12px}
/* Both answers are the same size. A "No thanks" that is smaller than "Yes" is a
   thumb on the scale, and this design does not put one there. */
.offer__btn{min-height:60px;min-width:190px;padding:0 26px;font-size:18px;justify-content:center}
@media (orientation:portrait){ .offer{bottom:calc(180px + env(safe-area-inset-bottom,0px))} }
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:88vh;border-radius:26px 26px 0 0;padding:24px;overflow:auto}
.sheet h2{font-size:28px;margin:0 0 16px}
.crow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.crow .cn{flex:1;font-weight:700;font-size:20px}
/* P3E — quantity is the canonical large-touch .mz-stepper.mz-stepper--lg (components.css). */
.mz-stepper.mz-stepper--lg{gap:14px}
.totrow{display:flex;justify-content:space-between;font-weight:800;font-size:26px;margin:18px 0}
.payline{color:var(--mut);font-size:18px;margin-bottom:14px}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:22px}
.donenum{font-size:72px;font-weight:800;color:var(--acc)}
.done h2{font-size:38px;margin:0}
.done p{font-size:22px;color:var(--mut);margin:0}
/* inactivity modal */
.idle{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:40}
.idlebox{background:var(--card);border-radius:26px;padding:40px;text-align:center;max-width:520px}
.idlebox h2{font-size:32px;margin:0 0 14px}
/* DESIGN-P1: visible keyboard focus (light + dark) + reduced motion */
button:focus-visible,[role="button"]:focus-visible,a:focus-visible,input:focus-visible{
  outline:3px solid var(--acc);outline-offset:3px;border-radius:14px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
<script>/* FINAL-C1 FOUC guard — the SAME canonical appearance bootstrap the other
   production surfaces already use: it stamps data-appearance / data-mz-theme /
   data-mz-mode / data-mz-accent (and dir) before first paint so the shared registry
   applies, including Mezze High Contrast. Legacy ?mode= is still honoured. */
(function(){try{var p=new URLSearchParams(location.search),o={};try{o=JSON.parse(localStorage.getItem('mzSettings.v1')||'{}')||{}}catch(e){}
var h=document.documentElement,L=['classic','corporate','coastal','forest','coffeehouse','highcontrast'],D=['midnight','lounge','graphite','forestnight','slate','highcontrast'];
var mp=p.get('mzmode')||p.get('mode')||o.app_mode||o.mode||'system',mode=(mp==='system')?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):(mp==='dark'?'dark':'light');
var req=p.get('mztheme')||p.get('theme');
var hc=(req==='highcontrast')||(o.ac_contrast||o.highContrast);
var th=hc?'highcontrast':(mode==='dark'?(D.indexOf(req||(o.app_dark_theme||o.darkTheme))>=0?(req||(o.app_dark_theme||o.darkTheme)):'lounge'):(L.indexOf(req||(o.app_theme||o.lightTheme))>=0?(req||(o.app_theme||o.lightTheme)):'classic'));
h.setAttribute('data-appearance','mezze');h.setAttribute('data-theme',mode);h.setAttribute('data-mz-mode',mode);h.setAttribute('data-mz-theme',th);
h.setAttribute('data-mz-accent',p.get('mzaccent')||(o.app_accent||o.accent)||'terracotta');}catch(e){}})();</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo" id="k-logo">M</span><span id="k-name">Mezze</span></div>
    <div class="topacts">
      <button type="button" class="svcchip hidden" id="k-svcchip"></button>
      <button class="mz-btn mz-btn--secondary kiosk-lang" id="k-lang" lang="ar" aria-label="Change language">ع</button>
    </div>
  </div>

  <!-- START -->
  <section class="start" id="k-start">
    <h1 id="k-welcome">Welcome</h1>
    <p id="k-tap">Tap to start your order</p>
    <button class="mz-btn mz-btn--primary kiosk-hero" id="k-startbtn">Order here</button>
    <div class="svc" id="k-svc" role="group" aria-label="Service mode">
      <button class="svcbtn on" data-s="takeaway" data-t="takeaway">Takeaway</button>
      <button class="svcbtn" data-s="eat_in" data-t="eatin">Eat in</button>
    </div>
  </section>

  <!-- MENU -->
  <section id="k-menu" class="hidden">
    <div class="cats" id="k-cats"></div>
    <h2 class="secttl" id="k-secttl"></h2>
    <div class="grid" id="k-grid" role="list"></div>
  </section>

  <!-- DONE -->
  <section class="done hidden" id="k-done">
    <div class="donenum" id="k-num">#—</div>
    <h2 id="k-thanks">Order placed!</h2>
    <p id="k-payat">Please pay at the counter to collect your order.</p>
    <button class="mz-btn mz-btn--primary kiosk-hero" id="k-newbtn" data-t="neworder">New order</button>
  </section>
</div>

<!-- cart bar -->
<div class="cartbar hidden" id="k-cartbar">
  <span class="n" id="k-count">0</span>
  <span class="lbl" id="k-carttot">0.00</span>
  <span class="hint hidden" id="k-carthint"></span>
  <button class="mz-btn mz-btn--primary kiosk-cta" id="k-review" data-t="review">Review order</button>
</div>

<!-- One recommendation, at most, per order. It is rendered ABOVE the order bar, never
     instead of it: the benchmarked kiosk hides the running total at exactly this moment
     so the customer cannot remember what they have already spent, and that is the one
     behaviour this design refuses outright. -->
<div class="offer hidden" id="k-offer" role="region" aria-live="polite">
  <div class="offer__txt"><span id="k-offer-q"></span> <span class="offer__px num" id="k-offer-px" dir="ltr"></span></div>
  <div class="offer__acts">
    <button type="button" class="mz-btn mz-btn--secondary offer__btn" id="k-offer-no"></button>
    <button type="button" class="mz-btn mz-btn--primary offer__btn" id="k-offer-yes"></button>
  </div>
</div>

<!-- cart sheet -->
<div class="ov hidden" id="k-ov">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="k-ov-title">
    <h2 id="k-ov-title" data-t="yourorder">Your order</h2>
    <div id="k-lines"></div>
    <div class="totrow"><span data-t="total">Total</span><span id="k-sheettot">0.00</span></div>
    <div class="payline" id="k-payline">Pay at the counter when you collect.</div>
    <div class="mz-alert mz-alert--danger hidden" id="k-err" role="alert" aria-live="assertive"></div>
    <button class="mz-btn mz-btn--primary kiosk-place" id="k-place" data-t="place">Place order</button>
    <button class="mz-btn mz-btn--secondary kiosk-secondary" id="k-back" data-t="addmore">Add more items</button>
  </div>
</div>

<!-- inactivity -->
<div class="idle hidden" id="k-idle">
  <div class="idlebox">
    <h2 data-t="stillthere">Still there?</h2>
    <p id="k-idlecount" style="font-size:22px;color:var(--mut)">Resetting soon…</p>
    <button class="mz-btn mz-btn--primary kiosk-hero" id="k-imhere" data-t="imhere">I'm here</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API='/mezze/api/v1';
  var P=new URLSearchParams(location.search);
  var STORE=P.get('store')||'';
  var lang=(P.get('lang')||localStorage.getItem('kioskLang')||'en').slice(0,2);
  // theme: owned by the canonical FOUC guard in <head> (FINAL-C1). It stamps
  // data-appearance/data-mz-theme/data-mz-mode before first paint and still honours
  // the legacy ?mode= parameter. Re-setting data-mz-mode here would drop the theme
  // name and silently disable High Contrast, so this surface no longer does it.
  var T={en:{welcome:'Welcome',tap:'Tap to start your order',order:'Order here',takeaway:'Takeaway',eatin:'Eat in',review:'Review order',yourorder:'Your order',total:'Total',place:'Place order',addmore:'Add more items',payat:'Please pay at the counter to collect your order.',payline:'Pay at the counter when you collect.',neworder:'New order',placed:'Order placed!',stillthere:'Still there?',resetting:'Resetting in',imhere:"I'm here",add:'Add',choose:'Choose',customize:'Customize',edit:'Edit',back:'Back',required:'Required',choose1:'Choose 1',optional:'Optional',chooseupto:'Choose up to',included:'included',itemtotal:'Item total',addtoorder:'Add to order',savechanges:'Save changes',missing:'Choose',missingmore:'choose %(n)s more',less:'One less',more:'One more',step:'of',change:'Change',addanother:'Add another',gone:'Sorry, that item is no longer available.',emptyhint:'Tap an item to start your order',makemeal:'Make it a meal?',makeit:'Make it a meal',nothanks:'No thanks',badconfig:'Please check your choices and try again.',unavailable:'Ordering is temporarily unavailable.',err:'Something went wrong. Please try again.',empty:'Your order is empty',dec:'Decrease quantity',inc:'Increase quantity'},
       ar:{welcome:'أهلاً بك',tap:'المس لبدء طلبك',order:'اطلب من هنا',takeaway:'سفري',eatin:'تناول بالمطعم',review:'مراجعة الطلب',yourorder:'طلبك',total:'الإجمالي',place:'إرسال الطلب',addmore:'أضف المزيد',payat:'يرجى الدفع عند الكاشير لاستلام طلبك.',payline:'ادفع عند الكاشير عند الاستلام.',neworder:'طلب جديد',placed:'تم الطلب!',stillthere:'هل ما زلت هنا؟',resetting:'إعادة الضبط خلال',imhere:'أنا هنا',add:'أضف',choose:'اختر',customize:'خصّص',edit:'تعديل',back:'رجوع',required:'مطلوب',choose1:'اختر واحدًا',optional:'اختياري',chooseupto:'اختر حتى',included:'مشمول',itemtotal:'إجمالي الصنف',addtoorder:'أضف إلى الطلب',savechanges:'حفظ التغييرات',missing:'اختر',missingmore:'اختر %(n)s إضافية',less:'واحد أقل',more:'واحد أكثر',step:'من',change:'تغيير',addanother:'أضف آخر',gone:'عذرًا، هذا الصنف لم يعد متاحًا.',emptyhint:'المس أي صنف لبدء طلبك',makemeal:'تحويله إلى وجبة؟',makeit:'اجعلها وجبة',nothanks:'لا، شكرًا',badconfig:'يرجى مراجعة اختياراتك والمحاولة مرة أخرى.',unavailable:'الطلب غير متاح مؤقتًا.',err:'حدث خطأ ما. حاول مرة أخرى.',empty:'طلبك فارغ',dec:'تقليل الكمية',inc:'زيادة الكمية'}};
  function t(k){return (T[lang]||T.en)[k]||T.en[k]||k;}
  function $(s){return document.querySelector(s);}
  function EGP(n){return (CUR||'')+' '+(Math.round((n||0)*100)/100).toFixed(2);}
  var CUR='',CATS=[],MENU=[],cart=[],svcMode='takeaway',BUSY=false;
  var PC=window.MezzeProductConfig, CFG=window.MezzeCustomerConfig;

  function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar')?'rtl':'ltr';
    $('#k-lang').textContent=lang==='ar'?'EN':'ع';
    document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=t(e.getAttribute('data-t'));});
    $('#k-welcome').textContent=t('welcome');$('#k-tap').textContent=t('tap');$('#k-startbtn').textContent=t('order');
    $('#k-thanks').textContent=t('placed');$('#k-payat').textContent=t('payat');$('#k-payline').textContent=t('payline');}
  /* FINAL-C5 — render() rebuilds the categories and the grid, but the order lines live
     in #k-lines and are only written by openSheet(). Without this the review sheet keeps
     the PREVIOUS language after a switch, including the stepper accessible names.
     openSheet() is a pure re-render here: it is called only while the sheet is already
     open, and it no-ops on an empty cart. */
  $('#k-lang').onclick=function(){lang=(lang==='ar')?'en':'ar';localStorage.setItem('kioskLang',lang);applyLang();render();
    if(!$('#k-ov').classList.contains('hidden'))openSheet();};

  function food(p){var n=(p.name||'').toLowerCase();
    if(/coffee|latte|tea|drink|juice/.test(n))return '☕';if(/pizza/.test(n))return '🍕';
    if(/burger/.test(n))return '🍔';if(/salad|mezze/.test(n))return '🥗';return '🍽️';}

  async function call(path,body){var r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({store:STORE},body||{}))});return r.json();}

  async function boot(){
    try{ var cfg=await call('/shop/config',{}); CUR=cfg.currency||''; $('#k-name').textContent=cfg.branch||'Mezze';
      $('#k-logo').textContent=(cfg.branch||'M').slice(0,1).toUpperCase();
      // channel='kiosk' asks the server for the SELF-ORDER menu: a product the
      // branch excluded from self-order must not be listed here just because it
      // exists in POS. The gate is enforced again at order time.
      var menu=await call('/shop/menu',{channel:'kiosk'}); CATS=menu.categories||[]; MENU=menu.products||[];
    }catch(e){}
    applyLang();
    // A customer who presses "Order here" before the menu has arrived used to be left
    // looking at an empty grid until they gave up: render() ran once, on a tap, with
    // nothing to draw. Draw again when the data lands.
    if(!$('#k-menu').classList.contains('hidden'))render();
  }

  function activeCat(){var c=$('#k-cats .cat.on');return c?parseInt(c.dataset.id||'0',10):0;}
  function render(){
    var cats=$('#k-cats'); var cur=activeCat();
    cats.innerHTML='<button class="cat'+(cur?'':' on')+'" data-id="0" aria-pressed="'+(cur?'false':'true')+'">'+(lang==='ar'?'الكل':'All')+'</button>'+
      CATS.map(function(c){return '<button class="cat'+(cur===c.id?' on':'')+'" data-id="'+c.id+'" aria-pressed="'+(cur===c.id?'true':'false')+'">'+esc(c.name)+'</button>';}).join('');
    cats.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){cats.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on');});b.classList.add('on');render();};});
    // Keep the chosen category ON SCREEN. The rail scrolls, so the category a customer
    // just picked can otherwise sit off the edge — which leaves the rail showing a
    // different category from the one they are looking at.
    var on=cats.querySelector('.cat.on');
    if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
    var list=MENU.filter(function(p){return !cur||(p.pos_categ_ids||[]).indexOf(cur)>=0;});
    var catName=cur?((CATS.find(function(c){return c.id===cur;})||{}).name||''):(lang==='ar'?'الكل':'All');
    $('#k-secttl').innerHTML=esc(catName)+'<span>'+list.length+'</span>';
    $('#k-grid').innerHTML=list.map(function(p){
      var pic=p.has_image?('<img class="pic" src="'+API+'/shop/image/'+encodeURIComponent(STORE)+'/'+p.id+'" alt="" onerror="this.outerHTML=\'<div class=pic>'+food(p)+'</div>\'">'):('<div class="pic">'+food(p)+'</div>');
      // A product that asks the customer nothing stays ONE TAP. A product that has
      // choices says so on its own card, so the customer is never surprised by a panel.
      var cfg=CFG.isConfigurable(p);
      // The CARD is the button. A separate small button inside a large card is a small
      // target inside a big one, which is the wrong way round on a touchscreen — and a
      // button inside a button is invalid HTML, so the pill is a span.
      return '<button type="button" class="card" role="listitem" data-id="'+p.id+'">'+pic+
        '<span class="cbody"><span class="cname">'+esc(p.name)+'</span>'+
        '<span class="cprice" dir="ltr">'+EGP(p.list_price)+'</span>'+
        '<span class="mz-btn mz-btn--primary kiosk-add" data-id="'+p.id+'">'+
        t(cfg?'choose':'add')+'</span></span></button>';
    }).join('');
    $('#k-grid').querySelectorAll('.card').forEach(function(b){b.onclick=function(){tapProduct(parseInt(b.dataset.id,10));};});
    updateCart();
  }
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  /* Tapping a product: a plain one goes straight into the order, a configurable one
     asks its questions first. The DECISION of which is which is canonical
     (MezzeProductConfig via MezzeCustomerConfig.isConfigurable) — the kiosk does not
     keep its own idea of what counts as configurable. */
  function tapProduct(id){var p=MENU.find(function(x){return x.id===id;});if(!p)return;
    if(CFG.isConfigurable(p)){openConfig(p,null);return;}
    var line=addLine(p,{});
    showOffer(line,p);}

  function moneyFn(n){return EGP(n);}
  function cfgT(k,v){
    // the renderer's vocabulary, answered from the kiosk's own dictionary so the
    // configurator speaks whatever language the customer picked
    var map={back:'back',required:'required',chooseOne:'choose1',optional:'optional',
             itemTotal:'itemtotal',add:'addtoorder',save:'savechanges',
             less:'less',more:'more',change:'change'};
    if(k==='chooseUpTo')return t('chooseupto')+' '+v;
    if(k==='included')return v+' '+t('included');
    if(k==='missing')return t('missing')+' '+v;
    if(k==='missingMore')return v.group+' — '+t('missingmore').replace('%(n)s',v.n);
    if(k==='step')return v.n+' '+t('step')+' '+v.total;
    if(k==='addAnother')return t('addanother')+' '+v;
    return map[k]?t(map[k]):k;}

  function openConfig(p,existing){
    CFG.open({product:p, existing:existing, money:moneyFn, t:cfgT,
      dir:document.documentElement.dir, emoji:food(p),
      imageUrl:p.has_image?(API+'/shop/image/'+encodeURIComponent(STORE)+'/'+p.id):null,
      onConfirm:function(chosen){
        if(existing&&existing.__upgrade){
          // the meal supersedes the single item it was built from
          var one=existing.__upgrade, i=cart.indexOf(one);
          if(i>-1){ one.qty-=1; if(one.qty<=0)cart.splice(i,1); }
          addLine(p,chosen);
        }else if(existing){replaceLine(existing,p,chosen);}
        else{addLine(p,chosen);}
        resetIdle();
      },
      onCancel:function(){resetIdle();}});
    resetIdle();}

  /* Which cart line this IS — the canonical configuration-aware identity, the same one
     the Register and the lane use. Product id alone would merge a Classic-and-Coke meal
     with a Double-and-Water one into a single line, and one customer would get the
     wrong plate. */
  function keyFor(p,c){return PC.lineKey(p.id,(c&&c.attribute_value_ids)||[],'',(c&&c.combo)||[]);}

  function addLine(p,c){
    var key=keyFor(p,c);
    var e=cart.find(function(x){return x.key===key;});
    if(e){e.qty++;}
    else{cart.push({key:key,id:p.id,name:p.name,price:(p.list_price||0)+((c&&c.price_extra)||0),
                    qty:1,avids:(c&&c.attribute_value_ids)||[],combo:(c&&c.combo)||[],
                    names:(c&&c.names)||[]});}
    updateCart();bump();
    if(!$('#k-ov').classList.contains('hidden'))openSheet();
    return e||cart[cart.length-1];}

  /* Correcting a line replaces it in place: same slot, new configuration, new identity.
     If the correction happens to match another line the customer already has, the two
     merge rather than sitting there as twins. */
  function replaceLine(line,p,c){
    var i=cart.indexOf(line); if(i<0)return;
    var qty=line.qty, key=keyFor(p,c);
    cart.splice(i,1);
    var twin=cart.find(function(x){return x.key===key;});
    if(twin){twin.qty+=qty;}
    else{cart.splice(i,0,{key:key,id:p.id,name:p.name,price:(p.list_price||0)+((c&&c.price_extra)||0),
                          qty:qty,avids:(c&&c.attribute_value_ids)||[],combo:(c&&c.combo)||[],
                          names:(c&&c.names)||[]});}
    updateCart();
    if(!$('#k-ov').classList.contains('hidden'))openSheet();}

  /* ---- one recommendation per order -------------------------------------
     Relevant, because it is derived from the branch's OWN data: a meal the customer
     could have ordered instead, containing the exact item they just added. Priced,
     because the difference is on the offer before they touch anything. Declinable,
     because "No thanks" is the same size as "Yes". Once, because a suggestion after
     every item is what makes the benchmarked kiosk feel like a salesman. */
  var offerDone=false, offerCtx=null;

  function mealFor(product){
    if(offerDone||!product||product.is_combo)return null;
    var best=null;
    MENU.forEach(function(m){
      if(!m.is_combo)return;
      var group=(m.combos||[]).find(function(c){
        return (c.items||[]).some(function(i){return i.product_id===product.id;});});
      if(!group)return;
      var delta=(m.list_price||0)-(product.list_price||0);
      if(delta<=0)return;                       // never dress a discount-free swap up as one
      if(!best||delta<best.delta)best={meal:m, group:group, delta:delta,
        item:group.items.find(function(i){return i.product_id===product.id;})};
    });
    return best;
  }

  function showOffer(line,product){
    var o=mealFor(product); if(!o)return;
    // ONE recommendation per order — spent on being SHOWN, not on being answered.
    // Otherwise a customer who ignores it and adds another item gets a second one,
    // which is the "suggestion after nearly every item" this design rejects.
    offerDone=true;
    offerCtx={line:line, offer:o};
    $('#k-offer-q').textContent=t('makemeal');
    $('#k-offer-px').textContent='+'+EGP(o.delta);
    $('#k-offer-yes').textContent=t('makeit');
    $('#k-offer-no').textContent=t('nothanks');
    $('#k-offer').classList.remove('hidden');
  }
  function hideOffer(){ $('#k-offer').classList.add('hidden'); offerCtx=null; }
  $('#k-offer-no').onclick=function(){ hideOffer(); resetIdle(); };
  $('#k-offer-yes').onclick=function(){
    if(!offerCtx)return;
    var ctx=offerCtx; hideOffer();
    // Open the meal with the item they already chose already in place; the rest of the
    // meal is still theirs to answer, and backing out leaves the original line alone.
    openConfig(ctx.offer.meal, {combo:[{item_id:ctx.offer.item.item_id}],
                                attribute_value_ids:[], __upgrade:ctx.line});
    resetIdle();
  };

  function cartCount(){return cart.reduce(function(s,l){return s+l.qty;},0);}
  function cartTotal(){return cart.reduce(function(s,l){return s+l.price*l.qty;},0);}
  /* The basket never disappears while the customer is ordering. An empty one says so
     in words instead of vanishing, so the bottom of the screen means the same thing
     from the first tap to the last — and the total is on screen at every moment,
     including while a recommendation is being made. */
  function updateCart(){var n=cartCount();
    $('#k-count').textContent=n;$('#k-carttot').textContent=EGP(cartTotal());
    $('#k-count').classList.toggle('hidden',n===0);
    $('#k-carttot').classList.toggle('hidden',n===0);
    $('#k-carthint').classList.toggle('hidden',n>0);
    $('#k-carthint').textContent=t('emptyhint');
    $('#k-review').disabled=(n===0);
    $('#k-cartbar').classList.toggle('hidden',$('#k-menu').classList.contains('hidden'));}
  function bump(){var el=$('#k-count');el.style.transform='scale(1.25)';setTimeout(function(){el.style.transform='';},150);}

  function openSheet(){
    if(!cart.length){return;}
    // The configuration is read back on the line, not hidden behind a count: a
    // customer checking their order wants to see "Fries x2", not "3 options".
    $('#k-lines').innerHTML=cart.map(function(l,i){
      var sub=(l.names&&l.names.length)?'<div class="mzc-line__cfg">'+esc(l.names.join(' · '))+'</div>':'';
      var edit=(l.names&&l.names.length)?'<button type="button" class="mzc-edit" data-e="'+i+'">'+t('edit')+'</button>':'';
      return '<div class="crow"><span class="cn">'+esc(l.name)+sub+'</span>'+
      '<span class="cn" style="flex:0 0 auto;text-align:end">'+EGP(l.price*l.qty)+'</span>'+edit+
      '<span class="mz-stepper mz-stepper--lg"><button type="button" class="mz-stepper__btn" aria-label="'+t('dec')+'" data-d="-1" data-i="'+i+'">−</button><span class="mz-stepper__value">'+l.qty+'</span><button type="button" class="mz-stepper__btn" aria-label="'+t('inc')+'" data-d="1" data-i="'+i+'">+</button></span></div>';}).join('');
    $('#k-sheettot').textContent=EGP(cartTotal());
    $('#k-lines').querySelectorAll('.mz-stepper__btn').forEach(function(b){b.onclick=function(){var i=+b.dataset.i,d=+b.dataset.d;
      cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();if(!cart.length){closeSheet();}else openSheet();};});
    $('#k-lines').querySelectorAll('.mzc-edit').forEach(function(b){b.onclick=function(){
      var l=cart[+b.dataset.e]; var p=MENU.find(function(x){return x.id===l.id;});
      if(p)openConfig(p,l);};});
    $('#k-err').classList.add('hidden');$('#k-ov').classList.remove('hidden');
  }
  function closeSheet(){$('#k-ov').classList.add('hidden');}
  $('#k-review').onclick=openSheet;$('#k-back').onclick=closeSheet;
  $('#k-ov').onclick=function(e){if(e.target===$('#k-ov'))closeSheet();};

  // service mode
  $('#k-svc').querySelectorAll('.svcbtn').forEach(function(b){b.onclick=function(){
    $('#k-svc').querySelectorAll('.svcbtn').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');svcMode=b.dataset.s;paintSvc();};});
  function paintSvc(){
    var chip=$('#k-svcchip');
    chip.textContent=t(svcMode==='eat_in'?'eatin':'takeaway');
    chip.setAttribute('aria-label',t(svcMode==='eat_in'?'eatin':'takeaway'));
    $('#k-svc').querySelectorAll('.svcbtn').forEach(function(x){
      x.classList.toggle('on',x.dataset.s===svcMode);});}
  // tapping the chip switches it — infrequent, so it stays in the top band
  $('#k-svcchip').onclick=function(){svcMode=(svcMode==='eat_in')?'takeaway':'eat_in';paintSvc();resetIdle();};

  function showMenu(){$('#k-start').classList.add('hidden');$('#k-done').classList.add('hidden');
    $('#k-menu').classList.remove('hidden');$('#k-svcchip').classList.remove('hidden');
    paintSvc();render();resetIdle();}
  $('#k-startbtn').onclick=showMenu;

  // place order (pay at counter) — reuses /shop/order fulfillment=kiosk
  $('#k-place').onclick=async function(){
    if(BUSY||!cart.length)return;BUSY=true;$('#k-place').disabled=true;
    try{
      var d=await call('/shop/order',{fulfillment:'kiosk',service_mode:svcMode,
        lines:cart.map(function(l){var o={product_id:l.id,qty:l.qty};
          if(l.avids&&l.avids.length)o.attribute_value_ids=l.avids;
          if(l.combo&&l.combo.length)o.combo=l.combo;
          return o;}),uuid:'kiosk-'+Date.now()+'-'+Math.floor(Math.random()*1e6)});
      if(!d.ok){ $('#k-err').textContent=friendly(d);$('#k-err').classList.remove('hidden');BUSY=false;$('#k-place').disabled=false;return; }
      closeSheet();$('#k-menu').classList.add('hidden');$('#k-cartbar').classList.add('hidden');
      $('#k-num').textContent='#'+(d.tracking||'—');$('#k-done').classList.remove('hidden');
      cart=[];updateCart();  // clear immediately — including the badge the next
                             // customer would otherwise walk up to
      BUSY=false;$('#k-place').disabled=false;resetIdle();
    }catch(e){ $('#k-err').textContent=t('err');$('#k-err').classList.remove('hidden');BUSY=false;$('#k-place').disabled=false; }
  };
  /* The server speaks in rules ("Combo X needs 1 item(s) from Y"); a customer needs a
     sentence in their own language. An internal message is never put on the screen. */
  function friendly(d){
    var e=(d&&d.error)||'', m=(d&&d.message)||'';
    if(e==='selforder_paused')return t('unavailable');
    if(e==='store_closed')return t('unavailable');
    if(/not available|86|unavailable|self.?order/i.test(m))return t('gone');
    if(/combo|item|attribute|allows at most|needs/i.test(m))return t('badconfig');
    return t('err');}

  $('#k-newbtn').onclick=fullReset;

  // ---- inactivity + privacy reset ----
  var IDLE_MS=60000, WARN_MS=15000, idleTimer=null, warnTimer=null, countTimer=null;
  function fullReset(){
    // clear ALL customer state — no previous cart/PII remains
    cart=[];svcMode='takeaway';BUSY=false;
    // a configurator left open by the previous customer is previous-customer state too
    var open_=document.querySelector('.mzc-scrim'); if(open_&&open_.parentNode)open_.parentNode.removeChild(open_);
    offerDone=false;hideOffer();
    $('#k-svc').querySelectorAll('.svcbtn').forEach(function(x,i){x.classList.toggle('on',i===0);});
    closeSheet();$('#k-idle').classList.add('hidden');$('#k-menu').classList.add('hidden');$('#k-done').classList.add('hidden');
    $('#k-num').textContent='#—';
    $('#k-svcchip').classList.add('hidden');paintSvc();
    $('#k-start').classList.remove('hidden');updateCart();
    resetIdle();
  }
  function showIdleWarn(){
    // never interrupt an in-flight submission
    if(BUSY){resetIdle();return;}
    $('#k-idle').classList.remove('hidden');var left=Math.floor(WARN_MS/1000);
    $('#k-idlecount').textContent=t('resetting')+' '+left+'s';
    countTimer=setInterval(function(){left--;$('#k-idlecount').textContent=t('resetting')+' '+left+'s';if(left<=0){clearInterval(countTimer);}},1000);
    warnTimer=setTimeout(fullReset,WARN_MS);
  }
  function resetIdle(){
    clearTimeout(idleTimer);clearTimeout(warnTimer);clearInterval(countTimer);
    $('#k-idle').classList.add('hidden');
    // only run the idle clock once the customer has started (not on the start screen)
    if(!$('#k-start').classList.contains('hidden'))return;
    idleTimer=setTimeout(showIdleWarn,IDLE_MS);
  }
  $('#k-imhere').onclick=resetIdle;
  ['click','touchstart','keydown','scroll'].forEach(function(ev){document.addEventListener(ev,function(){
    if(!$('#k-idle').classList.contains('hidden'))return; // handled by button
    if($('#k-start').classList.contains('hidden'))resetIdle();
  },{passive:true});});

  boot();
})();
</script>
</body>
</html>
