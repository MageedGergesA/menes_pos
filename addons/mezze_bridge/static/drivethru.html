<!DOCTYPE html>
<!-- Part of the Mezze POS platform. Drive-thru lane board (operator screen). -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="design/foundation.css?v=f8">
<link rel="stylesheet" href="design/components.css?v=f8">
<!-- CONV-1: the SAME product browser the Register uses. Not a copy of it. -->
<link rel="stylesheet" href="design/product-browser.css?v=f8">
<!-- CONV-2a: and the SAME category navigation — the >=1280 sidebar and the
     contract that keeps exactly one of sidebar/chips visible. The Order Taker
     layout that consumes it lands in CONV-2b; linking it here is what makes that
     a layout change rather than another private copy of the Register's CSS. -->
<link rel="stylesheet" href="design/category-nav.css?v=f8">
<!-- CONV-2b: and the SAME order panel — 340px column, line anatomy, totals and
     the 62px primary action. The drive-thru's action says CONFIRM & SEND instead
     of CHARGE; everything about how an order READS is the Register's. -->
<link rel="stylesheet" href="design/order-panel.css?v=f8">
<!-- CONV-3: and the SAME product configurator — the panel a guest's "no onion,
     extra cheese, large" is answered in, plus the RULES behind it. The rules are
     where the mistakes live, so they are shared as code, not re-implemented. -->
<link rel="stylesheet" href="design/product-config.css?v=qm">
<script src="design/product-config.js?v=qm"></script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Drive-Thru · Mezze</title>
<style>
  /* This board used to carry its own 36-colour palette and its own dark-mode
     block, so it ignored the branch's chosen theme completely: pick Forest at the
     Register and the drive-thru stayed orange. Every local name below is now just
     an alias onto the shared --mz- token of the SAME role, which means the whole
     page follows the theme registry (all 11 themes, light and dark, high contrast
     and every accent) without another palette to keep in sync.
     The fallbacks are the ORIGINAL values, so the board still renders sensibly if
     it is ever opened without the design stylesheet. */
  :root{
    --bg:var(--mz-canvas,#fbf6ee);
    --card:var(--mz-surface,#ffffff);
    --card2:var(--mz-surface-2,#fff9f0);
    --ink:var(--mz-text,#20180f);
    --ink2:var(--mz-text-2,#6e6152);
    --ink3:var(--mz-text-mut,#a89a86);
    --line:var(--mz-border,#ece1d0);
    --accent:var(--mz-brand,#e8892b);
    --accent-d:var(--mz-brand-press,#cf6f16);
    --accent-ink:var(--mz-on-brand,#fff);
    --ok:var(--mz-ok,#2f9e6b);
    --warn:var(--mz-warn,#c4881f);
    --crit:var(--mz-danger,#c0453f);
    /* the header gradient reads as ONE brand ramp rather than three fixed oranges */
    --hero1:var(--mz-brand-hover,#f6a545);
    --hero2:var(--mz-brand,#e8722b);
    --hero3:var(--mz-brand-press,#c9541b);
    --sh:0 1px 2px rgba(32,24,15,.05),0 10px 26px rgba(32,24,15,.08);
  }
  /* Dark is the theme registry's job now (data-mz-mode="dark" swaps the tokens
     above), so a second, contradicting dark palette here would only fight it. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea,a{touch-action:manipulation}
  button:not(:disabled),[role=button],a[href]{cursor:pointer}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:var(--mz-font-text,'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
    -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  /* height, not min-height: with min-height the column grows to fit its content and
     the whole CANVAS scrolls, which scrolls the queue and the ops strip out of
     sight. Fixing the shell to the viewport makes the QUEUE the scroller, so the
     operator never loses the lane status while reading down the list. */
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
  /* Matches the Register's .mz-topbar: a flat surface with a hairline border, not
     a brand gradient. A lane board is watched for a whole shift, and a full-bleed
     gradient both tires the eye and refuses to follow the branch's theme. */
  header{position:relative;display:flex;align-items:center;gap:16px;padding:14px 24px;
    color:var(--ink);background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
  header>*{position:relative;z-index:1}
  .logo{width:46px;height:46px;border-radius:13px;background:var(--mz-brand-soft,var(--card2));border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
  .hactions{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .brand{font-size:22px;font-weight:900;letter-spacing:-.01em}
  .brand small{display:block;font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
  .conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--ink2);padding:7px 12px;border-radius:20px}
  /* ---- station crumbs ----
     A trail, not a tab bar: it reads left to right as where you are among the lane's
     stations, and every other station is a LINK beside it — a station is a URL, so it
     stays openable in another tab even though a plain click switches in place. The one
     you are standing at is a plain element, never a link to where you already are.
     Logical properties only, and the separator is "/" — a glyph that needs no
     mirroring in RTL. */
  .dtcrumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
  /* 44px minimum: this is a touch screen in a lane, and the trail is not exempt
     from the floor every other control on this page is held to. */
  .dtcrumb{appearance:none;border:0;background:transparent;cursor:pointer;
    display:inline-flex;align-items:center;text-decoration:none;
    font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;
    color:var(--ink3);padding:7px 10px;border-radius:9px;
    min-height:44px;min-width:44px;justify-content:center;white-space:nowrap}
  .dtcrumb:hover{background:var(--card2);color:var(--ink)}
  .dtcrumb:focus-visible{outline:2.5px solid var(--mz-focus,var(--accent));outline-offset:2px}
  /* the station you are standing at: named, not just highlighted */
  .dtcrumb[aria-current=page]{color:var(--ink);background:var(--mz-brand-soft,var(--card2));
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);cursor:default}
  .dtcrumb[aria-current=page]:hover{background:var(--mz-brand-soft,var(--card2))}
  .dtcrumbs__s{color:var(--ink3);opacity:.5;font-size:12px;user-select:none}
  @media (max-width:1100px){ .dtcrumb{padding:7px 8px;font-size:12px} }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
  /* F6: operational control on a drive-thru tablet -> 44px minimum (measured 104x40). */
  .newbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-size:14.5px;font-weight:900;min-height:44px;box-sizing:border-box}
  /* the language toggle is a secondary control — the primary action on this screen
     is taking the next car, and two filled buttons side by side compete */
  /* min-width matters as much as min-height: a one-glyph label ("ع") shrank the
     button to 40px wide, under the 44px touch minimum, even though it was tall
     enough. Both dimensions are part of the target. */
  #lang{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:800;
    padding:12px 14px;min-width:44px;min-height:44px}
  #lang:hover{background:var(--card2);color:var(--ink)}
  main{flex:1;padding:22px 30px 40px;display:flex;gap:22px;align-items:flex-start;overflow-x:auto}
  .lane{flex:1;min-width:320px;max-width:520px}
  .lanehd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .lanehd h2{font-size:18px;font-weight:900;letter-spacing:-.01em}
  .lanehd .cnt{font-size:12.5px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
  .empty{color:var(--ink3);font-size:14px;font-weight:600;padding:26px 0;text-align:center}
  .car{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;position:relative}
  .car.ready{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
  .car .top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .car .pos{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:17px;font-weight:900;
    background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-d)}
  .car .veh{flex:1;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .car .veh small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:1px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .b{font-size:10.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;border-radius:20px}
  .b.prep{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .b.rdy{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .b.win{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-d)}
  .b.paid{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .b.due{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
  .items{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-bottom:11px}
  .items b{color:var(--ink);font-weight:700}
  .foot{display:flex;align-items:center;gap:9px}
  .tot{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-inline-end:auto}
  /* FINAL-C4 — lane-card actions are the operator's primary touch targets: >=44px both
     axes (the dismiss "x" was 27x40 and is the easiest one to miss under pressure). */
  .act{border:0;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:800;cursor:pointer;
       min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .act.p{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .act.g{background:var(--ok);color:#fff}
  .act.o{background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
  .act.x{background:none;color:var(--ink3);padding:11px 8px}
  .mins{position:absolute;top:14px;inset-inline-end:16px;font-size:11.5px;font-weight:700;color:var(--ink3)}
  /* new-car sheet */
  /* a neutral scrim: the old rgba(16,10,4,.55) was a brown wash that tinted every
     theme's surfaces the same muddy colour underneath the sheet */
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  /* Bottom-anchored, the footer action fell below the fold on a short screen.
     Centred with a bounded height keeps "Send to kitchen" reachable at any size. */
  .sheet{align-items:center}

  /* ---- CONV-2b: New Car is a SHORT PRE-STEP ----
     It used to dock to the side and carry the whole catalogue, because ordering
     happened inside it. Ordering now happens in the workspace, so this is a small
     centred dialog that captures a lane and a vehicle and gets out of the way.
     Nothing behind it needs to stay readable for more than a few seconds, and the
     workspace it hands over to is the thing the operator actually works in. */
  .inner{position:relative;background:var(--card);width:100%;max-width:520px;max-height:min(88vh,760px);
    border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--sh);animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .shead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .shead h2{font-size:18px;font-weight:900;flex:1}
  .sx{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);font-size:16px}
  .sbody{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:16px 20px;gap:14px}
  /* ---- DT-UX1: operations strip ---- */
  .ops{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
  .ops .m{display:flex;flex-direction:column;gap:1px;min-width:64px}
  .ops .mk{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
  .ops .mv{font-size:19px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .ops .mv.warn{color:var(--warn)} .ops .mv.late{color:var(--crit)}
  .ops .sep{width:1px;align-self:stretch;background:var(--line)}
  .lanefilter{display:flex;gap:6px;margin-inline-start:auto}
  /* 44px on BOTH axes — a filter is tapped mid-rush on a touch till like any
     other control, and 36px tall was my own regression against the floor. */
  .lanefilter button{min-height:44px;min-width:44px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:transparent;color:var(--ink2);font-weight:800;font-size:13px}
  .lanefilter button[aria-pressed=true]{background:var(--mz-brand-soft,var(--card2));
    border-color:var(--accent);color:var(--accent-d)}

  /* ---- DT-UX1: one vertical queue, ordered by urgency ----
     Lane columns hid WHO IS WORST: the longest-waiting car could be second in a
     column while a fresh car sat at the top of the other. One queue sorted by
     elapsed answers "who do I deal with now" without the operator comparing
     columns. Lane stays visible as a marker on every row. */
  .queue{display:block;padding:12px 24px 24px;overflow-y:auto;flex:1 1 auto;min-height:0}
  /* Density: the items line shares the row rather than adding a third band, so more
     cars fit a screen without shrinking the timer — which stays the largest value. */
  .qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;
    padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    margin-bottom:8px}
  .qrow .qitems{grid-column:2;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow.late{border-color:var(--crit)}
  .qrow.warnrow{border-color:var(--warn)}
  .qtime{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
    min-width:88px;text-align:start}
  .qtime.warn{color:var(--warn)} .qtime.late{color:var(--crit)}
  .qsub{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink3);margin-top:3px}
  .qveh{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;
    font-size:12.5px;color:var(--ink2)}
  .qlane{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 7px;
    border-radius:7px;background:var(--card2);border:1px solid var(--line);
    font-size:12px;font-weight:800;color:var(--ink2)}
  .qacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .qitems{font-size:12.5px;color:var(--ink2)}
  /* ---- DT-UX3: payment window ----
     A payment operator is answering a different question from an order taker, so
     the workspace is different: no product catalogue by default, the vehicle and
     the amount are the two biggest things on screen, and the approaching queue
     stays beside it (the same queue component, narrowed — not a second one). */
  .modes{display:flex;flex:1 1 auto;min-height:0}
  .modes .queue{flex:1 1 auto}
  body[data-mode=payment] .modes .queue{flex:0 0 300px;border-inline-end:1px solid var(--line);
    padding:12px 14px 20px}
  body[data-mode=payment] .qrow{grid-template-columns:1fr;gap:4px;padding:9px 11px}
  body[data-mode=payment] .qrow .qacts,body[data-mode=payment] .qrow .qitems{display:none}
  body[data-mode=payment] .qtime{font-size:22px;min-width:0}
  body[data-mode=payment] .qrow[aria-current=true]{border-color:var(--accent);
    background:var(--mz-brand-soft,var(--card2))}
  .pay{display:none}
  /* A payment check is a COLUMN of facts, not a banner: letting it stretch the
     full width of a 1920 screen puts the amount and the CTA a head-turn apart.
     Bounded, so the operator's eye travels vehicle -> amount -> action. */
  body[data-mode=payment] .pay{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;
    overflow-y:auto;padding:18px 22px 22px;gap:14px;max-width:760px}

  .payhero{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .payveh{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .payid{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink2);margin-top:4px}
  /* ==========================================================================
     CONV-2b — THE ORDER TAKER WORKSPACE
     [ queue 200 ][ categories 201 ][ products — the largest pane ][ order 341 ]
     Only the QUEUE is defined here. Categories, products and the order panel are
     the canonical Mezze components (design/category-nav.css,
     design/product-browser.css, design/order-panel.css) and this file adds not one
     rule to them — that is the whole point of the convergence.
     ========================================================================== */
  .ot{display:none}
  /* min-width:0 or the grid's min-content width props the whole workspace open and
     pushes the order panel off the screen — which is exactly what happened at 1024. */
  body[data-mode=order] .ot{display:flex;flex:1 1 auto;min-height:0;min-width:0}
  /* The board belongs to Operations now. Payment and pickup keep it as their
     narrow context rail, exactly as they were certified with. */
  body[data-mode=order] .modes>.queue{display:none}

  /* ---- compact queue: lane, vehicle, timer, state. Nothing else — the row-level
     operational actions live in Operations, one button away. ---- */
  .otq{flex:0 0 200px;width:200px;display:flex;flex-direction:column;min-height:0;
    gap:10px;padding:12px 10px;background:var(--card2);border-inline-end:1px solid var(--line)}
  @media (max-width:1600px){ .otq{flex-basis:180px;width:180px} }
  .otq__hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:0 4px}
  .otq__t{font-size:10.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3)}
  .otq__n{font-size:12px;font-weight:800;color:var(--ink2)}
  .otq__list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;flex:1 1 auto}
  .otq__empty{padding:14px 6px;font-size:12.5px;font-weight:600;color:var(--ink3);text-align:center}
  /* a real button: the row is selectable, so it carries button semantics rather
     than a click handler on a div */
  .otcar{display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:center;
    width:100%;min-height:56px;padding:8px 10px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    text-align:start;cursor:pointer;font:inherit}
  .otcar:hover{border-color:var(--ink3)}
  .otcar:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  .otcar--active{border-color:var(--accent);background:var(--mz-brand-soft,var(--card2))}
  .otcar__veh{grid-column:1;font-size:13.5px;font-weight:800;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .otcar__t{grid-column:2;grid-row:1;font-size:15px;font-weight:800;
    font-variant-numeric:tabular-nums;color:var(--ink2)}
  .otcar__t.warn{color:var(--warn)} .otcar__t.late{color:var(--crit)}
  .otcar__m{grid-column:1/-1;display:flex;align-items:center;gap:6px;
    font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .otcar__lane{display:inline-grid;place-items:center;min-width:22px;height:16px;padding:0 5px;
    border-radius:5px;background:var(--card2);border:1px solid var(--line);
    font-size:9.5px;font-weight:800;color:var(--ink2)}
  .otcar--active .otcar__st{color:var(--accent-d)}
  .otq__ops{flex:0 0 auto;min-height:44px;border-radius:11px;border:1px solid var(--line);
    background:transparent;color:var(--ink2);font-size:12.5px;font-weight:800;cursor:pointer}
  .otq__ops:hover{background:var(--card)}
  .otq__ops:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

  /* ---- the product pane owns the remaining width, and the configurator docks
     over it rather than over the queue or the order ---- */
  .otmenu{position:relative;display:flex;flex:1 1 auto;min-width:0;min-height:0}
  .otmenu>.mz-catalog{flex:1 1 auto;min-width:0;min-height:0}

  /* ---- drive-thru context inside the canonical order panel ---- */
  .otctx{display:flex;flex-direction:column;gap:2px;padding:12px 16px;
    border-bottom:1px solid var(--line);background:var(--card2)}
  .otctx__veh{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .otctx__m{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
  .otctx__lane{color:var(--accent-d)}

  /* ---- the active car, in the operating strip, where it cannot scroll away ---- */
  .otnow{display:flex;align-items:center;gap:9px;padding:5px 11px;border-radius:20px;
    background:var(--mz-brand-soft,var(--card2));border:1px solid var(--line)}
  .otnow__veh{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .otnow__lane{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--accent-d)}
  .otqbtn{display:none}

  /* ---- 1024: the queue gets out of the way. Products and the order panel are the
     workspace; the active car stays in the strip, and the queue is one tap away.
     Off-canvas by inset (logical) rather than transform (physical), so Arabic
     mirrors correctly and reduced-motion users get no sliding panel. ---- */

    body[data-mode=order].otq-open .otqscrim{display:block;position:fixed;inset:0;z-index:45;
      background:rgba(0,0,0,.38)}

  }
  .otqscrim{display:none}

  /* ---- product configurator ----

     canonical ones in design/product-config.css, and it now floats in the canonical

  .nowindow{display:flex;flex-direction:column;gap:14px}
  .nowindow .h{font-size:20px;font-weight:800;color:var(--ink2)}
  .nowindow .b{color:var(--ink2)}
  .nextcall{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card2);
    display:flex;flex-direction:column;gap:6px}
  .nextcall .k{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

  /* ---- DT-UX4: pickup window ----
     Same shell and same queue as payment; the difference is what dominates. Here
     the answer to "can this leave?" is the hero, because that is the only decision

    border:1px solid var(--line);background:var(--card2)}

  .verdict .b{font-size:13px;color:var(--ink2);margin-top:2px}

    font-size:18px;font-weight:900;width:100%}
  .handoff:disabled{background:var(--card2);color:var(--ink3);border:1px solid var(--line)}
  .gotopay{min-height:52px;border-radius:12px;border:1px solid var(--accent);background:transparent;
    color:var(--accent-d);font-size:15px;font-weight:800;width:100%}
  /* Tablet: the queue becomes a horizontal strip rather than a stacked band. A
     vertical list in a 26vh band showed exactly ONE next car; laid across, the
     same height carries several, which is what a pickup operator actually needs
     ("who is behind this one"). */
  @media (max-width:1100px){
    body[data-mode=pickup] .modes{flex-direction:column}
    body[data-mode=pickup] .modes .queue{flex:0 0 auto;max-height:none;
      border-inline-end:0;border-bottom:1px solid var(--line);

    body[data-mode=pickup] .modes .queue .empty{flex:1 1 auto}

      border-inline-end:0;border-bottom:1px solid var(--line)}

  .lanevar{display:flex;gap:10px;margin-bottom:12px}
  .lanevar button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:14px;font-weight:800}

  /* CONV-2b: the drive-thru's own cart line is GONE too. The line, its quantity

  .btn:disabled{opacity:.5}

    <nav class="dtcrumbs" id="crumbs" data-tal="stations" aria-label="Stations"></nav>

  <div class="modes">

  // ---- DT-UX1 speed of service ------------------------------------------------
  // The SERVER owns the clock. Each poll carries `now`; we keep the offset between

  // display ever drifting to the till's own (possibly wrong) clock.
  var SKEW=0, TARGET=180, LANEFILTER='all';
  function parseTs(s){ return s ? Date.parse(s.replace(' ','T')+'Z') : 0; }

  // controlled clock rather than against a browser scheduler. Every product path
  // uses Date.now; only the debug handle can swap it, and only in developer mode.
  var NOW = Date.now;

  function elapsed(c){ var p=parseTs(c.placed_at); return p ? Math.max(0,(serverNow()-p)/1000) : 0; }

  function renderBoard(d){

  // ---- DT-UX3 payment window ------------------------------------------------
  // SELECTION RULE (documented, not silent): the window recommends the
  // longest-waiting car that is still UNPAID and neither collected nor cancelled —

  // disagree about who is next. The operator can select any car by clicking it,
  // and the recommendation never tenders by itself: paying is always a deliberate

  // PHYSICAL POSITION BEFORE AGE. `at_window` means the car has actually reached

  // ---- DT-UX4 pickup window --------------------------------------------------
  // PHYSICAL ORDER, not urgency. At the pickup window the operator serves the car
  // that is actually in front of them, so a car called forward (at_window) comes
  // first; otherwise the oldest READY car. The queue still shows everyone, but the
  // recommendation never tells staff to serve a car that is physically behind
  // another one just because its timer is worse.
  /** Where food physically leaves: the PICKUP window in a two-window branch, the
   *  single window in a combined one. Read from the server's topology rather than
   *  assumed, so one screen serves both restaurant layouts. */
  function handoffStage(){ return (LAST && LAST.topology==='two_window') ? 'pickup_window' : 'payment_window'; }
  function atHandoff(c){ return !!c && c.vehicle_stage===handoffStage(); }
  function pickable(d){
    var live=activeCars(d);
    var here=live.filter(atHandoff).sort(byService);
    if(here.length) return here;
    // nobody at the handoff point: offer the merged order, ready cars first
    return live.filter(function(c){ return c.kitchen_ready; }).sort(byService)
      .concat(live.filter(function(c){ return !c.kitchen_ready; }).sort(byService));
  }
  // "CURRENT VEHICLE" must mean the car physically at the window. Calling an
  // older car in the lane "current" overstates what the system actually knows, and
  // the operator reads that label as "the car in front of me".
  function pickCurrent(d){
    var all=activeCars(d);
    if(SELECTED){
      var pick=all.filter(function(c){ return String(c.id)===String(SELECTED); })[0];
      if(pick) return pick;
      SELECTED=null;     // collected or cancelled elsewhere — fall back cleanly
    }
    return all.filter(atHandoff).sort(byService)[0] || null;

   *  the lane, so both screens and any other client agree on it. */
  function nextToCall(d){
    if(d && d.next_to_call){
      var byId=activeCars(d).filter(function(c){ return c.id===d.next_to_call; })[0];
      if(byId) return byId;
    }
    return pickable(d).filter(function(c){ return !atHandoff(c); })[0] || null;
  }
  /** Eligibility mirrors the SERVER contract (_paid && _kitchen_ready). The button
   *  is predictive only; the server decides at mutation time. */
  function eligibility(c){
    var payOk=!!c.paid, kitchenOk=!!c.kitchen_ready, atWin=atHandoff(c);
    return {ok:payOk&&kitchenOk&&atWin, payOk:payOk, kitchenOk:kitchenOk, atWindow:atWin};
  }

      // Nobody is at the window. Say exactly that, and separately name who should

        +'<div><div class="h">'+esc(t('handoffready'))+'</div>'

        +'<div><div class="h">'+esc(t('blockedboth'))+'</div>'
        +'<div class="b">'+esc(t('kitchenpreparing'))+' · '+esc(t('paymentrequired'))+'</div></div></div>';
    } else if(!el.kitchenOk){
      verdict='<div class="verdict block" role="status"><span class="icon" aria-hidden="true">⏳</span>'
        +'<div><div class="h">'+esc(t('notready'))+'</div>'
        +'<div class="b">'+esc(t('kitchenpreparing'))+'</div></div></div>';
    } else if(!el.payOk){
      verdict='<div class="verdict block" role="status"><span class="icon" aria-hidden="true">💳</span>'
        +'<div><div class="h">'+esc(t('paymentrequired'))+'</div>'
        +'<div class="b">'+esc(t('paymentrequiredb'))+'</div></div></div>';
    } else {

      verdict='<div class="verdict block" role="status"><span class="icon" aria-hidden="true">🚗</span>'
        +'<div><div class="h">'+esc(t('callforwardfirst'))+'</div>'
        +'<div class="b">'+esc(t('callforwardfirstb'))+'</div></div></div>';
    }
    var items=(c.items||[]).map(function(i){
      return '<div class="row"><span><b>'+i.qty+'×</b> '+esc(i.name)+'</span></div>'; }).join('');
    var note=c.note?'<div class="row"><span>'+esc(c.note)+'</span></div>':'';
    // The blocked reason lives OUTSIDE the disabled control (the verdict above), so
    // it is readable and reachable even though a disabled button takes no focus.
    var cta='<button class="handoff" type="button" id="dohandoff"'
      +(el.ok?'':' disabled="disabled"')+' aria-describedby="pickverdict">'
      +esc(t('handoff'))+'</button>';
    var pay=el.payOk?'':'<button class="gotopay" type="button" id="gotopay">'+esc(t('gotopayment'))+'</button>';

    host.innerHTML=
      '<div class="payhero"><div><div class="payveh">'+esc(c.vehicle||('#'+c.tracking))+'</div>'+
        '<div class="payid">'+esc(t('lane'))+' '+(c.lane||1)+' · #'+esc(c.tracking)+'</div>'+
        (atHandoff(c)?'':'<div class="notatwindow" data-testid="not-at-window">'
           +esc(t('notcalledfwd'))+'</div>')+'</div>'+
        '<div class="payclock"><div class="v num '+b+'" data-elapsed="'+c.id+'">'+mmss(sec)+'</div>'+
          '<div class="k">'+esc(t('totalcycle'))+'</div></div></div>'+
      '<div id="pickverdict">'+verdict+'</div>'+
      '<div class="tracks">'+
        '<div class="track"><div class="k">'+esc(t('kitchen'))+'</div>'+kitchen+'</div>'+
        '<div class="track"><div class="k">'+esc(t('payment'))+'</div>'+payst+'</div></div>'+

    if(gp) gp.onclick=function(){ location.href='/mezze/drivethru?mode=payment'; };

  function handOff(c){
    if(PAYSTATE==='processing') return;                 // double/triple click guard
    PAYSTATE='processing'; renderPick(LAST);
    call('/drivethru/stage',{drivethru_id:parseInt(c.id,10),action:'collected'})
      .then(function(d){
        PAYSTATE='idle';
        if(d&&d.ok){ SELECTED=null; poll(); return; }   // auto-SELECT next, never auto-hand-off
        // The server refused. Say which refusal, in operator language.
        var code=(d&&d.error)||'';
        var msg = code==='kitchen_not_ready'  ? t('kitchenpreparing')
                : code==='unpaid'             ? t('paymentrequired')
                // another till already cancelled or handed off this car; the board
                // is a poll behind, so say so plainly instead of "handoff failed"
                : code==='invalid_transition' ? t('alreadyleft')
                : (d&&d.message)||t('handofffailed');
        mzToast(msg);
        poll();                                          // reconcile with server truth
      })
      .catch(function(){ PAYSTATE='idle'; mzToast(t('handofffailed')); poll(); });
  }

  // one label for what a car is doing, used by the board and the compact queue
  function stageLabel(c){
    return c.state==='at_window' ? t('atwindow')
         : (c.kitchen_ready||c.state==='ready') ? t('ready') : t('preparing');
  }
  function queueRow(c){
    var sec=elapsed(c), b=band(sec);
    var el=document.createElement('div');
    el.className='qrow'+(b==='late'?' late':(b==='warn'?' warnrow':''));
    // NOT `stage`: this row's click handlers close over the outer stage() action,
    // and a var of that name is hoisted over the whole of queueRow — which shadowed
    // the function with a string and made every row button throw instead of act.
    var stLabel = stageLabel(c);
    var stbadge = c.state==='at_window' ? '<span class="b win">'+esc(t('atwindow'))+'</span>'
                : (c.kitchen_ready||c.state==='ready') ? '<span class="b rdy">'+esc(t('ready'))+'</span>'
                : '<span class="b prep">'+esc(t('preparing'))+'</span>';
    var paybadge = c.paid ? '<span class="b paid">'+esc(t('paid'))+'</span>'
                          : '<span class="b due">'+esc(t('due'))+'</span>';
    var acts='';
    if(c.state!=='at_window') acts+='<button class="act o" data-a="window" data-id="'+c.id+'">'+esc(t('callfwd'))+'</button>';
    if(!c.paid) acts+='<button class="act p" data-a="pay" data-id="'+c.id+'">'+esc(t('takepay'))+' · '+MONEY(c.total)+'</button>';
    else acts+='<button class="act g" data-a="collected" data-id="'+c.id+'">'+esc(t('collected'))+'</button>';
    acts+='<button class="act x" data-a="cancel" data-id="'+c.id+'" title="'+esc(t('cancel'))+'" aria-label="'+esc(t('cancel'))+'">✕</button>';
    var items=(c.items||[]).map(function(i){return '<b>'+i.qty+'×</b> '+esc(i.name);}).join(' · ');
    el.innerHTML=
      '<div><div class="qtime num '+b+'" data-elapsed="'+c.id+'">'+mmss(sec)+'</div>'+
        '<div class="qsub">'+esc(b==='late'?t('late'):(b==='warn'?t('attention'):stLabel))+'</div></div>'+
      '<div><div class="qveh">'+esc(c.vehicle||('#'+c.tracking))+'</div>'+
        '<div class="qmeta"><span class="qlane">L'+(c.lane||1)+'</span>'+
          '<span class="num">#'+esc(c.tracking)+'</span>'+stbadge+paybadge+
          '<span class="tot num">'+MONEY(c.total)+'</span></div></div>'+
      '<div class="qacts">'+acts+'</div>'+
      (items?'<div class="qitems">'+items+'</div>':'');
    el.querySelectorAll('[data-a]').forEach(function(b2){ b2.onclick=function(){ stage(b2.dataset.id,b2.dataset.a); }; });
    return el;
  }

  // Tick the visible timers once a second WITHOUT re-rendering the queue (a full
  // re-render every second would fight the operator's pointer and spam a screen
  // reader). Only the digits change; order is re-evaluated on the next poll.
  // Named so it can be certified directly against a controlled clock: waiting on the
  // scheduler proves the scheduler, not the arithmetic the operator reads.
  // It re-queries the DOM every time on purpose — the 2s poll replaces these nodes,
  // and a held reference would go on displaying the time it was detached at.
  function tickTimers(){
    if(!LAST) return;
    var byId={}; activeCars(LAST).forEach(function(c){ byId[c.id]=c; });
    document.querySelectorAll('[data-elapsed]').forEach(function(node){
      var c=byId[node.getAttribute('data-elapsed')]; if(!c) return;
      var sec=elapsed(c), b=band(sec);
      node.textContent=mmss(sec);
      node.className='qtime num '+b;
    });
  }
  var TICK_ID = setInterval(tickTimers, 1000);
  function stage(id,action){
    var body={drivethru_id:parseInt(id,10),action:action};
    if(action==='pay')body.payment_method_id=PM;
    call('/drivethru/stage',body).then(function(d){
      if(d&&d.ok){ poll(); return; }
      // a car another till just cancelled or handed off is gone, whatever this
      // board still shows — name that in the operator's language, then reconcile
      mzToast((d&&d.error)==='invalid_transition' ? t('alreadyleft')
              : (d&&d.message)||t('handofffailed'));
      poll();
    });
  }

  // ---- new-car order form ----
  function sheet(on){
    // A short dialog now, not a docked ordering panel: nothing behind it has to
    // stay usable while a lane and a vehicle are typed.
    $('#ov').classList.toggle('on',on);
  }
  function renderLaneVar(){ var el=$('#lanevar'); el.innerHTML='';
    [1,2].forEach(function(n){ var b=document.createElement('button'); b.textContent=t('lane')+' '+n; b.className=(n===lane?'on':'');
      b.onclick=function(){ var was=lane; lane=n; DRAFT.lane=n; renderLaneVar(); renderCtx();
        // clear the board we were on, then publish to the one we moved to,
        // so a lane switch can never strand an order on the wrong screen
        if(was!==n){ var keep=cart; cart=[]; ocbPublish('clear'); cart=keep; }
        ocbPublish(); ocbStatus(); }; el.appendChild(b); }); }
  /* ---- canonical product browser (CONV-1) -----------------------------------
     The card, the grid, the category chip and the search bar are the Register's,
     from the Register's own stylesheet. What follows is only the DATA plumbing —
     which products this branch shows and which one the operator tapped. There are
     deliberately no drive-thru card styles: products are products. */
  function visibleProducts(){
    var q=PQ.trim().toLowerCase();
    return PRODUCTS.filter(function(p){
      if(CAT!=='all' && (p.cats||[]).indexOf(CAT)===-1) return false;
      return !q || p.name.toLowerCase().indexOf(q)>-1;
    });
  }
  function catList(){
    var counts={}; PRODUCTS.forEach(function(p){ (p.cats||[]).forEach(function(c){ counts[c]=(counts[c]||0)+1; }); });
    return [{id:'all', name:t('allitems'), n:PRODUCTS.length}].concat(
      CATS.filter(function(c){ return counts[c.id]; })
          .map(function(c){ return {id:c.id, name:c.name, n:counts[c.id]}; }));
  }
  function pickCat(id){ CAT=id; renderCats(); renderMenu(); }
  function renderCats(){
    var list=catList();
    // the COMPACT form (<1280): the canonical filter chip
    var el=$('#cats');
    if(el){ el.innerHTML='';
      list.forEach(function(c){
        var b=document.createElement('button');
        b.type='button';
        // .mz-cat folds onto the canonical filter chip — 44px, aria-pressed, and a
        // selected cue that is not colour alone
        b.className='mz-cat mz-filter-chip'+(CAT===c.id?' mz-cat--active':'');
        b.setAttribute('aria-pressed', CAT===c.id?'true':'false');
        // the Register's chip is the label and nothing else; the count is its own line
        b.textContent=c.name;
        b.onclick=function(){ pickCat(c.id); };
        el.appendChild(b);
      });
    }
    // the DESKTOP form (>=1280): the canonical sidebar, with live counts. Same
    // markup and the same stylesheet as the Register — design/category-nav.css
    // also owns the rule that keeps exactly one of the two visible.
    var side=$('#otcatlist');
    if(side){ side.innerHTML='';
      list.forEach(function(c){
        var b=document.createElement('button');
        b.type='button';
        b.className='mz-catside__item'+(CAT===c.id?' mz-catside__item--active':'');
        b.setAttribute('aria-pressed', CAT===c.id?'true':'false');
        b.innerHTML='<span class="mz-catside__n"></span><span class="mz-catside__c"></span>';
        b.querySelector('.mz-catside__n').textContent=c.name;
        b.querySelector('.mz-catside__c').textContent=String(c.n);
        b.onclick=function(){ pickCat(c.id); };
        side.appendChild(b);
      });
    }
  }
  function initials(name){
    return String(name||'').replace(/^\[[^\]]*\]\s*/,'').split(/\s+/).slice(0,2)
      .map(function(w){ return w.charAt(0); }).join('').toUpperCase();
  }
  function renderMenu(){
    var el=$('#menu'); if(!el) return; el.innerHTML='';
    var list=visibleProducts();
    var pc=$('#pcount'); if(pc) pc.textContent=list.length+' '+t('itemsavailable');
    if(!list.length){ el.innerHTML='<div class="mz-grid-empty">'+esc(t('noproducts'))+'</div>'; return; }
    list.forEach(function(p){
      var cell=document.createElement('div'); cell.className='mz-tile-cell';
      var out=p.available===false;
      // the product's REAL Odoo image through the native session-authenticated route,
      // exactly as the Register does it — this page is auth='user' too, so no token is
      // exposed and no new endpoint was added
      var media=p.hasImage
        ? '<img class="mz-tile__img" loading="lazy" decoding="async" alt="" src="/web/image/product.product/'+p.id+'/image_256">'
        : '<span class="mz-tile__ph">'+esc(initials(p.name))+'</span>';
      cell.innerHTML=
        '<button type="button" class="mz-tile'+(out?' mz-tile--out':'')+'"'+(out?' disabled':'')+
          ' data-product-id="'+p.id+'">'+
          '<span class="mz-tile__media" aria-hidden="true">'+media+'</span>'+
          '<span class="mz-tile__body"><span class="mz-tile-name">'+esc(p.name)+'</span>'+
          '<span class="mz-tile-price">'+MONEY(p.price)+'</span></span>'+
          (out?'<span class="mz-tile-badge">86</span>':'')+
        '</button>'+
        '<button type="button" class="mz-tile__quick-add"'+(out?' disabled':'')+
          ' data-quick-add-id="'+p.id+'" aria-label="'+esc(t('addtoorder')+' — '+p.name)+'">'+
          '<span class="mz-tile__plus" aria-hidden="true">+</span></button>';
      // both controls route through the SAME add path, so the quick-add can never
      // become a second way into the order
      Array.prototype.forEach.call(cell.querySelectorAll('button'), function(b){
        b.onclick=function(){ if(!out) addToCart(p); };
      });
      el.appendChild(cell);
    });
  }
  /* ---- product customization (DT-UX7A) --------------------------------------
     Speed is the whole point of a lane, so complexity decides the interaction: a
     product with no choices is one tap and nothing else happens. A product that HAS
     choices opens a configurator docked over the CATALOGUE only — the
     operator must not lose sight of the car, the lane or the timer to pick a sauce.

     Selection semantics are the Register's, deliberately identical: choices keyed by
     attribute line, single-select groups pre-select their first value and replace on
     tap, multi groups toggle. Money is never computed here — price_extra is shown as
     a preview and the SERVER re-prices from the values themselves. */
  var cfg=null;   // {p, sel:{groupKey:[optionId,…]}, editKey} — groupKey is the
                  // canonical PC key: an attribute line id, or 'c<combo_id>'.

  /* The RULES are canonical (design/product-config.js) — which groups a product
     has, what a group starts on, what a tap does, what has been chosen, what it
     adds, what is still missing, and which cart line this is. The board owns only
     the rendering. */
  var PC = window.MezzeProductConfig;
  function lineKey(id, avids, combo){ return PC.lineKey(id, avids, '', combo); }
  /* One product may carry attribute questions, combo questions, or both — PC.groups
     normalises them into one list so this board renders one loop and cannot grow a
     second combo algorithm beside the first. */
  function cfgGroups(p){ return PC.groups(p); }
  function cfgExtra(){ return cfg ? PC.extraPrice(cfg.groups, cfg.sel) : 0; }
  function cfgChosen(){ var c=PC.chosen(cfg.groups, cfg.sel);
                        return {avids:c.ids, names:c.names, combo:c.combo}; }
  function cfgMissing(){ return PC.missingRequired(cfg.groups, cfg.sel); }
  /* Odoo's cardinality, said in words. qty_max is how many the group allows and
     qty_free is how many the meal's price already covers; the operator is told
     "Choose up to 2 · 1 included" and never sees a field name. */
  function cfgTag(g){
    if(g.kind!=='combo') return g.required?t('choose1'):t('chooseany');
    if(g.qty_max>1) return t('chooseupto')+' '+g.qty_max
                           +(g.qty_free?(' · '+g.qty_free+' '+t('included')):'');
    return g.qty_free?t('choose1'):t('optional');
  }
  function renderCfg(){
    if(!cfg) return;
    var miss0=cfgMissing();
    var host=$('#cfgbody'); host.innerHTML='';
    $('#cfgname').textContent=cfg.p.name;
    cfg.groups.forEach(function(g){
      var sec=document.createElement('div'); sec.className='mz-cfg__group';
      var need=miss0.indexOf(g)>-1;
      sec.innerHTML='<div class="mz-cfg__gh'+(need?' mz-cfg__gh--need':'')+'"><span>'+esc(g.attribute)+'</span>'
        +'<span class="mz-cfg__tag">'+esc(cfgTag(g))+'</span></div>';
      var wrap=document.createElement('div'); wrap.className='mz-cfg__opts';
      g.values.forEach(function(v){
        var on=PC.isOn(cfg.sel, g, v.id);
        var n=PC.countOf(cfg.sel, g, v.id);
        var b=document.createElement('button');
        b.type='button'; b.className='mz-cfg-opt'+(on?' mz-cfg-opt--on':'');
        b.setAttribute('aria-pressed', on?'true':'false');
        b.setAttribute('data-qty', String(n));
        b.innerHTML='<span class="mz-cfg-opt__n"></span>'
          +(n>1?'<span class="mz-cfg-opt__q num">×'+n+'</span>':'')
          +(v.price_extra?'<span class="mz-cfg-opt__px num">+'+MONEY(v.price_extra)+'</span>':'');
        b.querySelector('.mz-cfg-opt__n').textContent=v.name;
        b.onclick=function(){ toggleCfg(g, v.id); };
        wrap.appendChild(b);
      });
      sec.appendChild(wrap); host.appendChild(sec);
    });
    var miss=miss0;
    // a combo group is already the question ("Choose your burger"); an attribute
    // group is a noun ("Size") and needs the verb in front of it. A group that
    // wants several says how many are still outstanding.
    $('#cfgwarn').textContent = miss.length
      ? (miss[0].kind==='combo'
          ? (miss[0].qty_free-(cfg.sel[miss[0].key]||[]).length>1
              ? miss[0].attribute+' — '+(miss[0].qty_free-(cfg.sel[miss[0].key]||[]).length)+' '+t('more')
              : miss[0].attribute)
          : (t('choosefirst')+' '+miss[0].attribute))
      : '';
    $('#cfgwarn').hidden = !miss.length;
    $('#cfgadd').disabled = !!miss.length;
    $('#cfgtot').textContent=MONEY(cfg.p.price+cfgExtra());
    $('#cfgadd').textContent = cfg.editKey ? t('savechanges') : t('addtoorder');
  }
  function toggleCfg(g, id){ cfg.sel=PC.toggle(g, id, cfg.sel); renderCfg(); }
  function openCfg(p, existing){
    var gs=cfgGroups(p);
    cfg={p:p, groups:gs, sel:{}, editKey:(existing&&existing.key)||null,
         opener:document.activeElement};
    // reopening a line restores exactly what it carries — attribute values AND combo
    // picks; a fresh one starts on the implied choice, and a combo group starts on
    // nothing because "which burger" is the question being asked.
    cfg.sel = existing
      ? Object.assign(PC.selectionFrom(gs, existing.avids),
                      PC.comboSelectionFrom(gs, existing.combo||[]))
      : PC.defaultSelection(gs);
    renderCfg();
    setCfgOpen(true);
    var first=$('#cfg').querySelector('.mz-cfg-opt'); if(first) first.focus();
  }
  function closeCfg(){
    var back=cfg&&cfg.opener; cfg=null; setCfgOpen(false);
    if(back&&back.focus) back.focus();
  }
  /* One state, two elements: the scrim carries the dimming and the panel carries the
     dialog. Both are told, so anything reading either one sees the same answer. */
  function setCfgOpen(open){
    $('#cfgscrim').hidden=!open;
    $('#cfg').hidden=!open;
  }
  function commitCfg(){
    if(!cfg || cfgMissing().length) return;
    var got=cfgChosen(), p=cfg.p, editKey=cfg.editKey;
    if(editKey){ cart=cart.filter(function(x){return x.key!==editKey;}); }
    addLine(p, got.avids, got.names, got.combo);
    closeCfg();
  }
  /* Lines are identified by product AND configuration. Merging on product id alone
     would quietly turn a plain burger and a no-onion burger into two of the same
     thing — the exact error this whole phase exists to prevent. */
  function addLine(p, avids, names, combo){
    var picks=combo||[];
    var key=lineKey(p.id, avids, picks);
    var f=cart.find(function(x){ return x.key===key; });
    if(f){ f.qty++; }
    else { cart.push({key:key, id:p.id, name:p.name, price:p.price, qty:1,
                      avids:avids||[], mods:names||[], combo:picks}); }
    renderCart(); ocbPublish();
  }
  function addToCart(p){
    if(PC.isConfigurable(p)){ openCfg(p); return; }   // configurable: choose first
    addLine(p, [], [], []);                           // simple: one tap, done
  }
  /* ---- customer confirmation board (DT-UX6) --------------------------------
     The cart lives in this browser and nowhere else, so the customer's display
     cannot read it — it has to be told. Every cart change publishes the WHOLE cart,
     so a dropped request can never leave a guest looking at half an order; the next
     keystroke repairs it. Money is deliberately NOT sent: the server prices the cart
     through the real tax path, so there is one calculation rather than two.
     Publishing never blocks order entry — a missing or broken board must not stop a
     lane. */
  var OCB={configured:false, online:false};
  function ocbPublish(action){
    call('/ocb/publish', {config_id:CONFIG, lane:DRAFT.lane, action:action||'update',
      lines:cart.map(function(it){ return {product_id:it.id, qty:it.qty,
        attribute_value_ids:it.avids||[], combo:it.combo||[]}; })})
      .then(function(d){ if(d&&d.ok){ OCB.configured=!!d.display; renderOcbDot(); } })
      .catch(function(){});
  }
  function ocbStatus(){
    call('/ocb/status', {config_id:CONFIG, lane:lane}).then(function(d){
      if(!d||!d.ok) return;
      OCB.configured=!!d.configured; OCB.online=!!d.online; renderOcbDot();
    }).catch(function(){});
  }
  /* A compact indicator, not a device dashboard. It matters because a confirmation
     nobody can see is worse than none: the operator stops double-checking. */
  function renderOcbDot(){
    var el=$('#ocb'); if(!el) return;
    if(!OCB.configured){ el.hidden=true; return; }
    el.hidden=false;
    el.className='ocb'+(OCB.online?' on':'');
    el.textContent='OCB · '+(OCB.online ? t('ocbon') : t('ocboff'));
  }

  // ---- the canonical order panel --------------------------------------------
  // Same markup and the same stylesheet as the Register's cart (design/order-panel.css):
  // qty badge, name, line total on one row; the chosen options beneath it; the
  // stepper, the unit price and the controls under that. What is NOT the Register's
  // is the line IDENTITY: lineKey keeps a no-onion burger distinct from a plain one,
  // and order_store.js cannot yet do that.
  function renderCart(){
    var el=$('#cart'); if(!el) return; el.innerHTML='';
    var count=cart.reduce(function(a,it){ return a+it.qty; },0);
    $('#otcount').textContent=String(count);
    if(!cart.length){
      var e=document.createElement('div');
      e.className='mz-cart-empty mz-empty';
      e.textContent=t('emptyorder');
      el.appendChild(e);
      $('#send').disabled=true;
      renderMoney(null);
      renderCtx();
      return;
    }
    cart.forEach(function(it,i){
      var prod=PRODUCTS.find(function(x){return x.id===it.id;});
      // Editable when the product asks ANY question — attributes or combo groups.
      // Gating on `mods` alone left a meal with no way back into its own choices.
      var canEdit=!!(prod && PC.isConfigurable(prod));
      var row=document.createElement('div'); row.className='mz-line';
      row.innerHTML=
        '<div class="mz-line-main">'
          +(it.qty>1?'<span class="mz-line-q" aria-hidden="true"></span>':'')
          +'<span class="mz-line-name"></span>'
          +'<span class="mz-line-total num" data-line-total="'+i+'">—</span>'
        +'</div>'
        +((it.mods&&it.mods.length)?'<p class="mz-line-note"></p>':'')
        +'<div class="mz-line-ctrls">'
          +'<span class="mz-stepper">'
            +'<button type="button" class="mz-stepper__btn"></button>'
            +'<span class="mz-stepper__value">'+it.qty+'</span>'
            +'<button type="button" class="mz-stepper__btn"></button>'
          +'</span>'
          +(it.qty>1?'<span class="mz-line-each num" data-line-each="'+i+'"></span>':'')
          +(canEdit?'<button type="button" class="mz-line-edit"></button>':'')
          +'<button type="button" class="mz-line-remove">✕</button>'
        +'</div>';
      if(it.qty>1) row.querySelector('.mz-line-q').textContent=it.qty+'×';
      row.querySelector('.mz-line-name').textContent=it.name;
      if(it.mods&&it.mods.length) row.querySelector('.mz-line-note').textContent=it.mods.join(' · ');
      var bs=row.querySelectorAll('.mz-stepper__btn');
      bs[0].textContent='−'; bs[0].setAttribute('aria-label', t('dec')+': '+it.name);
      bs[1].textContent='+'; bs[1].setAttribute('aria-label', t('inc')+': '+it.name);
      bs[0].onclick=function(){ it.qty--; if(it.qty<=0) cart=cart.filter(function(x){return x!==it;});
        renderCart(); ocbPublish(); };
      bs[1].onclick=function(){ it.qty++; renderCart(); ocbPublish(); };
      var ed=row.querySelector('.mz-line-edit');
      // Correcting a choice must not mean deleting the line and starting again.
      if(ed){ ed.textContent=t('edit'); ed.setAttribute('aria-label', t('edititem')+': '+it.name);
        ed.onclick=function(){ openCfg(prod, it); }; }
      var rm=row.querySelector('.mz-line-remove');
      rm.setAttribute('aria-label', t('remove')+': '+it.name);
      rm.setAttribute('title', t('remove'));
      rm.onclick=function(){ cart=cart.filter(function(x){return x!==it;}); renderCart(); ocbPublish(); };
      el.appendChild(row);
    });
    $('#send').disabled=false;
    renderCtx();
    quote();
  }

  // ---- money: the SERVER's answer, never this page's arithmetic --------------
  // The same pass that prices the customer's confirmation board (mezze.cart.pricing),
  // so the two screens cannot disagree. Debounced, because a stepper held down would
  // otherwise ask once per tap; and a row appears only if the branch actually has it.
  var QT=null, QSEQ=0;
  function money(n){ return MONEY(n); }
  function renderMoney(q){
    var sub=$('#otsub'), tax=$('#ottax');
    if(!q){ sub.hidden=true; tax.hidden=true; $('#ottotal').textContent='—';
      $('#otitems').textContent=''; return; }
    var m=q.money||{};
    var hasTax=(m.tax||0)>0;
    sub.hidden=!hasTax;                    // with no tax the subtotal IS the total
    if(!sub.hidden) $('#otsubv').textContent=money(m.subtotal);
    tax.hidden=!hasTax;
    if(!tax.hidden) $('#ottaxv').textContent=money(m.tax);
    $('#ottotal').textContent=money(m.total);
    var n=cart.reduce(function(a,it){ return a+it.qty; },0);
    $('#otitems').textContent = !n ? '' : (n===1 ? t('item') : (n+' '+t('items')));
    (q.lines||[]).forEach(function(row,i){
      var lt=$('[data-line-total="'+i+'"]'); if(lt) lt.textContent=money(row.line_total);
      var ea=$('[data-line-each="'+i+'"]');
      if(ea && row.qty) ea.textContent=money(row.line_total/row.qty)+' '+t('each');
    });
  }
  function quote(){
    if(QT) clearTimeout(QT);
    if(!cart.length){ renderMoney(null); return; }
    var seq=++QSEQ;
    QT=setTimeout(function(){
      call('/drivethru/quote',{config_id:CONFIG,lines:cart.map(function(it){
        return {product_id:it.id,qty:it.qty,attribute_value_ids:it.avids||[],
                combo:it.combo||[]};})})
      .then(function(d){
        if(seq!==QSEQ) return;              // a later edit already superseded this
        if(!d||!d.ok||(d.lines||[]).length!==cart.length){ renderMoney(null); return; }
        renderMoney(d);
      }).catch(function(){ renderMoney(null); });
    }, 180);
  }

  // ---- the car being served: never out of sight while ordering ---------------
  function renderCtx(){
    var host=$('#otctx'); if(!host) return;
    var veh=(DRAFT.veh||'').trim();
    host.innerHTML='<span class="otctx__veh"></span>'
      +'<span class="otctx__m"><span class="otctx__lane"></span><span>·</span><span class="otctx__st"></span></span>';
    host.querySelector('.otctx__veh').textContent=veh||t('nocar');
    host.querySelector('.otctx__lane').textContent='L'+DRAFT.lane;
    // truthful: there is no order and no reference until Send creates one
    host.querySelector('.otctx__st').textContent=t('neworder');
    var now=$('#otnow');
    if(now){
      now.innerHTML='<span class="otnow__veh"></span><span class="otnow__lane"></span>';
      now.querySelector('.otnow__veh').textContent=veh||t('nocar');
      now.querySelector('.otnow__lane').textContent='L'+DRAFT.lane+' · '+t('neworder');
    }
  }

  // ---- the compact queue: lane, vehicle, timer, state ------------------------
  // Fed by the SAME board payload the operations screen reads — one poll, no
  // per-car request, and no second source of truth about who is waiting.
  function renderQueueCompact(d){
    var host=$('#otqlist'); if(!host||!d) return;
    var cars=activeCars(d).slice().sort(function(a,b){ return elapsed(b)-elapsed(a); });
    $('#otqn').textContent=String(cars.length);
    host.innerHTML='';
    if(!cars.length){
      var e=document.createElement('div'); e.className='otq__empty';
      e.textContent=t('waitingnext'); host.appendChild(e); return;
    }
    cars.forEach(function(c,i){
      var sec=elapsed(c), b=band(sec);
      var row=document.createElement('button');
      row.type='button';
      row.className='otcar'+(i===0?' otcar--active':'');
      row.dataset.car=c.id;
      row.innerHTML='<span class="otcar__veh"></span>'
        +'<span class="otcar__t num '+b+'"></span>'
        +'<span class="otcar__m"><span class="otcar__lane"></span><span class="otcar__st"></span></span>';
      row.querySelector('.otcar__veh').textContent=c.vehicle||('#'+(c.order_ref||c.id));
      row.querySelector('.otcar__t').textContent=mmss(sec);
      row.querySelector('.otcar__lane').textContent='L'+c.lane;
      row.querySelector('.otcar__st').textContent=stageLabel(c);
      // The compact queue is CONTEXT. A row opens the full board rather than
      // offering a subset of operational actions it cannot complete here.
      row.onclick=function(){ goOps(); };
      host.appendChild(row);
    });
  }
  function goOps(){ goMode('ops'); }
  /* A station change is still a NAVIGATION — each station keeps its own URL, so a
     terminal can be pinned to one and a reload lands where the operator was — but it
     no longer costs a round trip. Every station is drawn from the SAME board payload
     this page already polls every two seconds, so fetching the document again meant
     re-downloading the page, its stylesheets and the whole catalogue to display data
     that was already in memory. The URL is updated with pushState and the panes are
     re-rendered in place; a cold load of any station URL still works exactly as it
     did, which is what keeps the crumbs real links rather than script handles. */
  function goMode(m){ switchMode(m, true); }
  function switchMode(m, push){
    if(MODES.indexOf(m)<0 || m===MODE) return;
    MODE=m;
    document.body.setAttribute('data-mode', MODE);
    if(push){ try{ history.pushState({mzMode:m}, '', modeHref(m)); }catch(e){} }
    // Transient per-station state does not travel: a car selected at the payment
    // window is not a selection at the pickup window, and a failed tender message
    // must not survive into a screen that is not about that tender.
    SELECTED=null; PAYSTATE='idle'; PAYERR='';
    renderCrumbs();
    renderCart();
    // paint from what is already known, then let the running poll refresh it
    if(LAST){ renderBoard(LAST); } else { poll(); }
  }
  // Back and forward are station changes too — without this the URL would move and
  // the screen would not, which is worse than no history at all.
  window.addEventListener('popstate', function(){
    var m=resolveMode();
    if(m!==MODE){ switchMode(m, false); }
  });

  /* The crumb trail. Every station is listed, so one can never exist without a way to
     reach it, and applyI18n re-renders it so it follows the language toggle.
     Real LINKS with real hrefs, not click handlers: a station is a URL, so it should
     be openable in another tab, reachable by keyboard, and announced as a link. The
     labels are literal t() calls — a dictionary key referenced only through a variable
     is invisible to the orphan-translation check, which is exactly the kind of string
     that later goes stale. */
  function stationLabel(mode){
    return mode==='order'   ? t('ordertaker')
         : mode==='ops'     ? t('opsboard')
         : mode==='payment' ? t('paywindow')
         :                    t('pickwindow');
  }
  function modeHref(m){
    var u=new URL(location.href); u.searchParams.set('mode',m);
    return u.pathname + u.search;
  }
  function renderCrumbs(){
    var host=$('#crumbs'); if(!host) return;
    host.textContent='';
    MODES.forEach(function(m,i){
      if(i){ var sep=document.createElement('span');
             sep.className='dtcrumbs__s'; sep.setAttribute('aria-hidden','true');
             sep.textContent='/'; host.appendChild(sep); }
      // the station you are AT is named, never offered as a link to where you already are
      var here=(m===MODE);
      var el=document.createElement(here?'span':'a');
      el.className='dtcrumb'; el.textContent=stationLabel(m);
      el.setAttribute('data-mode', m);
      if(here){ el.setAttribute('aria-current','page'); }
      else{
        el.href=modeHref(m);
        // A plain left-click switches in place; every other click — middle, ⌘/Ctrl,
        // Shift — is left to the browser, so "open this station in another tab"
        // keeps working. The href is the truth either way.
        el.onclick=function(ev){
          if(ev.button!==0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
          ev.preventDefault(); switchMode(m, true);
        };
      }
      host.appendChild(el);
    });
  }

  // ---- New Car: identify the vehicle, THEN order ----------------------------
  // Two sequential tasks. This step captures a lane and a vehicle and closes; the
  // catalogue is in the workspace behind it and was never part of this dialog.
  // It creates NOTHING on the server: the car, its order and its timer still begin
  // at Send, exactly as before, so nothing about lane sequence, queue membership or
  // speed-of-service measurement moves earlier.
  $('#new').onclick=function(){
    cart=[]; lane=1; DRAFT={lane:1, veh:''}; $('#veh').value='';
    renderLaneVar(); renderCart();
    // the previous guest's order leaves the customer's screen before the next starts
    ocbPublish('clear'); sheet(true);
    setTimeout(function(){ var v=$('#veh'); if(v) v.focus(); }, 60);
  };
  $('#start').onclick=function(){
    // the lane is already in DRAFT — the picker put it there, so backing out of
    // this dialog cannot leave the customer's board and the order on different lanes
    DRAFT.veh=$('#veh').value.trim();
    sheet(false); renderCtx();
    // straight into the work: the operator's next action is a product
    var pf=$('#psearch'); if(pf) pf.focus();
  };
  $('#veh').addEventListener('keydown', function(ev){
    if(ev.key==='Enter'){ ev.preventDefault(); $('#start').click(); }
  });
  $$('[data-x]').forEach(function(b){ b.onclick=function(){ sheet(false); }; });
  $('#ov').onclick=function(e){ if(e.target===$('#ov')){ sheet(false); } };
  $('#openops').onclick=function(){ goOps(); };
  var qbtn=$('#otqbtn');
  if(qbtn) qbtn.onclick=function(){
    var on=document.body.classList.toggle('otq-open');
    qbtn.setAttribute('aria-expanded', on?'true':'false');
    $('#otqscrim').hidden=!on;
  };
  $('#otqscrim').onclick=function(){
    document.body.classList.remove('otq-open'); this.hidden=true;
    if(qbtn) qbtn.setAttribute('aria-expanded','false');
  };
  $('#send').onclick=function(){ if(!cart.length)return; var btn=this; btn.disabled=true;
    call('/drivethru/create',{session_id:SID,lane:DRAFT.lane,vehicle:DRAFT.veh,
      lines:cart.map(function(it){return {product_id:it.id,qty:it.qty,
        attribute_value_ids:it.avids||[], combo:it.combo||[]};})}).then(function(d){
      btn.disabled=false; if(!d||!d.ok){ mzToast((d&&d.message)||t('nosend')); return; }
      call('/ocb/publish',{config_id:CONFIG,lane:DRAFT.lane,action:'confirm',
        order_id:(d.car&&d.car.order_id)||null}).catch(function(){});
      // the order is now the server's; this station is free for the next car
      cart=[]; DRAFT={lane:DRAFT.lane, veh:''};
      renderCart(); poll();
    }).catch(function(){ btn.disabled=false; mzToast(t('nosend')); }); };

  var ps=$('#psearch');
  if(ps){ ps.oninput=function(){ PQ=ps.value||''; $('#psearchx').hidden=!PQ; renderMenu(); }; }
  if($('#psearchx')) $('#psearchx').onclick=function(){ clearSearch(); ps.focus(); };

  $('#cfgx').onclick=closeCfg;
  // clicking the dimmed area backs out; clicking INSIDE the panel must not
  $('#cfgscrim').onclick=function(e){ if(e.target===this) closeCfg(); };
  $('#cfgcancel').onclick=closeCfg;
  $('#cfgadd').onclick=commitCfg;
  /* Keyboard, the Register's way. A cashier trained at the till reaches for "/" to
     search and Escape to abandon it; on this board those keys did nothing, so the same
     person had to reach for the mouse for the same job. Deliberately the SAME two keys
     and no more: this page has no highlight to steer and no charge screen to open, and
     inventing lane-only shortcuts would be the opposite of parity.
     Escape still backs out of the configurator first — the cart it came from stays. */
  function isTyping(el){
    if(!el) return false;
    var tag=el.tagName;
    return tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||el.isContentEditable;
  }
  function clearSearch(){
    var ps=$('#psearch'); if(!ps) return;
    PQ=''; ps.value=''; $('#psearchx').hidden=true; renderMenu();
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && cfg){ e.stopPropagation(); closeCfg(); return; }
    if(MODE!=='order' || cfg) return;      // only the ordering surface has a catalogue
    var ps=$('#psearch'); if(!ps) return;
    if(e.key==='/' && !isTyping(e.target)){
      e.preventDefault(); ps.focus(); ps.select(); return;
    }
    if(e.key==='Escape' && document.activeElement===ps && (ps.value||'')){
      e.preventDefault(); clearSearch(); ps.blur();
    }
  }, true);

  $('#lang').onclick=function(){ lang=(lang==='ar')?'en':'ar';
    try{ localStorage.setItem('mezze_shop_lang',lang); }catch(e){}
    applyI18n(); };

  // Debug/testability handle — ONLY under Odoo developer mode, mirroring the Register
  // and Kitchen apps. It exposes the elapsed-time arithmetic and the tick so the suite
  // can certify what the operator reads against a controlled clock; no secret and no
  // credential is reachable through it, and in normal mode it does not exist.
  if (new URLSearchParams(location.search).get('debug')) {
    window.__mezzeDriveThru = {
      parseTs: parseTs, elapsed: elapsed, mmss: mmss, band: band,
      tick: tickTimers,
      /** Open the product configurator directly, so the required-choice guard can be
       *  certified against a known shape instead of against whatever the demo
       *  catalogue happens to contain. */
      openConfigurator: function(product){ openCfg(product); },
      /** The live interval id, so the suite can prove the tick is SCHEDULED and not
       *  merely defined — the 2s poll re-renders with fresh times, so a board whose
       *  per-second tick was removed still appears to count from inside the page. */
      tickScheduled: function(){ return TICK_ID; },
      target: function(){ return TARGET; },
      /** Swap the clock. Date.now when called with nothing. */
      setClock: function(fn){ NOW = fn || Date.now; },
    };
  } else {
    delete window.__mezzeDriveThru;
  }

  applyI18n();
  boot();
})();
</script>
</body>
</html>
