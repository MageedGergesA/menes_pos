<!DOCTYPE html>
<!-- Part of the Mezze POS platform. Drive-thru lane board (operator screen). -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="design/foundation.css?v=f5">
<link rel="stylesheet" href="design/components.css?v=f5">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Drive-Thru · Mezze</title>
<style>
  /* This board used to carry its own 36-colour palette and its own dark-mode
     block, so it ignored the branch's chosen theme completely: pick Forest at the
     Register and the drive-thru stayed orange. Every local name below is now just
     an alias onto the shared --mz- token of the SAME role, which means the whole
     page follows the theme registry (all 11 themes, light and dark, high contrast
     and every accent) without another palette to keep in sync.
     The fallbacks are the ORIGINAL values, so the board still renders sensibly if
     it is ever opened without the design stylesheet. */
  :root{
    --bg:var(--mz-canvas,#fbf6ee);
    --card:var(--mz-surface,#ffffff);
    --card2:var(--mz-surface-2,#fff9f0);
    --ink:var(--mz-text,#20180f);
    --ink2:var(--mz-text-2,#6e6152);
    --ink3:var(--mz-text-mut,#a89a86);
    --line:var(--mz-border,#ece1d0);
    --accent:var(--mz-brand,#e8892b);
    --accent-d:var(--mz-brand-press,#cf6f16);
    --accent-ink:var(--mz-on-brand,#fff);
    --ok:var(--mz-ok,#2f9e6b);
    --warn:var(--mz-warn,#c4881f);
    --crit:var(--mz-danger,#c0453f);
    /* the header gradient reads as ONE brand ramp rather than three fixed oranges */
    --hero1:var(--mz-brand-hover,#f6a545);
    --hero2:var(--mz-brand,#e8722b);
    --hero3:var(--mz-brand-press,#c9541b);
    --sh:0 1px 2px rgba(32,24,15,.05),0 10px 26px rgba(32,24,15,.08);
  }
  /* Dark is the theme registry's job now (data-mz-mode="dark" swaps the tokens
     above), so a second, contradicting dark palette here would only fight it. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea,a{touch-action:manipulation}
  button:not(:disabled),[role=button],a[href]{cursor:pointer}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:var(--mz-font-text,'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
    -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  /* height, not min-height: with min-height the column grows to fit its content and
     the whole CANVAS scrolls, which scrolls the queue and the ops strip out of
     sight. Fixing the shell to the viewport makes the QUEUE the scroller, so the
     operator never loses the lane status while reading down the list. */
  .wrap{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
  /* Matches the Register's .mz-topbar: a flat surface with a hairline border, not
     a brand gradient. A lane board is watched for a whole shift, and a full-bleed
     gradient both tires the eye and refuses to follow the branch's theme. */
  header{position:relative;display:flex;align-items:center;gap:16px;padding:14px 24px;
    color:var(--ink);background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
  header>*{position:relative;z-index:1}
  .logo{width:46px;height:46px;border-radius:13px;background:var(--mz-brand-soft,var(--card2));border:1px solid var(--line);display:grid;place-items:center;font-size:24px}
  .hactions{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .brand{font-size:22px;font-weight:900;letter-spacing:-.01em}
  .brand small{display:block;font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
  .conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--ink2);padding:7px 12px;border-radius:20px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
  /* F6: operational control on a drive-thru tablet -> 44px minimum (measured 104x40). */
  .newbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-size:14.5px;font-weight:900;min-height:44px;box-sizing:border-box}
  /* the language toggle is a secondary control — the primary action on this screen
     is taking the next car, and two filled buttons side by side compete */
  /* min-width matters as much as min-height: a one-glyph label ("ع") shrank the
     button to 40px wide, under the 44px touch minimum, even though it was tall
     enough. Both dimensions are part of the target. */
  #lang{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:800;
    padding:12px 14px;min-width:44px;min-height:44px}
  #lang:hover{background:var(--card2);color:var(--ink)}
  main{flex:1;padding:22px 30px 40px;display:flex;gap:22px;align-items:flex-start;overflow-x:auto}
  .lane{flex:1;min-width:320px;max-width:520px}
  .lanehd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .lanehd h2{font-size:18px;font-weight:900;letter-spacing:-.01em}
  .lanehd .cnt{font-size:12.5px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
  .empty{color:var(--ink3);font-size:14px;font-weight:600;padding:26px 0;text-align:center}
  .car{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;position:relative}
  .car.ready{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
  .car .top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .car .pos{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:17px;font-weight:900;
    background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-d)}
  .car .veh{flex:1;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .car .veh small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:1px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .b{font-size:10.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;padding:4px 8px;border-radius:20px}
  .b.prep{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .b.rdy{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .b.win{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-d)}
  .b.paid{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .b.due{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
  .items{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-bottom:11px}
  .items b{color:var(--ink);font-weight:700}
  .foot{display:flex;align-items:center;gap:9px}
  .tot{font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-inline-end:auto}
  /* FINAL-C4 — lane-card actions are the operator's primary touch targets: >=44px both
     axes (the dismiss "x" was 27x40 and is the easiest one to miss under pressure). */
  .act{border:0;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:800;cursor:pointer;
       min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .act.p{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink)}
  .act.g{background:var(--ok);color:#fff}
  .act.o{background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
  .act.x{background:none;color:var(--ink3);padding:11px 8px}
  .mins{position:absolute;top:14px;inset-inline-end:16px;font-size:11.5px;font-weight:700;color:var(--ink3)}
  /* new-car sheet */
  /* a neutral scrim: the old rgba(16,10,4,.55) was a brown wash that tinted every
     theme's surfaces the same muddy colour underneath the sheet */
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  /* Bottom-anchored, the footer action fell below the fold on a short screen.
     Centred with a bounded height keeps "Send to kitchen" reachable at any size. */
  .sheet{align-items:center}

  /* ---- DT-UX2: taking an order must not blind the operator ----
     As a centred modal, starting an order covered the whole lane: the moment the
     operator was busiest, they could no longer see who was waiting or who was
     going late. At cockpit widths the same panel docks to the side instead, so
     the queue keeps running alongside it. Below 1100px it stays a modal, because
     a docked panel there would leave neither pane usable. */
  @media (min-width:1100px){
    /* LOGICAL on both sides. `inset:0 0 0 auto` is physical (always the right edge)
       while `padding-inline-end` is logical (the LEFT edge in Arabic) — the pair
       disagreed under RTL and the panel sat on top of all seven queue rows. */
    .sheet{align-items:stretch;justify-content:flex-end;background:transparent;
      pointer-events:none;inset-block:0;inset-inline-end:0;inset-inline-start:auto;
      width:min(440px,42vw)}
    .sheet.on{display:flex}
    .sheet .inner{pointer-events:auto;width:100%;max-width:none;max-height:none;height:100%;
      border-radius:0;border-inline-start:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.06);
      animation:none}
    /* make room so the docked panel never covers the queue */
    body.docked .wrap{padding-inline-end:min(440px,42vw)}
  }
  .inner{background:var(--card);width:100%;max-width:680px;max-height:min(88vh,760px);
    border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--sh);animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .shead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .shead h2{font-size:18px;font-weight:900;flex:1}
  .sx{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);font-size:16px}
  .sbody{overflow:auto;padding:16px 20px}
  /* ---- DT-UX1: operations strip ---- */
  .ops{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
  .ops .m{display:flex;flex-direction:column;gap:1px;min-width:64px}
  .ops .mk{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
  .ops .mv{font-size:19px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .ops .mv.warn{color:var(--warn)} .ops .mv.late{color:var(--crit)}
  .ops .sep{width:1px;align-self:stretch;background:var(--line)}
  .lanefilter{display:flex;gap:6px;margin-inline-start:auto}
  /* 44px on BOTH axes — a filter is tapped mid-rush on a touch till like any
     other control, and 36px tall was my own regression against the floor. */
  .lanefilter button{min-height:44px;min-width:44px;padding:0 12px;border-radius:9px;
    border:1px solid var(--line);background:transparent;color:var(--ink2);font-weight:800;font-size:13px}
  .lanefilter button[aria-pressed=true]{background:var(--mz-brand-soft,var(--card2));
    border-color:var(--accent);color:var(--accent-d)}

  /* ---- DT-UX1: one vertical queue, ordered by urgency ----
     Lane columns hid WHO IS WORST: the longest-waiting car could be second in a
     column while a fresh car sat at the top of the other. One queue sorted by
     elapsed answers "who do I deal with now" without the operator comparing
     columns. Lane stays visible as a marker on every row. */
  .queue{display:block;padding:12px 24px 24px;overflow-y:auto;flex:1 1 auto;min-height:0}
  /* Density: the items line shares the row rather than adding a third band, so more
     cars fit a screen without shrinking the timer — which stays the largest value. */
  .qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;
    padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    margin-bottom:8px}
  .qrow .qitems{grid-column:2;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow.late{border-color:var(--crit)}
  .qrow.warnrow{border-color:var(--warn)}
  .qtime{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
    min-width:88px;text-align:start}
  .qtime.warn{color:var(--warn)} .qtime.late{color:var(--crit)}
  .qsub{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink3);margin-top:3px}
  .qveh{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;
    font-size:12.5px;color:var(--ink2)}
  .qlane{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 7px;
    border-radius:7px;background:var(--card2);border:1px solid var(--line);
    font-size:12px;font-weight:800;color:var(--ink2)}
  .qacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .qitems{font-size:12.5px;color:var(--ink2)}
  .lanevar{display:flex;gap:10px;margin-bottom:12px}
  .lanevar button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:14px;font-weight:800}
  .lanevar button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
  .menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .mi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:start;cursor:pointer}
  .mi:hover{border-color:var(--accent)}
  .mi .mn{font-size:13.5px;font-weight:800;line-height:1.2}
  .mi .mp{font-size:12.5px;font-weight:800;color:var(--accent-d);margin-top:4px}
  .cartline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .cartline .cn{flex:1;font-weight:700}
  /* P3E — quantity is the canonical .mz-stepper (components.css). */
  .sfoot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink);border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:900}
  .btn:disabled{opacity:.5}
</style>
<!-- D1.1 shared Mezze design system (customer-facing adoption) -->

<script>/* FOUC guard: apply approved appearance before first paint */
(function(){try{var p=new URLSearchParams(location.search),o={};try{o=JSON.parse(localStorage.getItem('mzSettings.v1')||'{}')||{}}catch(e){}
var h=document.documentElement,L=['classic','corporate','coastal','forest','coffeehouse','highcontrast'],D=['midnight','lounge','graphite','forestnight','slate','highcontrast'];
var mp=p.get('mzmode')||o.app_mode||o.mode||'system',mode=(mp==='system')?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'):(mp==='dark'?'dark':'light');
var hc=(p.get('mztheme')==='highcontrast')||(o.ac_contrast||o.highContrast);
var th=hc?'highcontrast':(mode==='dark'?(D.indexOf(p.get('mztheme')||(o.app_dark_theme||o.darkTheme))>=0?(p.get('mztheme')||(o.app_dark_theme||o.darkTheme)):'lounge'):(L.indexOf(p.get('mztheme')||(o.app_theme||o.lightTheme))>=0?(p.get('mztheme')||(o.app_theme||o.lightTheme)):'classic'));
/* The SERVER already stamped the branch's appearance on <html>; it knows the
   branch, this script only knows this browser. So never overwrite what is there —
   fill in only what is missing, and still honour an explicit ?mzmode=/?mztheme=
   override for support. */
var srv=h.getAttribute('data-mz-theme'), forced=p.get('mztheme')||p.get('mzmode');
if(!srv||forced){h.setAttribute('data-appearance','mezze');h.setAttribute('data-theme',mode);h.setAttribute('data-mz-mode',mode);h.setAttribute('data-mz-theme',th);}
if(!h.getAttribute('data-mz-accent')||p.get('mzaccent')){h.setAttribute('data-mz-accent',p.get('mzaccent')||(o.app_accent||o.accent)||'terracotta');}
var dp=p.get('dir')||(o.ac_dir||o.direction);if(!h.getAttribute('dir')||p.get('dir'))h.setAttribute('dir',(dp==='rtl'||dp==='ltr')?dp:((h.getAttribute('lang')||'').toLowerCase().indexOf('ar')===0?'rtl':'ltr'));}catch(e){}})();</script>
<script src="mezze-customer.js?v=d3" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚗</div>
    <div class="brand" id="brand">Mezze<small id="branch" data-t="board">Drive-thru</small></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connlbl">…</span></div>
    <div class="hactions">
      <button class="newbtn" id="lang" lang="ar">ع</button>
      <button class="newbtn" id="new" data-t="newcar">+ New car</button>
    </div>
  </header>
  <!-- DT-UX1 operations strip: how is the lane doing, in one line. Operating
       metrics only — no charts, no cards. -->
  <section class="ops" id="ops" aria-label="Drive-thru status"></section>
  <main id="lanes" class="queue" aria-label="Vehicle queue"></main>
</div>

<!-- new car -->
<div class="sheet" id="ov"><div class="inner">
  <div class="shead"><h2 data-t="newcartitle">New car</h2>
    <button class="sx" data-x data-tal="close" aria-label="Close">✕</button></div>
  <div class="sbody">
    <div class="lanevar" id="lanevar"></div>
    <label class="mz-field"><span class="mz-label" data-t="vehicle">Vehicle</span>
      <input id="veh" class="mz-input" data-tph="vehph" placeholder="e.g. Red Corolla / plate"></label>
    <div id="cart"></div>
    <div class="menu" id="menu"></div>
  </div>
  <div class="sfoot"><button class="btn" id="send" data-t="sendkitchen" disabled>Send to kitchen</button></div>
</div></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s);}, $$=function(s){return [...document.querySelectorAll(s)];};
  // P3F — canonical non-blocking toast replaces browser alert().
  function mzToast(msg){ var el=document.createElement('div');
    el.className='mz-alert mz-alert--danger mz-alert--toast'; el.setAttribute('role','alert');
    el.innerHTML='<div class="mz-alert__content"></div>';
    el.querySelector('.mz-alert__content').textContent=msg||''; document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('mz-show'); });
    setTimeout(function(){ el.classList.remove('mz-show'); setTimeout(function(){ el.remove(); },250); },4000); }
  var Q=new URLSearchParams(location.search);
  /* ---- i18n — the SAME contract as the other customer/operator surfaces (inline
     T={en,ar}, data-t / data-tph / data-tal hooks, #lang toggle persisted in
     localStorage), with applyI18n() setting BOTH documentElement.lang and
     documentElement.dir. Terminology from ARABIC-TERMINOLOGY-GLOSSARY.md: this is
     the OPERATOR lane board, so Drive-thru = خدمة السيارات. ---- */
  var T={
    en:{board:'Drive-thru',newcar:'+ New car',newcartitle:'New car',vehicle:'Vehicle',
        vehph:'e.g. Red Corolla / plate',sendkitchen:'Send to kitchen',close:'Close',
        lane:'Lane',cars:'cars',
        atwindow:'At window',ready:'Ready',preparing:'Preparing',
        paid:'Paid',due:'Payment due',callfwd:'Call forward',takepay:'Take payment',
        collected:'Collected ✓',cancel:'Cancel',live:'live',offline:'offline',
        nosend:'Could not send',dec:'Decrease quantity',inc:'Increase quantity',
        avg:'Avg',longest:'Longest',target:'Target',all:'All',late:'Late',
        attention:'Attention',dtready:'Drive-thru ready',waitingnext:'Waiting for the next vehicle'},
    ar:{board:'خدمة السيارات',newcar:'+ سيارة جديدة',newcartitle:'سيارة جديدة',vehicle:'المركبة',
        vehph:'مثال: كورولا حمراء / رقم اللوحة',sendkitchen:'إرسال للمطبخ',close:'إغلاق',
        lane:'مسار',cars:'سيارات',
        atwindow:'عند النافذة',ready:'جاهز',preparing:'قيد التحضير',
        paid:'مدفوع',due:'مستحق الدفع',callfwd:'استدعاء',takepay:'تحصيل',
        collected:'تم التسليم ✓',cancel:'إلغاء',live:'مباشر',offline:'غير متصل',
        nosend:'تعذّر الإرسال',dec:'تقليل الكمية',inc:'زيادة الكمية',
        avg:'المتوسط',longest:'الأطول',target:'المستهدف',all:'الكل',late:'متأخر',
        attention:'انتباه',dtready:'خدمة السيارات جاهزة',waitingnext:'في انتظار السيارة التالية'}};
  /* Same preference key as the other customer/operator pages, so a device stays in the
     language the crew chose. An EXPLICIT ?lang= wins over the stored value: a board is
     opened from a pinned link or handed over mid-shift, and that link must be
     deterministic. (shop/qr honour only ?lang=ar; here both values are authoritative.) */
  var lang=(function(){
    var q=Q.get('lang'); if(q==='ar'||q==='en'){ return q; }
    try{ return localStorage.getItem('mezze_shop_lang')==='ar'?'ar':'en'; }catch(e){ return 'en'; }
  })();
  function t(k){ return (T[lang]&&T[lang][k])||T.en[k]||k; }
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function applyI18n(){
    var h=document.documentElement;
    h.lang=lang; h.setAttribute('dir',lang==='ar'?'rtl':'ltr');
    document.body.classList.toggle('rtl',lang==='ar');
    [].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=t(e.getAttribute('data-t'));});
    [].forEach.call(document.querySelectorAll('[data-tph]'),function(e){var v=t(e.getAttribute('data-tph'));e.placeholder=v;e.setAttribute('aria-label',v);});
    [].forEach.call(document.querySelectorAll('[data-tal]'),function(e){e.setAttribute('aria-label',t(e.getAttribute('data-tal')));});
    var lb=document.getElementById('lang'); if(lb) lb.textContent = lang==='ar'?'EN':'ع';
    if(BRANCH) $('#branch').textContent=BRANCH+' · '+t('board');
    setConn(CONN);
    try{ renderLaneVar(); renderMenu(); renderCart(); if(LAST) renderBoard(LAST); }catch(e){}
  }
  var BASE=location.origin, API='/mezze/api/v1';
  // Credentials come from the SERVER-injected boot payload, never from the URL.
  // This page used to read ?token= — which puts a bearer token in access logs,
  // browser history and any shared link. /mezze/drivethru authenticates the Odoo
  // user, mints a per-terminal token and injects it here instead.
  var BOOT=(function(){ try{ return JSON.parse(document.getElementById('mezze-boot').textContent||'{}'); }
                        catch(e){ return {}; } })();
  var TOKEN=BOOT.token||'', CONFIG=BOOT.config_id||parseInt(Q.get('config')||'0',10)||null;
  var CUR='EGP', SID=null, PM=null, PRODUCTS=[], cart=[], lane=1, BRANCH='', LAST=null, CONN=false;
  var MONEY=function(n){return CUR+' '+(Math.round((n||0)*100)/100).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2});};

  function call(path,body){ return fetch(BASE+API+path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({token:TOKEN},body||{}))}).then(function(r){return r.json();}); }
  function setConn(on){ CONN=on; $('#dot').classList.toggle('on',on); $('#connlbl').textContent=on?t('live'):t('offline'); }

  // ---- boot: catalog + session (staff bootstrap) ----
  function boot(){
    call('/bootstrap',{}).then(function(d){
      if(!d||!d.ok){ setConn(false); setTimeout(boot,3000); return; }
      setConn(true);
      SID=d.session_id; CUR=(d.config&&d.config.currency)||d.currency||'EGP';
      BRANCH=(d.config&&d.config.name)||''; if(BRANCH)$('#branch').textContent=BRANCH+' · '+t('board');
      PM=(d.payment_methods&&d.payment_methods[0]&&d.payment_methods[0].id)||null;
      PRODUCTS=(d.products||[]).filter(function(p){return (p.list_price||0)>0;})
        .map(function(p){return {id:p.id,name:String(p.name||'').replace(/^\[[^\]]*\]\s*/,''),price:p.list_price};});
      renderMenu();
      poll(); setInterval(poll,2000);
    }).catch(function(){ setConn(false); setTimeout(boot,3000); });
  }

  // ---- lane board ----
  function poll(){
    call('/drivethru/board',{config_id:CONFIG}).then(function(d){
      if(!d||!d.ok){ setConn(false); return; } setConn(true); LAST=d; renderBoard(d);
    }).catch(function(){ setConn(false); });
  }
  // ---- DT-UX1 speed of service ------------------------------------------------
  // The SERVER owns the clock. Each poll carries `now`; we keep the offset between
  // it and this browser so the seconds can tick smoothly between polls without the
  // display ever drifting to the till's own (possibly wrong) clock.
  var SKEW=0, TARGET=180, LANEFILTER='all';
  function parseTs(s){ return s ? Date.parse(s.replace(' ','T')+'Z') : 0; }
  function serverNow(){ return Date.now() + SKEW; }
  function elapsed(c){ var p=parseTs(c.placed_at); return p ? Math.max(0,(serverNow()-p)/1000) : 0; }
  function mmss(sec){ sec=Math.floor(sec); var m=Math.floor(sec/60), s=sec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  /** normal | attention | late — never colour alone; the row also carries a word. */
  function band(sec){ if(sec>=TARGET) return 'late'; if(sec>=TARGET*0.75) return 'warn'; return ''; }

  function activeCars(d){
    return (d.cars||[]).filter(function(c){
      return c.state!=='collected' && c.state!=='cancelled';
    });
  }

  function renderOps(d){
    var host=$('#ops'); if(!host) return;
    var cars=activeCars(d);
    var secs=cars.map(elapsed);
    var avg=secs.length?secs.reduce(function(a,b){return a+b;},0)/secs.length:0;
    var longest=secs.length?Math.max.apply(null,secs):0;
    var lanes=(d.lanes||[1]);
    function metric(k,v,cls){ return '<div class="m"><span class="mk">'+esc(k)+'</span>'+
      '<span class="mv '+(cls||'')+'">'+esc(v)+'</span></div>'; }
    var html=metric(t('cars'), String(cars.length))
      + '<div class="sep"></div>'
      + metric(t('avg'), mmss(avg), band(avg))
      + metric(t('longest'), mmss(longest), band(longest))
      + metric(t('target'), mmss(TARGET));
    if(lanes.length>1){
      html+='<div class="lanefilter" role="group" aria-label="'+esc(t('lane'))+'">'
        +'<button type="button" data-lane="all" aria-pressed="'+(LANEFILTER==='all')+'">'+esc(t('all'))+'</button>'
        +lanes.map(function(ln){ return '<button type="button" data-lane="'+ln+'" aria-pressed="'
          +(String(LANEFILTER)===String(ln))+'">L'+ln+'</button>'; }).join('')
        +'</div>';
    }
    host.innerHTML=html;
    host.querySelectorAll('[data-lane]').forEach(function(b){
      b.onclick=function(){ LANEFILTER=b.dataset.lane; renderBoard(LAST); };
    });
  }

  function renderBoard(d){
    if(!d) return;
    if(d.now){ SKEW = parseTs(d.now) - Date.now(); }
    if(d.target_seconds){ TARGET = d.target_seconds; }
    renderOps(d);
    var host=$('#lanes'); host.innerHTML='';
    var cars=activeCars(d).filter(function(c){
      return LANEFILTER==='all' || String(c.lane)===String(LANEFILTER);
    });
    // Longest wait first: the queue answers "who now?", not "what order did they
    // arrive in per lane" — arrival order is still visible as the position number.
    cars.sort(function(a,b){ return elapsed(b)-elapsed(a); });
    if(!cars.length){
      host.innerHTML='<div class="empty"><b>'+esc(t('dtready'))+'</b><br>'+esc(t('waitingnext'))+'</div>';
      return;
    }
    cars.forEach(function(c){ host.appendChild(queueRow(c)); });
  }

  function queueRow(c){
    var sec=elapsed(c), b=band(sec);
    var el=document.createElement('div');
    el.className='qrow'+(b==='late'?' late':(b==='warn'?' warnrow':''));
    var stage = c.state==='at_window' ? t('atwindow')
              : (c.kitchen_ready||c.state==='ready') ? t('ready') : t('preparing');
    var stbadge = c.state==='at_window' ? '<span class="b win">'+esc(t('atwindow'))+'</span>'
                : (c.kitchen_ready||c.state==='ready') ? '<span class="b rdy">'+esc(t('ready'))+'</span>'
                : '<span class="b prep">'+esc(t('preparing'))+'</span>';
    var paybadge = c.paid ? '<span class="b paid">'+esc(t('paid'))+'</span>'
                          : '<span class="b due">'+esc(t('due'))+'</span>';
    var acts='';
    if(c.state!=='at_window') acts+='<button class="act o" data-a="window" data-id="'+c.id+'">'+esc(t('callfwd'))+'</button>';
    if(!c.paid) acts+='<button class="act p" data-a="pay" data-id="'+c.id+'">'+esc(t('takepay'))+' · '+MONEY(c.total)+'</button>';
    else acts+='<button class="act g" data-a="collected" data-id="'+c.id+'">'+esc(t('collected'))+'</button>';
    acts+='<button class="act x" data-a="cancel" data-id="'+c.id+'" title="'+esc(t('cancel'))+'" aria-label="'+esc(t('cancel'))+'">✕</button>';
    var items=(c.items||[]).map(function(i){return '<b>'+i.qty+'×</b> '+esc(i.name);}).join(' · ');
    el.innerHTML=
      '<div><div class="qtime num '+b+'" data-elapsed="'+c.id+'">'+mmss(sec)+'</div>'+
        '<div class="qsub">'+esc(b==='late'?t('late'):(b==='warn'?t('attention'):stage))+'</div></div>'+
      '<div><div class="qveh">'+esc(c.vehicle||('#'+c.tracking))+'</div>'+
        '<div class="qmeta"><span class="qlane">L'+(c.lane||1)+'</span>'+
          '<span class="num">#'+esc(c.tracking)+'</span>'+stbadge+paybadge+
          '<span class="tot num">'+MONEY(c.total)+'</span></div></div>'+
      '<div class="qacts">'+acts+'</div>'+
      (items?'<div class="qitems">'+items+'</div>':'');
    el.querySelectorAll('[data-a]').forEach(function(b2){ b2.onclick=function(){ stage(b2.dataset.id,b2.dataset.a); }; });
    return el;
  }

  // Tick the visible timers once a second WITHOUT re-rendering the queue (a full
  // re-render every second would fight the operator's pointer and spam a screen
  // reader). Only the digits change; order is re-evaluated on the next poll.
  setInterval(function(){
    if(!LAST) return;
    var byId={}; activeCars(LAST).forEach(function(c){ byId[c.id]=c; });
    document.querySelectorAll('[data-elapsed]').forEach(function(node){
      var c=byId[node.getAttribute('data-elapsed')]; if(!c) return;
      var sec=elapsed(c), b=band(sec);
      node.textContent=mmss(sec);
      node.className='qtime num '+b;
    });
  }, 1000);
  function stage(id,action){
    var body={drivethru_id:parseInt(id,10),action:action};
    if(action==='pay')body.payment_method_id=PM;
    call('/drivethru/stage',body).then(function(d){ if(d&&d.ok)poll(); else if(d&&d.message)mzToast(d.message); });
  }

  // ---- new-car order form ----
  function sheet(on){
    $('#ov').classList.toggle('on',on);
    // reserve the docked width so the queue reflows instead of being covered
    document.body.classList.toggle('docked', !!on);
  }
  function renderLaneVar(){ var el=$('#lanevar'); el.innerHTML='';
    [1,2].forEach(function(n){ var b=document.createElement('button'); b.textContent=t('lane')+' '+n; b.className=(n===lane?'on':'');
      b.onclick=function(){ lane=n; renderLaneVar(); }; el.appendChild(b); }); }
  function renderMenu(){ var el=$('#menu'); el.innerHTML='';
    PRODUCTS.forEach(function(p){ var b=document.createElement('button'); b.className='mi';
      b.innerHTML='<div class="mn">'+p.name+'</div><div class="mp num">'+MONEY(p.price)+'</div>';
      b.onclick=function(){ addToCart(p); }; el.appendChild(b); }); }
  function addToCart(p){ var f=cart.find(function(x){return x.id===p.id;}); if(f)f.qty++; else cart.push({id:p.id,name:p.name,price:p.price,qty:1}); renderCart(); }
  function renderCart(){ var el=$('#cart'); el.innerHTML='';
    cart.forEach(function(it){ var r=document.createElement('div'); r.className='cartline';
      r.innerHTML='<span class="cn">'+it.name+'</span><div class="mz-stepper"><button type="button" class="mz-stepper__btn" aria-label="'+esc(t('dec'))+'">−</button><span class="mz-stepper__value">'+it.qty+'</span><button type="button" class="mz-stepper__btn" aria-label="'+esc(t('inc'))+'">+</button></div>';
      var bs=r.querySelectorAll('.mz-stepper__btn'); bs[0].onclick=function(){it.qty--;if(it.qty<=0)cart=cart.filter(function(x){return x!==it;});renderCart();};
      bs[1].onclick=function(){it.qty++;renderCart();}; el.appendChild(r); });
    $('#send').disabled=!cart.length; }
  $('#new').onclick=function(){ cart=[]; lane=1; $('#veh').value=''; renderLaneVar(); renderCart(); sheet(true); };
  $$('[data-x]').forEach(function(b){ b.onclick=function(){ sheet(false); }; });
  $('#ov').onclick=function(e){ if(e.target===$('#ov'))sheet(false); };
  $('#send').onclick=function(){ if(!cart.length)return; var btn=this; btn.disabled=true;
    call('/drivethru/create',{session_id:SID,lane:lane,vehicle:$('#veh').value.trim(),
      lines:cart.map(function(it){return {product_id:it.id,qty:it.qty};})}).then(function(d){
      btn.disabled=false; if(!d||!d.ok){ mzToast((d&&d.message)||t('nosend')); return; } sheet(false); poll();
    }).catch(function(){ btn.disabled=false; mzToast(t('nosend')); }); };

  $('#lang').onclick=function(){ lang=(lang==='ar')?'en':'ar';
    try{ localStorage.setItem('mezze_shop_lang',lang); }catch(e){}
    applyI18n(); };

  applyI18n();
  boot();
})();
</script>
</body>
</html>
