<!--
  KIOSK V3 — the Crispy Chicken handoff, phase 3. Built ALONGSIDE the live kiosk
  (static/kiosk.html), which is untouched and stays the production surface until
  this passes review and phase 5 cuts over. Reach it explicitly at
  /mezze_bridge/static/kiosk-v3.html?store=<token>.

  The plumbing is deliberately unchanged. Mezze's kiosk is server-authoritative:
  the branch's configuration, the menu, the pricing and the order all come from the
  same four endpoints the live kiosk uses, in the same wire shapes —

      POST /mezze/api/v1/kiosk/config     branch, currency, service + payment options
      POST /mezze/api/v1/shop/menu        {channel:'kiosk'} -> categories + products
      POST /mezze/api/v1/shop/quote       {lines} -> server-owned subtotal/tax/total
      POST /mezze/api/v1/shop/order       {fulfillment, service_mode, lines, ...}
      GET  /mezze/api/v1/shop/image/<store>/<product_id>

  — so pricelists, taxes, fiscal positions, 86'd items and currency continue to be
  decided by Odoo. This file replaces the presentation layer and the navigation
  flow, nothing else.

  Screens land one per commit, in the handoff's order. Implemented so far: MENU.
-->

<script>/* canonical appearance bootstrap, identical to every other Mezze surface —
   stamps the theme attributes before first paint so High Contrast is never a flash. */
(function(){try{var p=new URLSearchParams(location.search),o={};
try{o=JSON.parse(localStorage.getItem('mzSettings.v1')||'{}')||{}}catch(e){}
var h=document.documentElement,
    L=['classic','corporate','coastal','forest','coffeehouse','highcontrast'],
    D=['midnight','lounge','graphite','forestnight','slate','highcontrast'];
var mp=p.get('mzmode')||o.app_mode||'light',
    mode=(mp==='system')?((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')
                        :(mp==='dark'?'dark':'light');
var req=p.get('mztheme'),hc=(req==='highcontrast')||o.ac_contrast;
var th=hc?'highcontrast':(mode==='dark'
      ?(D.indexOf(req||o.app_dark_theme)>=0?(req||o.app_dark_theme):'lounge')
      :(L.indexOf(req||o.app_theme)>=0?(req||o.app_theme):'classic'));
h.setAttribute('data-appearance','mezze');h.setAttribute('data-theme',mode);
h.setAttribute('data-mz-mode',mode);h.setAttribute('data-mz-theme',th);
h.setAttribute('data-mz-accent',p.get('mzaccent')||o.app_accent||'terracotta');
}catch(e){}})();</script>

        orderNumber:'رقم طلبك',prepare:'سنجهّز طلبك قريبًا!',
        howReceipt:'كيف تريد إيصالك؟',
        printed:'مطبوع',printedS:'عند الكاشير',noReceipt:'بدون إيصال',noReceiptS:'تخطَّ',
        receiptChosen:'تم \u2014 %s',trackOrder:'تتبع طلبي',backHome:'العودة للرئيسية',
        orderStatus:'حالة الطلب',received:'تم الاستلام',preparing:'قيد التحضير',
        ready:'جاهز للاستلام',stepDone:'تم',stepNow:'الآن',stepNext:'التالي',
        receivedS:'استلمنا طلبك',preparingS:'المطبخ يجهّزه الآن',
        readyS:'سننادي رقمك',
        collectAt:'الاستلام من',counter:'كاشير',itemsLabel:'الأصناف',
        estWait:'الوقت المتوقع',min:'دقيقة',
        howEat:'كيف ستتناول طلبك؟',eatIn:'تناول هنا',takeaway:'طلب خارجي',
        edit:'تعديل',collect:'يرجى استلام طلبك من الكاشير عند مناداة رقمك.',
        payCounter:'ادفع عند الكاشير',payTable:'ادفع على طاولتك',
        payCounterHint:'نطبع رقمك الآن — ادفع عند الاستلام',
        payTableHint:'نطبع رقمك الآن — ادفع على طاولتك'}
  };
  function t(k){return (T[lang]||T.en)[k]||T.en[k]||k;}

  function setLang(l){
    lang=(l==='ar')?'ar':'en';
    var country=(CFG&&CFG.country)||'';
    locale=country?(lang+'-'+country):(lang==='ar'?'ar':'en-US');
    var h=document.documentElement;
    h.lang=lang; h.dir=(lang==='ar')?'rtl':'ltr';
  }

  /* money: the branch's currency and the market's digits. The FIGURES are the
     server's — this only formats them. */
  function fmt(n){
    var c=(CFG&&CFG.currency)||{},dp=(typeof c.decimals==='number')?c.decimals:2;
    var sym=c.symbol||c.name||'';
    var s=Number(n||0).toLocaleString(locale,{minimumFractionDigits:dp,maximumFractionDigits:dp});
    if(!sym)return s;
    return (c.position==='before')?(sym+' '+s):(s+' '+sym);
  }

  /* ---------------------------------------------------------------- network */
  function call(path,body){
    return fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({store:STORE},body||{}))})
      .then(function(r){return r.json();});
  }

  /* ------------------------------------------------------------------- cart */
  function keyFor(p){ return String(p.id); }   /* phase 3: unconfigured lines only */
  function addToCart(p){
    var key=keyFor(p), e=cart.find(function(x){return x.key===key;});
    if(e){ e.qty+=1; }
    else{ cart.push({key:key,id:p.id,name:p.name,price:p.list_price||0,qty:1,
                     avids:[],combo:[],names:[],has_image:p.has_image,
                     configurable:p.configurable}); }
    bumpBadge(); reprice();
  }
  function count(){return cart.reduce(function(s,l){return s+l.qty;},0);}
  function localTotal(){return cart.reduce(function(s,l){return s+l.price*l.qty;},0);}
  function wire(){
    return cart.map(function(l){
      var o={product_id:l.id,qty:l.qty};
      if(l.avids&&l.avids.length)o.attribute_value_ids=l.avids;
      if(l.combo&&l.combo.length)o.combo=l.combo;
      return o;});
  }

  /* Prices anywhere but a single product come from the SERVER: it owns the
     pricelist, the taxes and the fiscal position. The local sum is a placeholder
     until that answer lands. Generation-guarded so a reply already in flight when
     the cart moved on cannot repaint a stale total. */
  var priceGen=0;
  function reprice(){
    var gen=++priceGen;
    if(!cart.length){ money={total:0,subtotal:0,tax:0}; paintBar(); return Promise.resolve(); }
    paintBar();                                   /* optimistic, then corrected */
    return call('/shop/quote',{lines:wire()}).then(function(d){
      if(gen!==priceGen)return;
      if(d&&d.ok&&d.money)money=d.money;
      paintBar();
    }).catch(function(){});
  }

  /* ------------------------------------------------------------------ paint */
  /* The Register's rule, verbatim: strip an internal reference, treat a parenthetical
     as a qualifier rather than a word, take the first LETTER OR DIGIT of the first two
     words. Unicode-aware, so an Arabic catalogue initials correctly. Kept identical so
     the same dish shows the same two letters on the till and here. */
  function initials(name){
    return String(name||'')
      .replace(/^\[[^\]]*\]\s*/,'')
      .replace(/\([^)]*\)/g,' ')
      .split(/\s+/)
      .map(function(w){ return (w.match(/[\p{L}\p{N}]/u)||[''])[0]; })
      .filter(Boolean).slice(0,2).join('').toUpperCase();
  }

      ? '<img class="kv-card__img" alt="" loading="lazy" src="'+API+'/shop/image/'+
        encodeURIComponent(STORE)+'/'+p.id+'">'
      : '<div class="kv-card__img kv-ph">'+esc(initials(p.name))+'</div>';

      return '<button type="button" class="kv-rail__btn" data-cat="'+c.id+'" '+
        'aria-current="'+(c.id===cat?'true':'false')+'">'+
        '<span class="kv-rail__glyph" aria-hidden="true">'+

          ? '<img alt="" src="'+API+'/shop/categ_image/'+

  function inCat(p){
    if(!cat)return true;
    return (p.pos_categ_ids||[]).indexOf(cat)>=0;
  }

  /* The design leads the menu with a deal. Mezze has no deal-of-the-day field, but
     it has the same THING under another name: a COMBO product is a meal sold as one
     commercial unit -- "8 Pc Chicken + 2 Fries + 2 Drinks" is exactly a combo. The
     branch's combo fills the banner; a branch without one gets no banner rather than
     an invented offer. */
  function dealProduct(){
    return MENU.filter(function(p){return p.is_combo;})
               .sort(function(a,b){return (b.list_price||0)-(a.list_price||0);})[0]||null;
  }
  function paintDeal(){
    var d=dealProduct(), host=$('#deal');
    if(!d||cat){ host.innerHTML=''; return; }      /* only on the unfiltered menu */
    var img=d.has_image
      ? '<img class="kv-deal__img" alt="" src="'+API+'/shop/image/'+
        encodeURIComponent(STORE)+'/'+d.id+'">'
      : '<div class="kv-deal__img kv-ph">'+esc(d.name)+'</div>';
    /* The design splits the name across a small kicker and a large word. Mezze has
       one product name and no second field, so the whole name takes the large line
       and the kicker carries the branch's own description when it wrote one. */
    host.innerHTML='<div class="kv-deal">'+
      '<div class="kv-deal__copy"><div>'+
        (d.description?'<div class="kv-deal__kicker">'+esc(d.description)+'</div>':'')+
        '<div class="kv-deal__name">'+esc(d.name)+'</div>'+
      '</div>'+
      '<div class="kv-deal__price">'+esc(fmt(d.list_price))+'</div></div>'+
      img+
      '<button type="button" class="kv-deal__add" data-add="'+d.id+'">'+
        esc(t('add'))+' +</button></div>';
  }

  function paintMenu(){
    $('#menuTitle').textContent=t('ourMenu');
    paintDeal();
    var current=CATS.find(function(c){return c.id===cat;});
    /* The design heads this "POPULAR ITEMS". Mezze has no popularity ranking, and
       labelling an arbitrary slice "popular" is a claim on a customer's screen that
       the data does not support -- so the unfiltered menu says what it actually is.
       "View all" is kept as a REAL control rather than decoration: it appears when a
       category is filtering the grid and clears the filter. */
    $('#sectionTitle').textContent=current?current.name:t('allItems');
    var all=$('#viewAll');
    all.textContent=t('viewAll')+' \u203A';
    all.classList.toggle('kv-hide',!cat);
    var list=MENU.filter(inCat);
    if(!list.length){
      $('#grid').outerHTML='<div class="kv-empty" id="grid">'+
        '<span class="kv-empty__t">'+esc(t('empty'))+'</span>'+
        '<span class="kv-empty__s">'+esc(t('emptyS'))+'</span></div>';

    var html=list.map(function(p,i){
      var tags=(p.tags||[]).map(function(g){
        return '<span class="kv-card__tag">'+esc(g)+'</span>';}).join('');
      return '<article class="kv-card" style="--kv-i:'+(i%12)+'">'+shot(p)+
        '<div class="kv-card__body">'+
          '<div class="kv-card__name">'+esc(p.name)+'</div>'+
          (p.description?'<p class="kv-card__desc">'+esc(p.description)+'</p>':'')+
          (tags?'<div class="kv-card__tags">'+tags+'</div>':'')+
          '<div class="kv-card__row">'+
            '<span class="kv-card__price">'+esc(fmt(p.list_price))+'</span>'+
            '<button type="button" class="kv-card__add'+
              (p.configurable?' kv-card__add--config':'')+'" data-add="'+p.id+'">'+
              esc(p.configurable?t('choose'):t('add'))+
              (p.configurable?'':' +')+'</button>'+
          '</div>'+
        '</div></article>';
    }).join('');

    g.outerHTML='<div class="kv-grid" id="grid">'+html+'</div>';

  function paintBar(){
    var n=count(), total=money.total||localTotal();
    $('#viewCartLabel').textContent=t('viewCart');
    $('#viewCartCount').textContent=n;
    $('#viewCartTotal').textContent=fmt(total);
    $('#viewCart').disabled=!n;
    /* the design shows the badge and the running total at all times -- an empty
       cart reads 0, not nothing, so the control never changes shape mid-order */
    var badge=$('#cartCount');
    badge.textContent=n;
    badge.classList.remove('kv-hide');

  /* -------------------------------------------------------------- customize */
  var SCREENS=['attract','rewards','menu','customize','cart','checkout',
               'payment','confirm','track'];
  var visited={};
  function show(name){
    screen=name; visited[name]=true;
    SCREENS.forEach(function(n){
      var el=document.getElementById('s-'+n);
      if(el)el.classList.toggle('kv-hide',n!==name);
    });
    /* every screen change resets scroll to the top (README, "Interactions") */
    var body=document.querySelector('#s-'+name+' .kv-screen__body')||
             (name==='menu'?$('#menuCol'):null);
    if(body)body.scrollTop=0;
    /* the design's own transition: opacity 0->1 with a 14px rise, restarted on the
       region that actually changed. Never a loop, never a slide. */
    var el=document.getElementById('s-'+name);
    if(el){ el.classList.remove('kv-in'); void el.offsetWidth; el.classList.add('kv-in'); }
    paintCrumbs(); armIdle();
    /* One statement per screen, and the polling guard AFTER the chain rather than
       inside it -- putting it in the middle silently detached everything below it,
       so attract and rewards only painted when the screen was 'track'. */
    if(name==='cart')paintCart();
    else if(name==='checkout')paintCheckout();
    else if(name==='payment')paintPayment();
    else if(name==='confirm')paintConfirm();
    else if(name==='track')paintTrack();
    else if(name==='attract')paintAttract();
    else if(name==='rewards')paintRewards();
    if(name==='track')startTracking(); else stopTracking();
  }

  function openCustomize(p){
    editing=p;
    groups=PC.groups(p);
    sel=PC.defaultSelection(groups);   /* combos start empty; attributes pre-select */
    qty=1;
    show('customize');
    paintCustomize();
  }

  /* The live figure under the CTA. PREVIEW ONLY: `extraPrice` says so itself, and
     the server re-derives every charge from the chosen values on the next quote. */
  function unitPreview(){
    return ((editing&&editing.list_price)||0)+PC.extraPrice(groups,sel);
  }

  function groupHtml(g,gi){
    var vals=g.values||g.items||[];
    /* The design labels a group with its name and nothing else -- no required or
       optional chip. The signal for an unanswered question is the CTA, which names
       it. Kept that way rather than adding a badge the design does not have. */
    var label='<h2 class="kv-section">'+esc(g.attribute||g.name||'')+'</h2>';

    /* A single-choice question is the design's SEGMENTED control; anything that
       takes more than one answer is its option LIST. Which one a group gets is
       decided by the group's own cardinality, never by where it sits. */
    var single=(g.kind!=='combo'&&!g.multi);
    if(single){
      return label+'<div class="kv-segmented" role="radiogroup">'+
        vals.map(function(v){
          var on=PC.isOn(sel,g,v.id);
          return '<button type="button" role="radio" aria-checked="'+(on?'true':'false')+
            '" data-g="'+gi+'" data-v="'+v.id+'">'+
            '<span class="kv-radio"></span>'+esc(v.name)+
            (v.price_extra?'<span class="kv-option__price">+'+esc(fmt(v.price_extra))+'</span>':'')+
            '</button>';}).join('')+'</div>';
    }
    return label+'<div class="kv-option-list">'+
      vals.map(function(v){
        var on=PC.isOn(sel,g,v.id);
        var extra=(g.kind==='combo')?(v.extra_price||0):(v.price_extra||0);
        return '<button type="button" class="kv-option" role="checkbox" '+
          'aria-checked="'+(on?'true':'false')+'" data-g="'+gi+'" data-v="'+v.id+'">'+
          '<span class="kv-check">'+(on?'&#10003;':'')+'</span>'+
          '<span class="kv-option__name">'+esc(v.name)+'</span>'+
          '<span class="kv-option__price">'+
            (extra?('+'+esc(fmt(extra))):esc(t('included')))+'</span>'+
          '</button>';}).join('')+'</div>';
  }

  function paintCustomize(){
    var p=editing; if(!p)return;
    var img=p.has_image
      ? '<img class="kv-cust__img" alt="" src="'+API+'/shop/image/'+
        encodeURIComponent(STORE)+'/'+p.id+'">'
      : '<div class="kv-cust__img kv-ph">'+esc(initials(p.name))+'</div>';
    $('#custBody').innerHTML=
      '<div class="kv-back">'+
        '<button type="button" class="kv-back__btn" id="custBack" aria-label="'+esc(t('back'))+'">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '+
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
          '<path d="M15 4 7 12l8 8"/></svg></button>'+
        '<h1 class="kv-back__title">'+esc(t('customize'))+'</h1>'+
      '</div>'+
      '<div class="kv-cust__hero">'+img+
        '<div class="kv-cust__info">'+
          '<div class="kv-cust__name">'+esc(p.name)+'</div>'+
          '<div class="kv-cust__price">'+esc(fmt(p.list_price))+'</div>'+
          (p.description?'<p class="kv-cust__desc">'+esc(p.description)+'</p>':'')+
        '</div>'+
      '</div>'+
      groups.map(groupHtml).join('');
    paintCustFoot();

  function paintCustFoot(){
    $('#custQtyVal').textContent=qty;
    $('#custQty').querySelector('[data-q="-1"]').disabled=(qty<=1);
    var missing=PC.missingRequired(groups,sel);
    var ok=!missing.length;
    $('#custAdd').disabled=!ok;
    /* A blocked CTA that only greys out does not say WHY. It names the question
       still owed, which is the difference between a dead button and an instruction. */
    $('#custAddLabel').textContent = ok
      ? t('addToCart')
      : t('answerFirst').replace('%s',
          missing[0].attribute||missing[0].name||t('chooseOne'));
    $('#custAddTotal').textContent = ok ? fmt(unitPreview()*qty) : '';
    $('#custAddTotal').previousElementSibling.style.visibility = ok ? '' : 'hidden';
  }

  function commitCustomize(){
    if(!editing)return;
    if(PC.missingRequired(groups,sel).length)return;
    var c=PC.chosen(groups,sel);
    var key=PC.lineKey(editing.id,c.ids,'',c.combo);
    var e=cart.find(function(x){return x.key===key;});
    if(e){ e.qty+=qty; }
    else{ cart.push({key:key,id:editing.id,name:editing.name,
        price:unitPreview(),qty:qty,avids:c.ids,combo:c.combo,names:c.names,
        has_image:editing.has_image,configurable:editing.configurable}); }
    editing=null; groups=[]; sel={}; qty=1;
    bumpBadge(); show('menu'); paintMenu(); reprice();
  }

  /* ------------------------------------------------------------- attract */
  var a11y={sr:false,text:false,contrast:false,reach:false};
  function paintAttract(){
    $('#atTitle').textContent=t('startTitle');
    $('#atKicker').textContent=t('startKicker');
    $('#atHero').textContent=(CFG&&CFG.branch)||'';
    $('#atStart').textContent=t('tapToStart');
    $('#atLangTitle').textContent=t('chooseLang');
    $('#atA11yTitle').textContent=t('accessibility');
    $('#atRewards').textContent=t('signIn');
    $('#atHelpT').textContent=t('helpT'); $('#atHelpS').textContent=t('helpS');
    $('#atTapT').textContent=t('tapT');   $('#atTapS').textContent=t('tapS');
    /* The languages the BRANCH actually publishes. The design lists three; Mezze
       ships the two it has a full translation for, because a language in the list
       that the screen cannot speak is worse than one that is absent. */
    $('#atLangs').innerHTML=[['en','English'],['ar','العربية']].map(function(l){
      return '<button type="button" class="kv-tile" data-lang="'+l[0]+'" aria-pressed="'+
        (lang===l[0]?'true':'false')+'">'+esc(l[1])+'</button>';}).join('');
    /* the design's four modes. Screen Reader shows the headphone-jack banner and is
       wired to nothing else here -- Mezze has no audio-guidance service yet, which is
       stated rather than faked. */
    var modes=[['sr','Screen Reader','&#9836;'],['text','Text Size','A'],
               ['contrast','High Contrast','&#9788;'],['reach','Touch Assist','&#9855;']];
    paintPalettes();
    $('#atA11y').innerHTML=modes.map(function(m){
      var on=a11y[m[0]];
      return '<button type="button" class="kv-tile kv-tile--stack" data-a11y="'+m[0]+
        '" aria-pressed="'+(on?'true':'false')+'">'+
        '<span class="kv-tile__glyph" aria-hidden="true">'+m[2]+'</span>'+
        '<span class="kv-tile__name">'+esc(m[1])+'</span>'+
        '<span class="kv-tile__state">'+esc(t(on?'on':'off'))+'</span></button>';}).join('');
  }
  function setA11y(k){
    a11y[k]=!a11y[k];
    var h=document.documentElement;
    if(k==='contrast')h.setAttribute('data-mz-theme',a11y.contrast?'highcontrast':'classic');
    if(k==='text')h.setAttribute('data-kv-text',a11y.text?'large':'');
    if(k==='reach')h.setAttribute('data-kv-reach',a11y.reach?'on':'');
    if(k==='text')fitStage();
    if(k==='sr'){ var b=$('#srBanner');
      if(b){ b.textContent=t('srBanner'); b.classList.toggle('kv-hide',!a11y.sr); } }
    paintAttract();
  }

  /* ------------------------------------------------------------ checkout */
  var payMethod=null, serviceMode=null;
  /* The branch publishes eat_in / takeaway in /kiosk/config. The design has no
     service screen, so the question is asked on CHECKOUT beside the payment
     choice -- the same family of decision, and it keeps the flow at nine screens. */
  function serviceOptions(){
    return ((CFG&&CFG.service_options)||[]).filter(function(o){
      return o.kind==='service_mode'&&o.service_mode; });
  }
  function svcLabel(o){
    if(o.service_mode==='eat_in')return t('eatIn');
    if(o.service_mode==='takeaway')return t('takeaway');
    return o.name||'';
  }
  function paintCheckout(){
    var opts=(CFG&&CFG.payment_options)||[];
    if(!payMethod&&opts.length)payMethod=opts[0].code;
    var svcOpts=serviceOptions();
    if(!serviceMode){
      /* the branch's own default: its self_ordering_service_mode picks which of the
         two is pre-selected, so a takeaway-only shop needs no tap at all */
      var def=svcOpts.filter(function(o){return o.default;})[0]||svcOpts[0];
      serviceMode=def?def.service_mode:'takeaway';
    }
    $('#coBody').innerHTML='<h1 class="kv-title">'+esc(t('coTitle'))+'</h1>'+
      '<div class="kv-menu__head"><h2 class="kv-menu__title">'+

        '<button class="kv-menu__all" data-go="cart">'+esc(t('editOrder'))+' ›</button></div>'+

        return '<div class="kv-summary__row">'+lineImg(l,'kv-summary__img')+

            '<button type="button" data-cq="'+i+'|-1">−</button>'+
            '<output>'+l.qty+'</output>'+
            '<button type="button" data-cq="'+i+'|1">+</button></div>'+
          '<span class="kv-summary__line">'+esc(fmt(l.price*l.qty))+'</span>'+
          '</div>';}).join('')+'</div>'+
      totalsHtml(true)+
      (svcOpts.length>1
        ? '<h2 class="kv-section">'+esc(t('howEat'))+'</h2>'+
          '<div class="kv-segmented" role="radiogroup">'+svcOpts.map(function(o){
            return '<button type="button" role="radio" data-svc="'+esc(o.service_mode)+'" '+
              'aria-checked="'+(serviceMode===o.service_mode?'true':'false')+'">'+
              '<span class="kv-radio"></span>'+esc(svcLabel(o))+'</button>';}).join('')+
          '</div>'
        : '')+

      '<div class="kv-pay-list">'+opts.map(function(o){
        return '<button type="button" class="kv-pay" role="radio" data-pm="'+esc(o.code)+'" '+
          'aria-checked="'+(payMethod===o.code?'true':'false')+'">'+
          '<span class="kv-pay__glyph" aria-hidden="true">■</span>'+

            '<small>'+esc(payHint(o))+'</small></span>'+
          '<span aria-hidden="true">›</span></button>';}).join('')+'</div>';

  /* the payment card's words come from a CODE, never from a server-rendered label —
     the same rule the live kiosk keeps, because the language toggle is client-side */
  function payLabel(o){
    if(!o)return '';
    if(o.code==='pay_at_counter')return t(o.at_table?'payTable':'payCounter');
    return o.name||'';
  }
  function payHint(o){
    if(!o)return '';
    if(o.code==='pay_at_counter')return t(o.at_table?'payTableHint':'payCounterHint');
    return o.hint||'';

  /* ------------------------------------------------------------- payment */
  function paintPayment(){
    var opts=(CFG&&CFG.payment_options)||[];
    var m=opts.filter(function(o){return o.code===payMethod;})[0]||opts[0];
    $('#payBody').innerHTML='<h1 class="kv-title">'+esc(t('payTitle'))+'</h1>'+
      '<div class="kv-amount"><span>'+esc(t('amountToPay'))+'</span>'+
        '<b>'+esc(fmt(money.total||localTotal()))+'</b></div>'+
      '<div class="kv-method-label">'+esc(payLabel(m))+'</div>'+
      '<div class="kv-methods">'+
        '<div class="kv-methods__terminal kv-ph">'+esc(t('terminal'))+'</div>'+
        '<div class="kv-instruct"><span>'+esc(t('tapInsert'))+'</span>'+
          '<span class="kv-or">'+esc(t('or'))+'</span>'+
          '<span>'+esc(t('scanQr'))+'</span></div>'+
        '<div class="kv-methods__qr kv-ph">QR</div>'+
      '</div>'+
      '<div class="kv-assurance">'+
        '<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '+
        'style="flex:none;color:var(--kv-accent)">'+
        '<path d="M12 2 4 5v6c0 5 3.4 8.6 8 11 4.6-2.4 8-6 8-11V5l-8-3Z"/>'+
        '<rect x="9" y="10" width="6" height="5" rx="1"/><path d="M10.5 10V8.5a1.5 1.5 0 0 1 3 0V10"/>'+
        '</svg>'+
        '<span><strong>'+t('secure')+'</strong><p>'+esc(t('secureS'))+'</p></span></div>';
    $('#payGo').textContent=t('placeOrder');
    $('#payCancel').textContent=t('cancelOrder');
  }

  /* ------------------------------------------------------------- confirm */
  var lastOrder=null, receipt=null, trackItems=0;
  /* The number the guest is CALLED by. /shop/order returns it as `tracking` -- the
     branch's own tracking number, falling back to the POS reference -- so that is
     what the confirmation and the status screen show. */
  function orderNumber(){
    return (lastOrder&&(lastOrder.tracking||lastOrder.pos_reference))||'';
  }
  function paintConfirm(){
    var num=orderNumber();
    $('#cfBody').innerHTML=
      '<div class="kv-tick" aria-hidden="true">✓</div>'+
      '<h1 class="kv-thanks">'+esc(t('thanks'))+'</h1>'+
      '<div class="kv-thanks-sub">'+esc(t('placed'))+'</div>'+
      '<div class="kv-order-box"><span>'+esc(t('orderNumber'))+'</span>'+
        '<div class="kv-order-no">'+esc(num)+'</div></div>'+
      '<div class="kv-pickup"><strong>'+esc(t('prepare'))+'</strong>'+
        '<p>'+esc(t('collect'))+'</p></div>'+
      '<div class="kv-rule"></div>'+
      '<h2 class="kv-section">'+esc(t('howReceipt'))+'</h2>'+
      '<div class="kv-receipt-grid">'+
        [['print',t('printed'),t('printedS'),
          '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
          'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg>'],
         ['none',t('noReceipt'),t('noReceiptS'),'✕']].map(function(r){
          return '<button type="button" class="kv-receipt" role="radio" data-rc="'+r[0]+'" '+
            'aria-checked="'+(receipt===r[0]?'true':'false')+'">'+
            '<span class="kv-receipt__glyph" aria-hidden="true">'+r[3]+'</span>'+
            '<strong>'+esc(r[1])+'</strong><small>'+esc(r[2])+'</small></button>';}).join('')+
      '</div>'+
      (receipt?'<div class="kv-receipt-note">'+
        esc(t('receiptChosen').replace('%s',receipt==='print'?t('printed'):t('noReceipt')))+
        '</div>':'');
    $('#cfTrack').textContent=t('trackOrder');
    $('#cfHome').textContent=t('backHome');
  }

  /* --------------------------------------------------------------- track
     LIVE, not a placeholder. /shop/order hands back an opaque `status_token`, and
     /shop/status turns it into the branch's real public status -- received /
     confirmed / preparing / ready / completed -- computed from the KDS tickets.
     The token is the only input the endpoint takes (never a sequential id) and it
     is rate-limited, so polling it from a customer screen is the supported path. */
  var STATUS_STEP={received:1,confirmed:1,preparing:2,ready:3,completed:3,
                   out_for_delivery:3,cancelled:1,action_required:1};
  var trackTimer=null;
  function stopTracking(){ clearInterval(trackTimer); trackTimer=null; }
  function startTracking(){
    stopTracking();
    var tok=lastOrder&&lastOrder.status_token;
    if(!tok) return;                     /* no token: the steps stay where they are */
    var poll=function(){
      call('/shop/status',{token:tok}).then(function(d){
        if(!d||!d.ok||screen!=='track') return;
        var st=STATUS_STEP[d.status]||1;
        if(st!==liveStep){ liveStep=st; paintTrack(); }
      }).catch(function(){});
    };
    poll();
    trackTimer=setInterval(poll,10000);   /* the kitchen does not move faster than this */
  }
  var liveStep=1;
  function paintTrack(){
    var num=orderNumber();
    var step=liveStep;
    var rows=[[1,t('received'),t('receivedS')],
              [2,t('preparing'),t('preparingS')],
              [3,t('ready'),t('readyS')]];
    $('#trBody').innerHTML=
      '<div class="kv-eyebrow">'+esc(t('orderStatus'))+'</div>'+
      '<div class="kv-track-no">'+esc(num)+'</div>'+
      '<div class="kv-steps">'+rows.map(function(r){
        var state=r[0]<step?'done':(r[0]===step?'active':'pending');
        var tag=state==='done'?t('stepDone'):(state==='active'?t('stepNow'):t('stepNext'));
        return '<div class="kv-step" data-state="'+state+'">'+
          '<span class="kv-step__marker">'+r[0]+'</span>'+
          '<span class="kv-step__text"><strong>'+esc(r[1])+'</strong>'+
            '<small>'+esc(r[2])+'</small></span>'+
          '<span class="kv-step__tag">'+esc(tag)+'</span></div>';}).join('')+'</div>'+
      '<div class="kv-stat-grid">'+
        /* the ETA is the BRANCH's, returned by /shop/order -- not a number we chose */
        ((lastOrder&&lastOrder.eta_minutes)
          ? '<div class="kv-stat"><span>'+esc(t('estWait'))+'</span><b>'+
            esc(lastOrder.eta_minutes+' '+t('min'))+'</b></div>' : '')+
        '<div class="kv-stat"><span>'+esc(t('collectAt'))+'</span><b>'+esc(t('counter'))+'</b></div>'+
        '<div class="kv-stat"><span>'+esc(t('itemsLabel'))+'</span><b>'+trackItems+'</b></div>'+
      '</div>';
    $('#trHome').textContent=t('backHome');
  }

  /* ------------------------------------------------------------- ordering */
  function placeOrder(){
    var btn=$('#payGo'); if(btn.disabled)return; btn.disabled=true;
    /* Everything the guest actually told this terminal, not just the food. The
       server re-validates each one -- a public kiosk's word is a courtesy. */
    call('/shop/order',{fulfillment:'kiosk',
      service_mode:serviceMode, lines:wire(),
      payment_code:payMethod||undefined,
      phone:phone||undefined}).then(function(d){
      btn.disabled=false;
      if(d&&d.ok){ lastOrder=d; trackItems=count(); liveStep=1; show('confirm'); }
    }).catch(function(){ btn.disabled=false; });
  }
  function resetKiosk(){
    cart=[]; money={total:0,subtotal:0,tax:0}; lastOrder=null; receipt=null;
    payMethod=null; serviceMode=null; phone=''; editing=null; cat=0; visited={};
    trackItems=0; liveStep=1; stopTracking();
    paintRail(); paintMenu(); paintBar(); show('attract');
  }

  /* --------------------------------------------------------- breadcrumbs
     The steps ALREADY taken, never the ones ahead: offering "Pay" before there is
     a cart would invite skipping it. Each crumb is a real destination, the current
     one is not a button, and the trail hides on the screens that own the whole
     panel (attract, rewards) or that end the order (confirm, track). */
  /* CUSTOMIZE is deliberately not a crumb. It is a detour into one product, not a
     stage of the order, and a crumb back to it from the cart would have no product
     to show. The design's own answers for returning to it are the back chevron and
     the cart line's Edit; both are kept. */
  var TRAIL=[['menu','crumbMenu'],['cart','crumbCart'],
             ['checkout','crumbCheckout'],['payment','crumbPay']];
  function paintCrumbs(){
    var host=$('#crumbs');
    var order=TRAIL.map(function(x){return x[0];});
    var idx=order.indexOf(screen);
    if(idx<0){ host.classList.add('kv-hide'); host.innerHTML=''; return; }
    /* only the steps ACTUALLY reached. Deriving the trail from position instead
       would offer a guest who never opened a product a crumb back into one. */
    var shown=TRAIL.slice(0,idx+1).filter(function(x,i){
      return i===idx||visited[x[0]]; });
    host.classList.remove('kv-hide');
    host.innerHTML=shown.map(function(x,i){
      var cur=(x[0]===screen);
      return (i?'<span class="kv-crumb__sep" aria-hidden="true">›</span>':'')+
        '<button type="button" class="kv-crumb"'+(cur?' aria-current="step" disabled':
          ' data-crumb="'+x[0]+'"')+'>'+esc(t(x[1]))+'</button>';
    }).join('');
  }

  /* ------------------------------------------------------------- palettes
     The four the design ships. Hidden unless the branch opts in with ?palettes=1
     -- a guest is not normally offered a repaint, and a branch that has chosen its
     colour should not have that choice second-guessed on the idle screen. */
  var PALETTES=[['signature','#C8102E'],['crimson','#E4002B'],
                ['ember','#D2500F'],['charcoal','#1F1F1F']];
  function paintPalettes(){
    var wrap=$('#atPaletteWrap');
    if(!P.get('palettes')){ wrap.classList.add('kv-hide'); return; }
    wrap.classList.remove('kv-hide');
    $('#atPaletteTitle').textContent=t('palette');
    var cur=document.documentElement.getAttribute('data-mz-accent');
    $('#atPalettes').innerHTML=PALETTES.map(function(p){
      return '<button type="button" class="kv-swatch" data-pal="'+p[0]+'" '+
        'aria-pressed="'+(cur===p[0]?'true':'false')+'" aria-label="'+esc(p[0])+'" '+
        'style="--kv-swatch:'+p[1]+'"><i></i></button>';}).join('');
  }

  /* ----------------------------------------------------------- kiosk mode
     Idle reset, connection state, and the browser affordances a kiosk must not
     have. The idle prompt appears BEFORE the reset with a countdown, so a guest
     who is simply reading is not wiped mid-order without warning. */
  var IDLE_WARN=75000, IDLE_GRACE=15000, idleT=null, graceT=null, tick=null;
  function armIdle(){
    if(!KIOSK) return;
    clearTimeout(idleT); clearTimeout(graceT); clearInterval(tick);
    $('#idle').classList.add('kv-hide');
    if(screen==='attract') return;          /* the idle screen cannot go more idle */
    idleT=setTimeout(warnIdle,IDLE_WARN);
  }
  function warnIdle(){
    var left=Math.ceil(IDLE_GRACE/1000);
    $('#idleT').textContent=t('stillThere');
    $('#idleS').textContent=t('idleS');
    $('#idleGo').textContent=t('keepGoing');
    $('#idleN').textContent=left;
    $('#idle').classList.remove('kv-hide');
    tick=setInterval(function(){ left-=1; $('#idleN').textContent=Math.max(0,left); },1000);
    graceT=setTimeout(function(){ clearInterval(tick); resetKiosk(); },IDLE_GRACE);
  }
  function setNet(down){
    var el=$('#net');
    el.textContent=t('offline');
    el.classList.toggle('kv-hide',!down);
  }
  var KIOSK=false;
  function enterKioskMode(){
    /* ?kiosk=0 turns it off for a desk review; on by default, because this page IS
       the kiosk and a panel in a restaurant must not offer a context menu. */
    KIOSK=(P.get('kiosk')!=='0');
    if(!KIOSK) return;
    document.documentElement.setAttribute('data-kv-kiosk','on');
    document.addEventListener('contextmenu',function(e){e.preventDefault();});
    document.addEventListener('gesturestart',function(e){e.preventDefault();});
    document.addEventListener('dblclick',function(e){e.preventDefault();});
    ['pointerdown','keydown','wheel'].forEach(function(ev){
      document.addEventListener(ev,armIdle,{passive:true,capture:true});});
    window.addEventListener('offline',function(){setNet(true);});
    window.addEventListener('online',function(){setNet(false);});
    setNet(!navigator.onLine);
  }

  /* the badge acknowledges an item without moving anything around it */
  function bumpBadge(){
    var b=$('#cartCount'); if(!b) return;
    b.classList.remove('kv-bumped'); void b.offsetWidth; b.classList.add('kv-bumped');
  }

  /* ------------------------------------------------------------------ events */
  document.addEventListener('click',function(e){
    var r=e.target.closest('[data-cat]');
    if(r){ cat=parseInt(r.getAttribute('data-cat'),10)||0; paintRail(); paintMenu();
           $('#menuCol').scrollTop=0; return; }
    var a=e.target.closest('[data-add]');
    if(a){ var id=parseInt(a.getAttribute('data-add'),10);
           var p=MENU.find(function(x){return x.id===id;});
           if(!p)return;
           /* A product that asks a question goes to the question. A plain one goes
              straight into the cart — the design's own two affordances. */
           if(p.configurable)openCustomize(p); else addToCart(p);
           return; }

    var cb=e.target.closest('[data-crumb]');
    if(cb){ show(cb.getAttribute('data-crumb')); return; }

    var pal=e.target.closest('[data-pal]');
    if(pal){ document.documentElement.setAttribute('data-mz-accent',
             pal.getAttribute('data-pal')); paintPalettes(); return; }

    if(e.target.closest('#idleGo')){ armIdle(); return; }

    var go=e.target.closest('[data-go]');
    if(go){ show(go.getAttribute('data-go')); return; }

    var lang=e.target.closest('[data-lang]');
    if(lang){ setLang(lang.getAttribute('data-lang'));
      paintRail(); paintMenu(); paintBar(); paintAttract(); return; }

    var mode=e.target.closest('[data-a11y]');
    if(mode){ setA11y(mode.getAttribute('data-a11y')); return; }

    if(e.target.closest('#atStart')){ show('menu'); return; }
    if(e.target.closest('#atRewards')){ show('rewards'); return; }
    if(e.target.closest('#rwSkip')||e.target.closest('#rwGo')){ show('menu'); return; }

    var key=e.target.closest('[data-key]');
    if(key&&screen==='rewards'){
      var k=key.getAttribute('data-key');
      if(k==='⌫')phone=phone.slice(0,-1);
      else if(/^[0-9]$/.test(k)){ if(phone.length<10)phone+=k; }
      else phone='';
      paintRewards(); return;
    }

    var cq=e.target.closest('[data-cq]');
    if(cq){
      var parts=cq.getAttribute('data-cq').split('|');
      var line=cart[parseInt(parts[0],10)];
      if(line){ line.qty+=parseInt(parts[1],10);
        if(line.qty<=0)cart.splice(cart.indexOf(line),1);
        reprice().then(function(){ if(screen==='cart')paintCart();
          else if(screen==='checkout')paintCheckout(); });
        if(screen==='cart')paintCart(); else if(screen==='checkout')paintCheckout(); }
      return;
    }
    var del=e.target.closest('[data-del]');
    if(del){ cart.splice(parseInt(del.getAttribute('data-del'),10),1);
      /* the design deletes outright -- a kiosk queue is short and an accidental
         delete is cheaper than a modal in front of the person behind you */
      reprice().then(function(){ paintCart(); }); paintCart(); return; }
    var ed=e.target.closest('[data-edit]');
    if(ed){ var l=cart[parseInt(ed.getAttribute('data-edit'),10)];
      var prod=l&&MENU.filter(function(x){return x.id===l.id;})[0];
      if(prod)openCustomize(prod); return; }

    var sv=e.target.closest('[data-svc]');
    if(sv){ serviceMode=sv.getAttribute('data-svc'); paintCheckout(); return; }

    var pm=e.target.closest('[data-pm]');
    if(pm){ payMethod=pm.getAttribute('data-pm'); paintCheckout(); return; }
    if(e.target.closest('#coGo')){ show('payment'); return; }
    if(e.target.closest('#payGo')){ placeOrder(); return; }
    if(e.target.closest('#payCancel')){ show('cart'); return; }

    var rc=e.target.closest('[data-rc]');
    if(rc){ receipt=rc.getAttribute('data-rc'); paintConfirm();
      /* the order already exists by now, so this is its own token-authorised call */
      var tk=lastOrder&&lastOrder.status_token;
      if(tk)call('/shop/receipt',{token:tk,receipt:receipt}).catch(function(){});
      return; }
    if(e.target.closest('#cfTrack')){ show('track'); return; }
    if(e.target.closest('#cfHome')||e.target.closest('#trHome')){ resetKiosk(); return; }

    if(e.target.closest('#cartBtn')){ show('cart'); return; }

    if(e.target.closest('#viewAll')){ cat=0; paintRail(); paintMenu();
      $('#menuCol').scrollTop=0; return; }

    if(e.target.closest('#custBack')){ editing=null; show('menu'); return; }

    var q=e.target.closest('[data-q]');
    if(q&&screen==='customize'){
      qty=Math.max(1,qty+(parseInt(q.getAttribute('data-q'),10)||0));
      paintCustFoot(); return;
    }

    var opt=e.target.closest('[data-g][data-v]');
    if(opt&&screen==='customize'){
      var g=groups[parseInt(opt.getAttribute('data-g'),10)];
      var vid=parseInt(opt.getAttribute('data-v'),10);
      /* the canonical rule decides what a tap DOES — multi toggles, single
         replaces, tapping the chosen one again clears it */
      sel=PC.toggle(g,vid,sel);
      paintCustomize(); return;
    }

    if(e.target.closest('#custAdd')){ commitCustomize(); return; }
    if(e.target.closest('#attendant')){
      var b=$('#attendantBanner');
      b.textContent=t('attendant');
      b.classList.toggle('kv-hide');
      return;
    }
  });

  /* ---------------------------------------------------------------- the stage
     The design is drawn on a 1080x1920 panel. On the kiosk that IS the screen and
     the factor is 1; anywhere else the whole stage is scaled so a reviewer sees the
     design's proportions rather than a reflow of them. Orientation follows the
     panel, which is what the hardware reports. */
  function fitStage(){
    /* The panel decides, unless a reviewer asks for the other one: real hardware is
       fixed in its orientation, but comparing against the design on a laptop needs
       the portrait stage on a landscape window. */
    var forced=P.get('orientation');
    var landscape=forced?(forced==='landscape'):(window.innerWidth>window.innerHeight);
    document.documentElement.setAttribute('data-kv-orientation',landscape?'landscape':'portrait');
    var w=landscape?1920:1080, h=landscape?1080:1920;
    var fit=Math.min(window.innerWidth/w, window.innerHeight/h);
    document.documentElement.style.setProperty('--kv-fit',String(fit));
  }
  fitStage();
  window.addEventListener('resize',fitStage);
  window.addEventListener('orientationchange',fitStage);
  enterKioskMode();

  /* -------------------------------------------------------------------- boot */
  function boot(){
    return call('/kiosk/config',{}).then(function(c){
      if(c&&c.ok){
        CFG=c;
        $('#branch').textContent=c.branch||'';
        /* ?lang= overrides the branch default, as on the live kiosk: a tester
           needs to reach Arabic without reconfiguring the branch. */
        setLang(P.get('lang')||((c.default_lang||'').indexOf('ar')===0?'ar':'en'));
      } else { setLang(P.get('lang')||'en'); }
      return call('/shop/menu',{channel:'kiosk'});
    }).then(function(m){
      if(m&&m.ok){ CATS=m.categories||[]; MENU=m.products||[]; }
      paintRail(); paintMenu(); paintBar();
      /* ?screen= opens a given page directly. A reviewer needs to put one screen
         beside its design without walking the whole flow to reach it; the kiosk
         itself never links to it. */
      var want=P.get('screen');
      if(want==='customize'){
        var first=MENU.filter(function(x){return x.configurable;})[0]||MENU[0];
        if(first)openCustomize(first);
      } else if(want&&SCREENS.indexOf(want)>=0){ show(want); }
      else { show('attract'); }
    }).catch(function(){ paintRail(); paintMenu(); paintBar(); });
  }
  boot();

  /* a debug handle, the same affordance the other Mezze surfaces expose */
  if(P.get('debug')){ window.MezzeKioskV3={state:function(){
    return {CFG:CFG,CATS:CATS,MENU:MENU,cart:cart,cat:cat,money:money,lang:lang,
            screen:screen,lastOrder:lastOrder,liveStep:liveStep,visited:visited};},
    addToCart:addToCart, show:show, openCustomize:openCustomize,
    setLang:setLang, fitStage:fitStage}; }
})();
</script>
</body>
</html>
